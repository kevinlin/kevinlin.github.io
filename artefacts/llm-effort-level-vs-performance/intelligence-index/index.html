<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artificial Analysis Intelligence Index: Score vs. Output Tokens per Task</title>
<script src="../../vendor/chart.umd.min.js"></script>
<script src="../../vendor/chartjs-plugin-datalabels.min.js"></script>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; margin: 0; padding: 32px 40px; background: #fff; color: #1a1a1a; }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 6px; }
  .subtitle { font-family: Arial, sans-serif; font-size: 14px; color: #8a8a8a; margin: 0 0 20px; max-width: 640px; line-height: 1.4; }
  .legend { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin: 14px 0 8px; }
  .legend .item { display: flex; align-items: center; gap: 8px; }
  .legend .dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; }
  .quad-key { font-family: Arial, sans-serif; font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .quad-key .swatch { width: 34px; height: 18px; background: #d9f2d9; border: 1px solid #cfeccf; display: inline-block; }
  .wrap { position: relative; width: 100%; max-width: 100%; height: 720px; }
</style>
</head>
<body>
  <h1>Artificial Analysis Intelligence Index: Score vs. Output Tokens per Task</h1>
  <p class="subtitle">Artificial Analysis Intelligence Index score &middot; Output tokens per task for Artificial Analysis Intelligence Index</p>

  <div class="legend" id="legend"></div>

  <div class="wrap"><canvas id="chart"></canvas></div>

<script>
Chart.register(ChartDataLabels);

const COLORS = {
  OpenAI:   '#111111',
  Anthropic:'#e08a5a',
  DeepSeek: '#2323d6',
  MiniMax:  '#e0117f',
  Kimi:     '#12a5e0',
  'Z AI':   '#4ea2ff',
  Alibaba:  '#f5951b'
};

// Effort-level families (connected by a thin line, sorted by x)
const families = [
  { name:'GPT-5.5', color:COLORS.OpenAI, points:[
      {x:2140,y:43.46,label:'GPT-5.5 (low)',al:'right',ao:8},
      {x:5132,y:50.41,label:'GPT-5.5 (medium)',al:'left',ao:8},
      {x:10076,y:53.13,label:'GPT-5.5 (high)',al:'left',ao:8},
      {x:16064,y:54.84,label:'GPT-5.5 (xhigh)',al:'bottom',ao:24} ]},
  { name:'GPT-5.6 Sol', color:COLORS.OpenAI, points:[
      {x:2508,y:49.44,label:'GPT-5.6 Sol (low)',al:'right',ao:8},
      {x:4203,y:53.59,label:'GPT-5.6 Sol (medium)',al:'top',ao:8},
      {x:6690,y:55.87,label:'GPT-5.6 Sol (high)',al:'left',ao:8},
      {x:9941,y:57.65,label:'GPT-5.6 Sol (xhigh)',al:'left',ao:8},
      {x:15346,y:58.89,label:'GPT-5.6 Sol (max)',al:'left',ao:8} ]},
  { name:'GPT-5.6 Terra', color:COLORS.OpenAI, points:[
      {x:2258,y:40.47,label:'GPT-5.6 Terra (low)',al:'right',ao:8},
      {x:3769,y:45.57,label:'GPT-5.6 Terra (medium)',al:'right',ao:8},
      {x:7738,y:48.95,label:'GPT-5.6 Terra (high)',al:'right',ao:8},
      {x:11036,y:51.60,label:'GPT-5.6 Terra (xhigh)',al:'right',ao:8},
      {x:19370,y:54.95,label:'GPT-5.6 Terra (max)',al:'bottom',ao:8} ]},
  { name:'Claude Opus 5', color:COLORS.Anthropic, points:[
      {x:6067,y:50.61,label:'Claude Opus 5 (low)',al:'right',ao:8},
      {x:11564,y:56.28,label:'Claude Opus 5 (medium)',al:'right',ao:8},
      {x:19692,y:58.86,label:'Claude Opus 5 (high)',al:'right',ao:8},
      {x:28703,y:60.07,label:'Claude Opus 5 (xhigh)',al:'left',ao:8},
      {x:36978,y:60.69,label:'Claude Opus 5 (max)',al:'top',ao:8} ]},
  { name:'Claude Sonnet 5', color:COLORS.Anthropic, dashed:true, points:[
      {x:9709,y:41.73,label:'Claude Sonnet 5 (Non-reasoning)',al:'right',ao:8},
      {x:68736,y:53.35,label:'Claude Sonnet 5 (max)',al:'right',ao:8} ]},
  { name:'DeepSeek V4 Pro', color:COLORS.DeepSeek, points:[
      {x:27231,y:43.11,label:'DeepSeek V4 Pro (high)',al:'right',ao:8},
      {x:36963,y:44.27,label:'DeepSeek V4 Pro (max)',al:'right',ao:8} ]}
];

// Standalone single points
const singles = [
  {x:33127,y:59.86,label:'Claude Fable 5 (max)',prov:'Anthropic',al:'right',ao:24},
  {x:22373,y:45.99,label:'Qwen3.7 Max',prov:'Alibaba',al:'right',ao:8},
  {x:23632,y:57.11,label:'Kimi K3',prov:'Kimi',al:'right',ao:40},
  {x:23964,y:44.44,label:'MiniMax-M3',prov:'MiniMax',al:'left',ao:8},
  {x:40910,y:55.69,label:'Claude Opus 4.8 (max)',prov:'Anthropic',al:'right',ao:8},
  {x:42791,y:51.09,label:'GLM-5.2 (max)',prov:'Z AI',al:'right',ao:8}
];

const labelCfg = {
  align:(ctx)=>{ const a=ctx.dataset.data[ctx.dataIndex].al; return a || 'right'; },
  anchor:(ctx)=>{ const a=ctx.dataset.data[ctx.dataIndex].al; return (a==='top'||a==='bottom')?'center':(a==='left'?'start':'end'); },
  offset:(ctx)=>{ const o=ctx.dataset.data[ctx.dataIndex].ao; return (o==null)?6:o; },
  font:{ family:'Arial', size:13 }, color:'#1a1a1a',
  formatter:(v)=> v.label
};

const datasets = [];

// Line datasets (thin connectors) + point labels
families.forEach(f=>{
  datasets.push({
    label:f.name, type:'scatter',
    data:f.points,
    showLine:true, borderColor:f.color, borderWidth:1.2,
    borderDash: f.dashed ? [5,4] : [],
    pointBackgroundColor:f.color, pointBorderColor:f.color,
    pointRadius:7, pointHoverRadius:8,
    datalabels:labelCfg
  });
});

// Single points grouped so colors stay correct
datasets.push({
  label:'singles', type:'scatter',
  data:singles,
  showLine:false,
  pointBackgroundColor:singles.map(s=>COLORS[s.prov]),
  pointBorderColor:singles.map(s=>COLORS[s.prov]),
  pointRadius:7, pointHoverRadius:8,
  datalabels:labelCfg
});

new Chart(document.getElementById('chart'), {
  type:'scatter',
  data:{ datasets },
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{ padding:{ right:120, top:10 } },
    plugins:{
      legend:{ display:false },
      tooltip:{ callbacks:{ label:(c)=>`${c.raw.label}: ${c.raw.y} @ ${c.raw.x.toLocaleString()} tok` } }
    },
    scales:{
      x:{
        type:'logarithmic', min:2000, max:110000,
        title:{ display:true, text:'Output Tokens per Task', font:{family:'Arial',size:15,weight:'bold'} },
        grid:{ display:false },
        ticks:{
          font:{family:'Arial',size:13}, color:'#555',
          callback:(v)=>{
            const allowed=[3000,4000,5000,6000,7000,8000,9000,10000,20000,30000,40000,50000,60000,70000,80000,100000];
            if(allowed.includes(v)) return (v/1000)+'k';
            return null;
          }
        }
      },
      y:{
        min:35, max:65,
        title:{ display:true, text:'Artificial Analysis Intelligence Index', font:{family:'Arial',size:15,weight:'bold'} },
        grid:{ display:true, color:'#e6e6e6', drawTicks:false },
        ticks:{ stepSize:5, font:{family:'Arial',size:13}, color:'#555' }
      }
    }
  }
});

// Build legend
const legendEl = document.getElementById('legend');
Object.entries(COLORS).forEach(([name,col])=>{
  const it=document.createElement('span'); it.className='item';
  it.innerHTML=`<span class="dot" style="background:${col}"></span>${name}`;
  legendEl.appendChild(it);
});
</script>
</body>
</html>
