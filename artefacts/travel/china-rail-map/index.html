<!DOCTYPE html>
<!--
  China Railway Map - offline rebuild of cnrail.geogv.org (by Kejing Peng).
  Original site: http://cnrail.geogv.org/zhcn/

  Self-contained: no network access at runtime. Everything below - the rail
  network, coastline and water, national/provincial borders, station and place
  labels - is baked into the DATA object.

  Provenance
    Geometry  : railmap.geogv.org vector tiles, zoom 5, layers rail / water /
                natural / admin2b / admin4b / railpoi0 / railpoi1 / *_poi.
                Tile-clipped segments were stitched into polylines and
                Douglas-Peucker simplified.
    Cartography: colours, line widths, zoom stops, icon and label styling are
                taken from the original style.json and sprite sheet, so the map
                renders the same way the original does.
    Coverage  : trimmed to China - rails, provincial borders, stations and city
                labels are filtered against provincial boundary polygons, and
                panning is capped to the country's extent.
    Stations  : hub and major-city classes only (S0/S1/S2), 143 in total.
    Georef    : the published tiles sit on a uniformly scaled-and-shifted
                graticule (~350 km off WGS84). A least-squares affine fitted
                against 30 known stations puts the extract back on real
                coordinates; worst residual ~2.5 km, inside tile precision.

  Base data (C) OpenStreetMap contributors.
-->
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230063a3"/><text x="50" y="75" font-size="60" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">K</text></svg>'>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>中国铁路地图 · 枢纽与主要城市</title>
<style>
  /* ------------------------------------------------------------------ *
   * Tokens. The chrome is a warm-neutral instrument panel wrapped around
   * the map: paper-toned surfaces, ink text, and the HSR red of the rail
   * layer as the single accent, so the UI and the cartography agree.
   * ------------------------------------------------------------------ */
  :root {
    --paper:        30 33% 95%;    /* #f8f4f0, matches the canvas fill */
    --nav:          25 8% 11%;
    --nav-2:        25 7% 17%;
    --surface:      40 33% 99%;
    --surface-2:    38 22% 94%;
    --ink:          220 16% 13%;
    --ink-2:        220 8% 42%;
    --ink-3:        220 6% 58%;
    --line:         35 14% 86%;
    --accent:       12 100% 50%;   /* #ff3300, the high-speed rail red */
    --on-dark:      40 20% 97%;
    --on-dark-2:    35 8% 68%;

    --r-panel: 10px;
    --r-inner: 6px;
    --r-chip:  4px;

    --nav-h: 52px;

    --shadow-1: 0 1px 2px hsl(25 20% 10% / .05), 0 2px 4px hsl(25 20% 10% / .05);
    --shadow-2: 0 1px 2px hsl(25 20% 10% / .06), 0 4px 10px hsl(25 20% 10% / .07),
                0 12px 28px hsl(25 20% 10% / .08);

    --ease-out: cubic-bezier(.23, 1, .32, 1);

    --z-map: 0; --z-hud: 20; --z-tip: 25; --z-nav: 30; --z-pop: 40;

    --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
            "Noto Sans CJK SC", "Source Han Sans SC", "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    font: 14px/1.45 var(--font);
    color: hsl(var(--ink));
    background: hsl(var(--paper));
  }
  :focus-visible {
    outline: 2px solid hsl(var(--accent));
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- navbar ---------- */
  #nav {
    position: absolute; inset: 0 0 auto 0; height: var(--nav-h); z-index: var(--z-nav);
    display: flex; align-items: center; gap: 16px;
    padding: 0 14px 0 16px;
    background: hsl(var(--nav));
    color: hsl(var(--on-dark));
    box-shadow: 0 1px 0 hsl(25 20% 4% / .5), 0 2px 12px hsl(25 20% 4% / .18);
  }
  #mark { flex: none; display: block; }
  #brand {
    margin: 0 0 0 -6px;
    font-size: 17px; font-weight: 500; letter-spacing: .02em; white-space: nowrap;
  }
  .dropdown .head { margin: 0; }
  #nav .spacer { flex: 1 1 auto; }

  /* search */
  #search-wrap { position: relative; }
  #search-field { position: relative; display: flex; align-items: center; }
  #search-field .icon {
    position: absolute; left: 9px; color: hsl(var(--on-dark-2)); pointer-events: none;
  }
  #search {
    width: 260px; height: 34px; padding: 0 34px 0 30px;
    border-radius: var(--r-inner);
    border: 1px solid hsl(var(--nav-2));
    background: hsl(var(--nav-2)); color: hsl(var(--on-dark));
    font: inherit; font-size: 13px;
    transition: background .16s var(--ease-out), border-color .16s var(--ease-out),
                box-shadow .16s var(--ease-out), width .2s var(--ease-out);
  }
  #search::placeholder { color: hsl(var(--on-dark-2)); }
  #search::-webkit-search-decoration,
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  #search:focus {
    outline: none;
    width: 300px;
    background: hsl(25 7% 21%);
    border-color: hsl(var(--accent) / .8);
    box-shadow: 0 0 0 3px hsl(var(--accent) / .18);
  }
  #search-hint {
    position: absolute; right: 9px; display: flex; gap: 3px;
    color: hsl(var(--on-dark-2)); font: 500 11px/1 var(--font-num);
    pointer-events: none; transition: opacity .12s var(--ease-out);
  }
  #search-hint kbd {
    display: block; padding: 3px 5px; border-radius: 3px; font: inherit;
    background: hsl(0 0% 100% / .07); border: 1px solid hsl(0 0% 100% / .1);
  }
  #search:focus ~ #search-hint, #search:not(:placeholder-shown) ~ #search-hint { opacity: 0; }

  #results {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: 320px; max-height: 330px; overflow-y: auto;
    padding: 4px;
    background: hsl(var(--surface)); color: hsl(var(--ink));
    border: 1px solid hsl(var(--line)); border-radius: var(--r-panel);
    box-shadow: var(--shadow-2);
    display: none;
    z-index: var(--z-pop);
  }
  #results .row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 7px 9px; border-radius: var(--r-inner);
    cursor: pointer; font-size: 13.5px;
  }
  #results .row:hover, #results .row.sel { background: hsl(var(--surface-2)); }
  #results .row.sel { box-shadow: inset 2px 0 0 hsl(var(--accent)); }
  #results .en { color: hsl(var(--ink-3)); font-size: 11.5px; }
  #results .kind {
    margin-left: auto; flex: none; align-self: center;
    color: hsl(var(--ink-2)); font-size: 11px;
    padding: 2px 6px; border-radius: var(--r-chip); background: hsl(var(--surface-2));
  }
  #results .row.sel .kind { background: hsl(var(--accent) / .1); color: hsl(12 60% 38%); }
  #results .empty { padding: 10px; color: hsl(var(--ink-3)); font-size: 13px; }

  /* menus */
  .menu { position: relative; }
  .menu > button {
    display: flex; align-items: center; gap: 5px;
    min-height: 34px; padding: 6px 10px;
    background: none; border: 0; border-radius: var(--r-inner);
    color: hsl(var(--on-dark-2)); font: inherit; font-size: 13.5px;
    cursor: pointer; white-space: nowrap;
    transition: color .12s var(--ease-out), background-color .12s var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    .menu > button:hover { color: hsl(var(--on-dark)); background: hsl(0 0% 100% / .07); }
  }
  .menu.open > button { color: hsl(var(--on-dark)); background: hsl(0 0% 100% / .1); }
  .menu > button::after {
    content: ""; flex: none;
    border: 4px solid transparent; border-top-color: currentColor; border-bottom: 0;
    transform: translateY(2px);
    transition: transform .16s var(--ease-out);
  }
  .menu.open > button::after { transform: translateY(1px) rotate(180deg); }
  .menu.plain > button::after { display: none; }

  .dropdown {
    position: absolute; top: calc(100% + 6px); left: 0;
    min-width: 210px; padding: 5px; display: none;
    background: hsl(var(--surface)); color: hsl(var(--ink));
    border: 1px solid hsl(var(--line));
    border-radius: var(--r-panel); box-shadow: var(--shadow-2);
    z-index: var(--z-pop);
  }
  .menu.open .dropdown { display: block; animation: pop .16s var(--ease-out) both; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .dropdown a, .dropdown label {
    display: flex; align-items: center; gap: 9px;
    min-height: 34px; padding: 7px 10px; border-radius: var(--r-inner);
    font-size: 13px; color: hsl(var(--ink)); text-decoration: none;
    cursor: pointer; white-space: nowrap;
    transition: background-color .12s var(--ease-out);
  }
  .dropdown a:hover, .dropdown label:hover { background: hsl(var(--surface-2)); }
  .dropdown input[type=checkbox] {
    width: 15px; height: 15px; margin: 0; flex: none;
    accent-color: hsl(var(--accent)); cursor: pointer;
  }
  .dropdown .swatch {
    flex: none; width: 16px; height: 3px; border-radius: 2px; background: var(--sw);
  }
  .dropdown .swatch.dashed {
    height: 0; border-top: 3px dashed var(--sw); background: none; opacity: .6;
  }
  .dropdown label:has(input:not(:checked)) { color: hsl(var(--ink-3)); }
  .dropdown label:has(input:not(:checked)) .swatch { opacity: .3; }
  .dropdown hr { margin: 5px 6px; border: 0; border-top: 1px solid hsl(var(--line)); }
  /* the nav's right-hand cluster opens leftwards so long labels stay on screen */
  #m-set .dropdown, #m-lang .dropdown { left: auto; right: 0; }
  #m-set .dropdown { max-height: min(74vh, 520px); overflow-y: auto; }
  .dropdown .head {
    padding: 6px 10px 4px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--ink-3));
  }

  /* ---------- map ---------- */
  #map {
    position: absolute; inset: var(--nav-h) 0 0 0; z-index: var(--z-map);
    cursor: grab; touch-action: none;
  }
  #map.dragging { cursor: grabbing; }
  #map.on-station { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }

  #tip {
    position: absolute; z-index: var(--z-tip); pointer-events: none;
    padding: 5px 9px; border-radius: var(--r-inner);
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    background: hsl(var(--nav) / .94); color: hsl(var(--on-dark));
    box-shadow: var(--shadow-1);
    transform: translate(-50%, calc(-100% - 9px));
    opacity: 0; visibility: hidden;
    transition: opacity .12s var(--ease-out), visibility .12s;
  }
  #tip.on { opacity: 1; visibility: visible; }
  #tip::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    border: 5px solid transparent; border-top-color: hsl(var(--nav) / .94);
    transform: translateX(-50%);
  }
  #tip .sep { color: hsl(var(--on-dark-2)); margin: 0 2px; }
  #tip .kind { color: hsl(var(--on-dark-2)); font-weight: 400; }

  /* ---------- HUD panels ---------- */
  #zoomctl {
    position: absolute; top: calc(var(--nav-h) + 12px); right: 12px; z-index: var(--z-hud);
    display: flex; flex-direction: column; width: 38px; padding: 3px;
    background: hsl(var(--surface) / .95);
    border: 1px solid hsl(var(--line));
    border-radius: var(--r-panel);
    box-shadow: var(--shadow-1);
    backdrop-filter: blur(6px);
  }
  #zoomctl button {
    width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: var(--r-inner); background: none;
    color: hsl(var(--ink)); font-size: 16px; line-height: 1; cursor: pointer;
    transition: background-color .12s var(--ease-out), color .12s var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    #zoomctl button:hover { background: hsl(var(--surface-2)); }
  }
  #zoomctl button:active { transform: scale(.94); }
  #zoomctl .div { height: 1px; margin: 3px 5px; background: hsl(var(--line)); }

  #legend {
    position: absolute; right: 12px; bottom: 46px; z-index: var(--z-hud); width: 244px;
    background: hsl(var(--surface) / .95);
    border: 1px solid hsl(var(--line));
    border-radius: var(--r-panel);
    box-shadow: var(--shadow-2);
    backdrop-filter: blur(6px);
    overflow: hidden;
  }
  #legend > button {
    width: 100%; display: flex; align-items: center; gap: 9px;
    min-height: 44px; padding: 10px 12px;
    background: none; border: 0; font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; color: hsl(var(--ink));
    transition: background-color .12s var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    #legend > button:hover { background: hsl(var(--surface-2)); }
  }
  #legend > button .chev {
    margin-left: auto; flex: none; color: hsl(var(--ink-3));
    transition: transform .2s var(--ease-out);
  }
  #legend.closed > button .chev { transform: rotate(-90deg); }
  #legend-body {
    padding: 2px 14px 14px; max-height: 58vh; overflow-y: auto;
    border-top: 1px solid hsl(var(--line));
  }
  #legend.closed #legend-body { display: none; }
  #legend h4 {
    margin: 12px 0 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--ink-3));
  }
  #legend hr { margin: 12px 0 0; border: 0; border-top: 1px solid hsl(var(--line)); }
  .lrow {
    display: flex; align-items: center; gap: 10px;
    margin: 6px 0; font-size: 12.5px; line-height: 1.3;
  }
  .lrow svg { flex: none; }
  .lrow.off { opacity: .32; }
  .lrow[data-cat] { transition: opacity .16s var(--ease-out); }

  #scalebar {
    position: absolute; left: 12px; bottom: 12px; z-index: var(--z-hud);
    display: flex; align-items: flex-end; gap: 7px;
    font: 500 11px/1 var(--font-num); font-variant-numeric: tabular-nums;
    color: hsl(var(--ink-2));
    padding: 5px 8px; border-radius: var(--r-inner);
    background: hsl(var(--surface) / .8);
    box-shadow: var(--shadow-1);
    backdrop-filter: blur(4px);
  }
  #scalebar .bar {
    height: 5px;
    border: 1px solid hsl(var(--ink-2)); border-top: 0;
    transition: width .12s linear;
  }
  #attrib {
    position: absolute; right: 12px; bottom: 12px; z-index: var(--z-hud);
    font-size: 10.5px; line-height: 1.5; color: hsl(var(--ink-3)); text-align: right;
    background: hsl(var(--surface) / .75); padding: 3px 7px; border-radius: var(--r-chip);
    max-width: min(60vw, 520px);
  }
  #attrib a {
    color: hsl(var(--ink-2));
    text-decoration: underline; text-underline-offset: 2px;
    text-decoration-color: hsl(var(--ink-3) / .6);
    transition: color .12s var(--ease-out), text-decoration-color .12s var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    #attrib a:hover { color: hsl(var(--accent)); text-decoration-color: hsl(var(--accent)); }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (max-width: 760px) {
    :root { --nav-h: 50px; }
    #nav { gap: 10px; padding: 0 10px; }
    #brand { font-size: 15px; }
    #search { width: 140px; padding-right: 10px; }
    #search:focus { width: 170px; }
    #search-hint { display: none; }
    #results { width: min(80vw, 320px); }
    #legend { width: 214px; right: 10px; bottom: 64px; }
    #attrib { max-width: 46vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header id="nav">
  <svg id="mark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
    <circle cx="10" cy="10" r="8.2" fill="none" stroke="#ff3300" stroke-width="2.6"/>
    <circle cx="10" cy="10" r="2.6" fill="#ff8000"/>
  </svg>
  <h1 id="brand">中国铁路地图</h1>

  <span id="search-wrap">
    <label class="sr-only" for="search" id="search-label">搜索车站名称</label>
    <span id="search-field">
      <svg class="icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜索车站名称"
             role="combobox" aria-expanded="false" aria-controls="results"
             aria-autocomplete="list" aria-haspopup="listbox">
      <span id="search-hint" aria-hidden="true"><kbd>/</kbd></span>
    </span>
    <div id="results" role="listbox" aria-label="搜索结果"></div>
    <p id="search-status" class="sr-only" aria-live="polite"></p>
  </span>

  <span class="spacer"></span>

  <span class="menu" id="m-set">
    <button type="button" aria-expanded="false" aria-haspopup="true" data-en="Settings">设置</button>
    <div class="dropdown">
      <p class="head" data-en="Base map">底图</p>
      <label><input type="checkbox" id="opt-admin" checked> <span data-en="Boundaries">显示省界／国界</span></label>
      <label><input type="checkbox" id="opt-water" checked> <span data-en="Water">显示水系</span></label>
      <hr>
      <p class="head" data-en="Line types">线路类型</p>
      <label><input type="checkbox" data-cat="hsr" checked>
        <span class="swatch" style="--sw:#ff3300" aria-hidden="true"></span>
        <span data-en="High-speed railway">高速铁路</span></label>
      <label><input type="checkbox" data-cat="rr" checked>
        <span class="swatch" style="--sw:#ff9900" aria-hidden="true"></span>
        <span data-en="Rapid / intercity railway">快速铁路、城际铁路</span></label>
      <label><input type="checkbox" data-cat="r" checked>
        <span class="swatch" style="--sw:#33a02c" aria-hidden="true"></span>
        <span data-en="Conventional railway (passenger)">普通铁路（客运）</span></label>
      <label><input type="checkbox" data-cat="f" checked>
        <span class="swatch" style="--sw:#86b300" aria-hidden="true"></span>
        <span data-en="Conventional railway (freight)">普通铁路（货运）</span></label>
      <label><input type="checkbox" data-cat="other" checked>
        <span class="swatch" style="--sw:#6464b5" aria-hidden="true"></span>
        <span data-en="Other (industrial, link lines)">其他（专用线、联络线）</span></label>
      <label><input type="checkbox" data-cat="con" checked>
        <span class="swatch dashed" style="--sw:#ff3300" aria-hidden="true"></span>
        <span data-en="Under construction">建设中</span></label>
      <hr>
      <p class="head" data-en="Stations">车站</p>
      <label><input type="checkbox" id="opt-mid" checked> <span data-en="Medium stations">显示中等车站</span></label>
    </div>
  </span>
  <span class="menu" id="m-lang">
    <button type="button" aria-expanded="false" aria-haspopup="true">Lang/语言</button>
    <div class="dropdown" role="menu">
      <a role="menuitem" tabindex="0" data-lang="zh">中文</a>
      <a role="menuitem" tabindex="0" data-lang="en">English</a>
    </div>
  </span>
</header>

<main id="map">
  <canvas id="cv" role="img" aria-label="中国铁路网络地图，可拖动平移、滚轮缩放"></canvas>
</main>
<div id="tip" aria-hidden="true"></div>

<div id="zoomctl" role="group" aria-label="缩放控制">
  <button type="button" id="zin" title="放大" aria-label="放大">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>
  <button type="button" id="zout" title="缩小" aria-label="缩小">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="div" aria-hidden="true"></span>
  <button type="button" id="zreset" title="全国视图" aria-label="全国视图">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="3" y="3" width="10" height="10" rx="2" fill="none"
            stroke="currentColor" stroke-width="1.6"/>
      <circle cx="8" cy="8" r="1.6" fill="currentColor"/>
    </svg>
  </button>
</div>

<div id="legend" class="closed">
  <button type="button" id="legend-toggle" aria-expanded="false" aria-controls="legend-body">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" opacity=".35"/>
      <circle cx="5" cy="4" r="2" fill="#ff4000"/>
      <circle cx="9" cy="8" r="2" fill="#ff9900"/>
      <circle cx="6" cy="12" r="2" fill="#33a02c"/>
    </svg>
    <span data-en="Legend">图例</span>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Projection: spherical Mercator into a square world of WORLD units.
 * ------------------------------------------------------------------ */
const WORLD = 4096;
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif';
const SC = DATA.scale;              // coordinates are stored as degrees * SC

function projX(lon) { return (lon + 180) / 360 * WORLD; }
function projY(lat) {
  const s = Math.sin(lat * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * WORLD;
}
function unprojX(x) { return x / WORLD * 360 - 180; }
function unprojY(y) {
  const n = Math.PI * (1 - 2 * y / WORLD);
  return Math.atan(Math.sinh(n)) * 180 / Math.PI;
}

/* screen px per world unit; the original style uses 512 px vector tiles, so
   zoom numbers here line up with cnrail.geogv.org one-to-one */
function zScale(z) { return Math.pow(2, z) * 512 / WORLD; }

/* ------------------------------------------------------------------ *
 * Mapbox-style zoom interpolation (supports exponential bases).
 * ------------------------------------------------------------------ */
function stops(z, base, table) {
  if (z <= table[0][0]) return table[0][1];
  const n = table.length;
  if (z >= table[n - 1][0]) return table[n - 1][1];
  for (let i = 1; i < n; i++) {
    if (z <= table[i][0]) {
      const [z0, v0] = table[i - 1], [z1, v1] = table[i];
      let t = (z - z0) / (z1 - z0);
      if (base !== 1) t = (Math.pow(base, z - z0) - 1) / (Math.pow(base, z1 - z0) - 1);
      return v0 + (v1 - v0) * t;
    }
  }
  return table[n - 1][1];
}

/* ------------------------------------------------------------------ *
 * Geometry decoding — delta-encoded flat arrays into cached Path2D.
 * ------------------------------------------------------------------ */
function decodeLine(flat) {
  const pts = new Float64Array(flat.length);
  let px = 0, py = 0;
  for (let i = 0; i < flat.length; i += 2) {
    px += flat[i]; py += flat[i + 1];
    pts[i] = projX(px / SC);
    pts[i + 1] = projY(py / SC);
  }
  return pts;
}
function linePath(groups) {
  const p = new Path2D();
  for (const flat of groups) {
    const pts = decodeLine(flat);
    p.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]);
  }
  return p;
}
function polyPath(features) {
  const p = new Path2D();
  for (const rings of features) {
    for (const flat of rings) {
      const pts = decodeLine(flat);
      p.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]);
      p.closePath();
    }
  }
  return p;
}

/* ---- rail styling, straight out of the original style.json ---- */
/* cat groups the styles the way the legend does, so one checkbox per legend
   row can switch a whole class of line on and off */
const RAIL_STYLE = {
  NONE:    { color: "#6464b5", base: 1,   width: [[7, 1], [20, 2]],            order: 0,  cat: "other" },
  MINOR:   { color: "#aaaaaa", base: 1,   width: [[12, .8], [20, 2]],          order: 1,  cat: "other" },
  F:       { color: "#86b300", base: 1,   width: [[7, 1.25], [9, 1.75]],       order: 2,  cat: "f" },
  F2:      { color: "#86b300", base: 2.5, width: [[3, 1], [7, 2.5], [9, 3]],   order: 3,  cat: "f" },
  R:       { color: "#33a02c", base: 1,   width: [[7, 1.25], [9, 1.75]],       order: 4,  cat: "r" },
  R2:      { color: "#33a02c", base: 2.5, width: [[3, 1], [7, 2.5], [9, 3]],   order: 5,  cat: "r" },
  RR:      { color: "#ff9900", base: 1,   width: [[7, 1.25], [9, 1.75]],       order: 6,  cat: "rr" },
  RR2:     { color: "#ff9900", base: 2.5, width: [[3, 1], [7, 2.5], [9, 3]],   order: 7,  cat: "rr" },
  HSR:     { color: "#ff3300", base: 1,   width: [[7, 1.25], [9, 1.75]],       order: 8,  cat: "hsr" },
  HSR2:    { color: "#ff3300", base: 2.5, width: [[3, 1], [7, 2.5], [9, 3]],   order: 9,  cat: "hsr" },
  F_CON:   { color: "#86b300", base: 2.5, width: [[7, 1.25], [9, 1.75]], dash: [2, 2], alpha: .4, order: 10, cat: "con" },
  R_CON:   { color: "#33a02c", base: 2.5, width: [[7, 1.25], [9, 1.75]], dash: [2, 2], alpha: .4, order: 11, cat: "con" },
  RR_CON:  { color: "#ff9900", base: 2.5, width: [[7, 1.25], [9, 1.75]], dash: [2, 2], alpha: .4, order: 12, cat: "con" },
  HSR_CON: { color: "#ff3300", base: 2.5, width: [[7, 1.25], [9, 1.75]], dash: [2, 2], alpha: .4, order: 13, cat: "con" },
};

const railLayers = [];
for (const key in DATA.rail) {
  const type = key.split("|")[0];
  const st = RAIL_STYLE[type];
  if (!st) continue;
  railLayers.push({ type, st, path: linePath(DATA.rail[key]) });
}
railLayers.sort((a, b) => a.st.order - b.st.order);

const borderPaths = {
  admin2b: linePath(DATA.lines.admin2b),
  admin2b_d: linePath(DATA.lines.admin2b_d),
  admin4b: linePath(DATA.lines.admin4b),
};
const waterPaths = {
  ocean: polyPath(DATA.polys.water),
  inland: polyPath(DATA.polys.natural),
};

/* ---- stations ---- */
const ICONS = {
  station0: { r: 7,   fill: "#ff4000", ring: "#4a4a4a", rw: 3 },
  station1: { r: 6,   fill: "#ff8000", ring: "#4a4a4a", rw: 2.5 },
  station2: { r: 5.5, fill: "#ffbf00", ring: "#6b6b6b", rw: 2.5 },
};

const stations = DATA.stations.map(s => ({
  name: s.n, en: s.e || s.n, type: s.t, icon: s.i, anchor: s.a, level: s.l,
  wx: projX(s.x), wy: projY(s.y), lon: s.x, lat: s.y,
}));
stations.sort((a, b) => a.level - b.level);

const places = DATA.labels.map(l => ({
  name: l.n, en: l.e || l.n, kind: l.k, wx: projX(l.x), wy: projY(l.y),
}));

/* text anchor codes used by the original station layer */
const ANCHORS = {
  R:  { align: "left",   base: "middle", dx: .6,  dy: 0 },
  L:  { align: "right",  base: "middle", dx: -.6, dy: 0 },
  B:  { align: "center", base: "top",    dx: 0,   dy: .4 },
  T:  { align: "center", base: "bottom", dx: 0,   dy: -.5 },
  RB: { align: "left",   base: "top",    dx: .2,  dy: .2 },
  RT: { align: "left",   base: "bottom", dx: .3,  dy: -.4 },
  LB: { align: "right",  base: "top",    dx: -.2, dy: .2 },
  LT: { align: "right",  base: "bottom", dx: -.3, dy: -.4 },
  "": { align: "center", base: "middle", dx: 0,   dy: 0 },
};

/* ------------------------------------------------------------------ *
 * View state
 * ------------------------------------------------------------------ */
const BBOX = DATA.bbox;                       // [west, south, east, north] of the extract
const EXT = { x0: projX(BBOX[0]), x1: projX(BBOX[2]), y0: projY(BBOX[3]), y1: projY(BBOX[1]) };
const view = { cx: (EXT.x0 + EXT.x1) / 2, cy: (EXT.y0 + EXT.y1) / 2, zoom: 4 };
let MINZ = 3;
const MAXZ = 8.2;
let lang = "zh";
let hovered = null;
const placed = [];          // stations drawn in the last frame, for hit testing
const opts = {
  admin: true, water: true, mid: true,
  /* one flag per legend line class */
  rail: { hsr: true, rr: true, r: true, f: true, other: true, con: true },
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const mapEl = document.getElementById("map");
let W = 0, H = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = mapEl.clientWidth; H = mapEl.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  MINZ = fitZoom(30) - 0.15;
  if (view.zoom < MINZ) view.zoom = MINZ;
  clamp();
  draw();
}

function toScreen(wx, wy) {
  const s = zScale(view.zoom);
  return [(wx - view.cx) * s + W / 2, (wy - view.cy) * s + H / 2];
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(render); }

function render() {
  raf = 0;
  const z = view.zoom, s = zScale(z);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#f8f4f0";
  ctx.fillRect(0, 0, W, H);

  /* world-space transform: paths are cached in world units */
  ctx.setTransform(s * dpr, 0, 0, s * dpr,
                   (W / 2 - view.cx * s) * dpr, (H / 2 - view.cy * s) * dpr);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (opts.water) {
    ctx.fillStyle = "#bfd9f2";
    ctx.fill(waterPaths.ocean);
    ctx.fill(waterPaths.inland);
  }

  if (opts.admin) {
    ctx.setLineDash([]);
    ctx.strokeStyle = "#adada0";
    let w = stops(z, 1, [[4, .4], [5, 1], [12, 3]]);
    ctx.lineWidth = w / s;
    ctx.setLineDash([3 * w / s, 1 * w / s, 1 * w / s, 1 * w / s]);
    ctx.stroke(borderPaths.admin4b);

    w = stops(z, 1, [[0, .6], [4, 1.4], [5, 2], [12, 5]]);
    ctx.lineWidth = w / s;
    ctx.setLineDash([]);
    ctx.strokeStyle = "hsl(248, 7%, 66%)";
    ctx.stroke(borderPaths.admin2b);
    ctx.strokeStyle = "hsl(248, 7%, 70%)";
    ctx.setLineDash([1 * w / s, 3 * w / s]);
    ctx.stroke(borderPaths.admin2b_d);
  }

  ctx.setLineDash([]);
  for (const layer of railLayers) {
    if (!opts.rail[layer.st.cat]) continue;
    const w = stops(z, layer.st.base, layer.st.width);
    ctx.lineWidth = w / s;
    ctx.strokeStyle = layer.st.color;
    ctx.globalAlpha = layer.st.alpha || 1;
    ctx.setLineDash(layer.st.dash ? layer.st.dash.map(d => d * w / s) : []);
    ctx.stroke(layer.path);
  }
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);

  /* back to screen space for symbols and labels */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSymbols(z);
  drawScale(z);
}

/* greedy label placement, in priority order */
function drawSymbols(z) {
  const boxes = [];
  const fits = (x0, y0, x1, y1) => {
    if (x1 < 0 || y1 < 0 || x0 > W || y0 > H) return false;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (x0 < b[2] && x1 > b[0] && y0 < b[3] && y1 > b[1]) return false;
    }
    return true;

  const iconScale = stops(z, 1, [[5, .8], [15, 1.2]]);

  /* country names, like the original, only while zoomed far out */
  if (z < 6) {
    ctx.font = '400 ' + stops(z, 1, [[4, 13], [9, 16]]).toFixed(1) + 'px ' + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of places) {
      if (p.kind !== "country_poi") continue;
      const [x, y] = toScreen(p.wx, p.wy);
      const t = lang === "zh" ? p.name : p.en;
      const half = ctx.measureText(t).width / 2 + 2;
      if (!fits(x - half, y - 9, x + half, y + 9)) continue;
      boxes.push([x - half, y - 9, x + half, y + 9]);
      halo(t, x, y, 1.5);
      ctx.fillStyle = "#00004d";
      ctx.fillText(t, x, y);
    }
  }

  /* Stations are placed as icon+label units in priority (level) order, the way
     the original style does with symbol-sort-key; if the pair does not fit,
     the whole symbol is dropped rather than left unlabelled. */
  placed.length = 0;
  for (const st of stations) {
    st.sx = undefined; st.label = null;
    if (!opts.mid && st.type === "S2") continue;
    const [x, y] = toScreen(st.wx, st.wy);
    if (x < -80 || y < -40 || x > W + 80 || y > H + 40) continue;

    const ic = ICONS[st.icon] || ICONS.station2;
    const r = ic.r * iconScale;
    const isBig = st.type === "S0" || st.type === "S1";
    const size = isBig
      ? stops(z, 1, [[4, 11], [6, 13], [8, 14], [11, 14], [20, 20]])
      : stops(z, 1, [[4, 11], [6, 12], [8, 13], [11, 13], [20, 18]]);
    ctx.font = (isBig ? "700 " : "400 ") + size.toFixed(1) + "px " + FONT;
    const a = ANCHORS[st.anchor] || ANCHORS[""];
    const t = lang === "zh" ? st.name : st.en;
    const tx = x + a.dx * size, ty = y + a.dy * size;
    const tw = ctx.measureText(t).width, th = size * 1.12;
    const x0 = a.align === "left" ? tx : a.align === "right" ? tx - tw : tx - tw / 2;
    const y0 = a.base === "top" ? ty : a.base === "bottom" ? ty - th : ty - th / 2;
    const iconBox = [x - r, y - r, x + r, y + r];
    const textBox = [x0 - 1, y0 - 1, x0 + tw + 1, y0 + th + 1];
    if (!fits(...iconBox) || !fits(...textBox)) continue;
    boxes.push(iconBox, textBox);

    ctx.beginPath();
    ctx.arc(x, y, r - ic.rw * iconScale / 2, 0, 6.2832);
    ctx.fillStyle = ic.fill; ctx.fill();
    ctx.lineWidth = ic.rw * iconScale;
    ctx.strokeStyle = st === hovered ? "#000080" : ic.ring;
    ctx.stroke();

    ctx.textAlign = a.align; ctx.textBaseline = a.base;
    halo(t, tx, ty, 2);
    ctx.fillStyle = st === hovered ? "#000080"
      : st.type === "S0" ? "#001027" : "#0066ff";
    ctx.fillText(t, tx, ty);

    st.sx = x; st.sy = y; st.r = r; st.label = textBox;
    placed.push(st);
  }

  /* seas at every zoom, foreign cities once close enough (as in the original) */
  {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of places) {
      if (p.kind === "country_poi") continue;
      const sea = p.kind === "ocean_poi";
      if (!sea && z < 6) continue;
      const [x, y] = toScreen(p.wx, p.wy);
      const size = sea ? stops(z, 1, [[5, 13], [9, 16], [11, 18]])
                       : stops(z, 1, [[5, 12], [8, 13], [9, 15], [11, 17]]);
      ctx.font = "400 " + size.toFixed(1) + "px " + FONT;
      const t = lang === "zh" ? p.name : p.en;
      const half = ctx.measureText(t).width / 2 + 2;
      if (!fits(x - half, y - size / 2, x + half, y + size / 2)) continue;
      boxes.push([x - half, y - size / 2, x + half, y + size / 2]);
      if (!sea) halo(t, x, y, 2);
      ctx.fillStyle = sea ? "#5784bd" : "#6b6b6b";
      ctx.fillText(t, x, y);
    }
  }
}

function halo(text, x, y, width) {
  ctx.lineJoin = "round";
  ctx.lineWidth = width * 2;
  ctx.strokeStyle = "rgba(255,255,255,.75)";
  ctx.strokeText(text, x, y);
}

function drawScale(z) {
  const mPerPx = 156543.03392 * Math.cos(unprojY(view.cy) * Math.PI / 180) / Math.pow(2, z + 1);
  const targets = [10, 20, 50, 100, 200, 500, 1000, 2000];
  let km = targets[targets.length - 1];
  for (const t of targets) { if (t * 1000 / mPerPx <= 130) km = t; }
  document.getElementById("scale-bar").style.width = (km * 1000 / mPerPx).toFixed(0) + "px";
  document.getElementById("scale-label").textContent = km + " km";
}

/* ------------------------------------------------------------------ *
 * Interaction
 * ------------------------------------------------------------------ */
let drag = null;
mapEl.addEventListener("pointerdown", e => {
  mapEl.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false };
  mapEl.classList.add("dragging");
});
mapEl.addEventListener("pointermove", e => {
  if (drag) {
    const s = zScale(view.zoom);
    view.cx = drag.cx - (e.clientX - drag.x) / s;
    view.cy = drag.cy - (e.clientY - drag.y) / s;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
    clamp(); draw();
  } else {
    hitTest(e);
  }
});
function endDrag(e) {
  if (!drag) return;
  drag = null;
  mapEl.classList.remove("dragging");
}
mapEl.addEventListener("pointerup", endDrag);
mapEl.addEventListener("pointercancel", endDrag);
mapEl.addEventListener("pointerleave", () => { hovered = null; tip.classList.remove("on"); draw(); });

const tip = document.getElementById("tip");
function hitTest(e) {
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = null;
  for (const st of placed) {
    const d = Math.hypot(st.sx - mx, st.sy - my);
    if (d <= st.r + 3) { found = st; break; }
    if (st.label && mx >= st.label[0] && mx <= st.label[2] && my >= st.label[1] && my <= st.label[3]) { found = st; break; }
  }
  if (found !== hovered) {
    hovered = found;
    mapEl.classList.toggle("on-station", !!found);
    if (found) {
      tip.innerHTML = "";
      tip.append(lang === "zh" ? found.name : found.en);
      const sep = document.createElement("span");
      sep.className = "sep"; sep.textContent = "·";
      const kind = document.createElement("span");
      kind.className = "kind"; kind.textContent = kindOf(found.type);
      tip.append(sep, kind);
      tip.style.left = (rect.left + found.sx) + "px";
      tip.style.top = (rect.top + found.sy - found.r) + "px";
      tip.classList.add("on");
    } else {
      tip.classList.remove("on");
    }
    draw();
  }
}
const STATION_KIND = {
  zh: { S0: "重要枢纽", S1: "主要车站", S2: "中等车站" },
  en: { S0: "Major hub", S1: "Major station", S2: "Medium station" },
};
function kindOf(t) { return STATION_KIND[lang][t]; }

mapEl.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top,
         -(e.deltaMode === 1 ? e.deltaY * 20 : e.deltaY) * 0.0025);
}, { passive: false });

mapEl.addEventListener("dblclick", e => {
  const rect = mapEl.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, 1);
});

function zoomAt(px, py, dz) {
  const z0 = view.zoom;
  const z1 = Math.max(MINZ, Math.min(MAXZ, z0 + dz));
  if (z1 === z0) return;
  const s0 = zScale(z0), s1 = zScale(z1);
  const wx = view.cx + (px - W / 2) / s0, wy = view.cy + (py - H / 2) / s0;
  view.cx = wx - (px - W / 2) / s1;
  view.cy = wy - (py - H / 2) / s1;
  view.zoom = z1;
  clamp(); draw();
}

/* zoom at which the whole extract fits the current canvas */
function fitZoom(pad) {
  const s = Math.min((W - pad * 2) / (EXT.x1 - EXT.x0), (H - pad * 2) / (EXT.y1 - EXT.y0));
  return Math.log2(s * WORLD / 512);
}
function home() {
  view.zoom = fitZoom(30);
  view.cx = (EXT.x0 + EXT.x1) / 2;
  view.cy = (EXT.y0 + EXT.y1) / 2;
}
/* keep the country in view - panning stops at the edge of the extract */
function clamp() {
  const s = zScale(view.zoom);
  const halfW = W / 2 / s, halfH = H / 2 / s;
  view.cx = halfW * 2 > EXT.x1 - EXT.x0
    ? (EXT.x0 + EXT.x1) / 2
    : Math.max(EXT.x0 + halfW * .55, Math.min(EXT.x1 - halfW * .55, view.cx));
  view.cy = halfH * 2 > EXT.y1 - EXT.y0
    ? (EXT.y0 + EXT.y1) / 2
    : Math.max(EXT.y0 + halfH * .55, Math.min(EXT.y1 - halfH * .55, view.cy));
}

/* smooth flight for search results and the reset button */
function flyTo(lon, lat, zoom) {
  const from = { cx: view.cx, cy: view.cy, z: view.zoom };
  const to = { cx: projX(lon), cy: projY(lat), z: zoom };
  const t0 = performance.now(), dur = 550;
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    view.cx = from.cx + (to.cx - from.cx) * e;
    view.cy = from.cy + (to.cy - from.cy) * e;
    view.zoom = from.z + (to.z - from.z) * e;
    clamp(); draw();
    if (k < 1) requestAnimationFrame(step);
  })(performance.now());
}

document.getElementById("zin").onclick = () => zoomAt(W / 2, H / 2, .8);
document.getElementById("zout").onclick = () => zoomAt(W / 2, H / 2, -.8);
document.getElementById("zreset").onclick = () =>
  flyTo(unprojX((EXT.x0 + EXT.x1) / 2), unprojY((EXT.y0 + EXT.y1) / 2), fitZoom(30));

/* ---------- search ---------- */
const search = document.getElementById("search");
const results = document.getElementById("results");
let picked = -1, matches = [];

const searchStatus = document.getElementById("search-status");

function showResults(open) {
  results.style.display = open ? "block" : "none";
  search.setAttribute("aria-expanded", open ? "true" : "false");
}
function markPicked() {
  [...results.querySelectorAll(".row")].forEach((c, i) => {
    const on = i === picked;
    c.classList.toggle("sel", on);
    c.setAttribute("aria-selected", on ? "true" : "false");
    if (on) c.scrollIntoView({ block: "nearest" });
  });
}

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  results.innerHTML = ""; picked = -1;
  if (!q) { matches = []; showResults(false); searchStatus.textContent = ""; return; }
  matches = stations.filter(s =>
    s.name.toLowerCase().includes(q) || s.en.toLowerCase().includes(q)).slice(0, 12);
  if (!matches.length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = lang === "zh" ? "无匹配车站" : "No matching station";
    results.appendChild(d);
    searchStatus.textContent = d.textContent;
    showResults(true);
    return;
  }
  matches.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "row";
    d.setAttribute("role", "option");
    d.setAttribute("aria-selected", "false");
    const name = document.createElement("span");
    name.textContent = lang === "zh" ? s.name : s.en;
    const alt = document.createElement("span");
    alt.className = "en";
    alt.textContent = lang === "zh" ? s.en : s.name;
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = kindOf(s.type);
    d.append(name, alt, kind);
    d.onmousedown = ev => { ev.preventDefault(); go(i); };
    results.appendChild(d);
  });
  searchStatus.textContent = matches.length + (lang === "zh" ? " 个结果" : " results");
  showResults(true);
});
search.addEventListener("keydown", e => {
  if (e.key === "Escape") { showResults(false); search.blur(); return; }
  if (!matches.length || results.style.display === "none") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    picked = (picked + (e.key === "ArrowDown" ? 1 : matches.length - 1)) % matches.length;
    markPicked();
  } else if (e.key === "Enter") {
    go(picked < 0 ? 0 : picked);
  }
});
search.addEventListener("blur", () => setTimeout(() => showResults(false), 120));
function go(i) {
  const s = matches[i];
  if (!s) return;
  showResults(false);
  search.value = lang === "zh" ? s.name : s.en;
  search.blur();
  flyTo(s.lon, s.lat, Math.max(view.zoom, 7));
}

/* ---------- menus ---------- */
function closeMenus() {
  document.querySelectorAll(".menu").forEach(m => {
    m.classList.remove("open");
    m.querySelector("button").setAttribute("aria-expanded", "false");
  });
}
document.querySelectorAll(".menu > button").forEach(b => {
  b.onclick = e => {
    e.stopPropagation();
    const m = b.parentElement, was = m.classList.contains("open");
    closeMenus();
    if (!was) { m.classList.add("open"); b.setAttribute("aria-expanded", "true"); }
  };
});
document.addEventListener("click", closeMenus);
document.querySelectorAll(".dropdown").forEach(d => d.onclick = e => e.stopPropagation());

document.querySelectorAll("#m-lang a").forEach(a => {
  const setLang = () => {
    lang = a.dataset.lang;
    const zh = lang === "zh";
    document.documentElement.lang = zh ? "zh-CN" : "en";
    document.getElementById("brand").textContent = zh ? "中国铁路地图" : "China Railway Map";
    search.placeholder = zh ? "搜索车站名称" : "Search a station";
    document.getElementById("search-label").textContent = search.placeholder;
    results.setAttribute("aria-label", zh ? "搜索结果" : "Search results");
    cv.setAttribute("aria-label", zh
      ? "中国铁路网络地图，可拖动平移、滚轮缩放"
      : "Map of the Chinese rail network; drag to pan, scroll to zoom");
    document.querySelectorAll("[data-en]").forEach(el => {
      if (!el.dataset.zh) el.dataset.zh = el.textContent;
      el.textContent = zh ? el.dataset.zh : el.dataset.en;
    });
    closeMenus();
    draw();
  };
  a.onclick = setLang;
  a.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setLang(); } };
});

const optMap = { "opt-admin": "admin", "opt-water": "water", "opt-mid": "mid" };
for (const id in optMap) {
  document.getElementById(id).onchange = e => { opts[optMap[id]] = e.target.checked; draw(); };
}

/* rail line classes: the settings checkboxes own the state, the matching
   legend row dims so the key never disagrees with the map */
const railRows = {};
document.querySelectorAll("#legend-body .lrow[data-cat]").forEach(r => railRows[r.dataset.cat] = r);
document.querySelectorAll("input[data-cat]").forEach(box => {
  box.onchange = () => {
    const cat = box.dataset.cat;
    opts.rail[cat] = box.checked;
    const row = railRows[cat];
    if (row) { row.classList.toggle("off", !box.checked); row.setAttribute("aria-hidden", !box.checked); }
    draw();
  };
});

const legend = document.getElementById("legend");
const legendToggle = document.getElementById("legend-toggle");
legendToggle.onclick = () => {
  const open = legend.classList.toggle("closed") === false;
  legendToggle.setAttribute("aria-expanded", open ? "true" : "false");
};

window.addEventListener("resize", resize);
window.addEventListener("keydown", e => {
  if (document.activeElement === search) return;
  if (e.key === "/" && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); search.focus(); search.select(); return;
  }
  if (e.key === "Escape") { closeMenus(); return; }
  const step = 80 / zScale(view.zoom);
  if (e.key === "ArrowLeft") view.cx -= step;
  else if (e.key === "ArrowRight") view.cx += step;
  else if (e.key === "ArrowUp") view.cy -= step;
  else if (e.key === "ArrowDown") view.cy += step;
  else if (e.key === "+" || e.key === "=") return zoomAt(W / 2, H / 2, .8);
  else if (e.key === "-") return zoomAt(W / 2, H / 2, -.8);
  else return;
  clamp(); draw();
});

resize();
home();
clamp();
draw();
</script>
</body>
</html>
