# PRD: Point-and-Fix

## 1. Overview

Point-and-Fix is a live voice-and-video service agent inside a home appliance brand's app. The customer points their phone at a faulty unit. The agent reads the model plate and error code, works out the fault, and talks the customer through a safe fix. If the fault needs a professional, it books a technician who arrives with the diagnosis and the right part.

The workshop goal is to build the core flow: photo of an error display, then a diagnosis, then either a guided three-step fix or a booked technician.

### 1.1 Goals

1. Let customers fix user-fixable faults themselves, in minutes.
2. Send a technician only when needed, with the diagnosis and the right part.
3. Stop the customer before anything unsafe, and escalate to a human.
4. Keep a diagnosis record that supports warranty claims.
5. Keep the prototype small enough to build in a coding workshop.

### 1.2 Target Users

- Owners of home appliances (aircon, washer, dryer).
- Field-service technicians who receive the diagnosis.
- The brand's service and warranty teams.
- Workshop builders who need a clear target for a multimodal flow.

### 1.3 Business Context

- **Opportunity:** most appliance faults are either user-fixable or need a part the technician didn't bring. Customers wait days, and the brand pays for wasted callouts.
- **Client:** home appliance brand. Cars and consumer electronics come later.
- **Zühlke offering:** a multimodal service agent wired into the brand's field-service and parts systems.
- **AI-native angle:** live video understanding plus conversation, grounded in the brand's own manuals and repair history.
- **Why Zühlke:** safety guardrails, clear escalation to a human, and a diagnosis record for warranty claims. The integration with field-service systems is real engineering work.

## 2. Core User Journeys

### 2.1 Guided Self-Fix (hero flow)

1. Jason's aircon is blinking on a 34°C afternoon.
2. He opens the app and points the camera at the unit.
3. The agent reads the model plate and error code.
4. The agent identifies the fault and confirms it is on the safe list for that model.
5. The agent talks him through a three-step fix, checking each step on camera.
6. The aircon works again in 15 minutes instead of waiting until Thursday.

### 2.2 Technician Booking

1. The agent identifies a fault that needs a professional, or one involving electrics or gas.
2. The agent tells the customer not to touch the unit and explains why.
3. The agent books a technician slot.
4. The technician receives the diagnosis and the required part before the visit.

### 2.3 Safety Stop

1. During a guided fix, the customer reaches for a part outside the safe list.
2. The agent says "stop, don't touch that" and explains the risk.
3. The agent offers a technician booking instead.

## 3. Functional Requirements

### 3.1 Capture and Recognition

- The app must accept a live camera feed or a photo of the unit.
- The agent must read the model plate and the error code from the image.
- The agent must ask for a better image when it cannot read either one.

### 3.2 Diagnosis

- The agent must ground each diagnosis in the brand's manuals and repair history for that model.
- The agent must show the customer what it diagnosed and why.

### 3.3 Guided Fix

- The agent may guide only fixes on the per-model safe list.
- Each fix must be broken into short steps the customer can confirm one by one.
- Anything electrical or gas must go to a technician.

### 3.4 Technician Booking

- The agent must book a technician through the brand's field-service system.
- The booking must carry the diagnosis and the required part.

### 3.5 Diagnosis Record

- Every session must produce a record: model, error code, diagnosis, steps taken, outcome.
- The record must be usable for warranty claims.

## 4. Acceptance Criteria

1. A customer can submit a photo of an appliance error display.
2. The app reads the model and error code from the photo.
3. The app shows a diagnosis with a short reason.
4. For a fault on the safe list, the app guides a three-step fix.
5. For a fault outside the safe list, the app books a technician and shows the part to bring.
6. The app stops the customer when a step involves electrics or gas.
7. Each session produces a diagnosis record.
8. The prototype stays simple enough for workshop implementation.

## 5. Open Questions

- **Liability if someone gets hurt?** Fixes are limited to a safe list per model. Anything electrical or gas goes to a technician.
- **Why would a brand pay?** Fewer wasted callouts, more first-time fixes, and data on which faults keep happening.
