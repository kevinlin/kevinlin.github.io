# PRD: The Donation Map

## 1. Overview

The Donation Map is an interactive fundraising map where donors support wildlife conservation and leave a symbolic animal avatar on a world map. The workshop goal is to build a simplified version that demonstrates the core product idea: browse a map, choose an animal, enter donation details, place a marker, and see donor activity reflected in the experience.

### 1.1 Goals

1. Create a donation-inspired map experience that feels personal and visual.
2. Let users choose an animal avatar to represent their contribution.
3. Let users place their avatar on a world map.
4. Show existing donor activity to create momentum and social proof.
5. Keep the experience simple enough to build in a coding workshop.

### 1.2 Target Users

- Individual donors who want a personal way to show support.
- Groups or companies that want to appear on a public map.
- Visitors who want to explore donation activity before participating.
- Workshop builders who need a clear product target with room for interpretation.

## 2. Core User Journeys

### 2.1 Explore the Map

1. User lands on an interactive map.
2. User sees existing animal markers and summary donation stats.
3. User explores the map by moving around, zooming, or searching.
4. User can inspect existing markers to understand who donated and which animal they chose.

### 2.2 Place an Animal Marker

1. User starts the placement flow from the map.
2. User chooses an animal avatar.
3. User enters basic donor information and a donation amount.
4. User chooses where to place the marker.
5. User confirms the placement.
6. The new marker appears on the map.

### 2.3 Browse Donor Activity

1. User opens a donor activity or leaderboard view.
2. User sees ranked or recent donors.
3. User can compare donor names, animals, placement counts, and donation amounts.
4. User can return to the map and continue exploring.

## 3. Functional Requirements

### 3.1 Home Map

- The home screen should center the experience around an interactive world map.
- The map should display animal markers for existing donations.
- The screen should include a clear call to action to place a new marker.
- The screen should show lightweight donation summary stats.
- The product should make it clear that map placements are symbolic.

### 3.2 Map Interaction

- Users should be able to navigate the map.
- Users should be able to inspect a marker.
- Users should be able to search or otherwise move to a location.
- The map should remain understandable when multiple markers are visible.

### 3.3 Marker Details

- A marker detail view should show enough information to make the donation feel personal.
- At minimum, marker details should include:
  - Donor display name or anonymous state.
  - Animal avatar.
  - Donation amount.
  - Optional short message.
- The detail view should be easy to dismiss.

### 3.4 Animal Selection

- Users should be able to choose from multiple animal avatars.
- Each animal choice should be visually distinct.
- The selected animal should carry through the placement flow and appear on the final marker.

### 3.5 Donor Details

- Users should be able to enter a donor name or choose to appear anonymously.
- Users should be able to enter a donation amount.
- Users may add a short optional message.
- The app should prevent confirmation until the minimum required information is provided.

### 3.6 Marker Placement

- Users should be able to choose a location for their marker.
- The app should show the selected location before final confirmation.
- After confirmation, the marker should appear on the map with the selected animal and donor details.

### 3.7 Donor Activity

- The app should include a simple donor activity view.
- The view can be a leaderboard, recent activity list, or another clear summary.
- Donor activity should help users understand that other people have participated.

## 4. Acceptance Criteria

1. A user can open the app and see an interactive map with existing animal markers.
2. A user can inspect an existing marker and see donor details.
3. A user can start a placement flow from the map.
4. A user can select an animal avatar.
5. A user can enter donor details, including a name or anonymous choice and a donation amount.
6. A user can choose a placement location.
7. A user can confirm placement and see the new marker on the map.
8. A user can view donor activity or rankings.
9. The app communicates that marker placement is symbolic.
10. The prototype remains simple, coherent, and suitable for workshop implementation.
