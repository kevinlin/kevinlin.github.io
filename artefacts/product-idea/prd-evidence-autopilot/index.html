# PRD: Evidence Autopilot, then Fast Lane

## 1. Overview

Evidence Autopilot is a compliant-delivery tool for banks and insurers, delivered in two stages.

- **Stage 1, evidence autopilot:** agents build the compliance evidence from the work itself (diff, tests, tickets, threat model). The change-board pack writes itself and is always audit-ready.
- **Stage 2, fast lane:** every change gets a risk score with reasons. Low-risk changes ship automatically with full evidence. People review only the risky few.

The workshop goal is to build the core flow: a pull request goes in, a change-board pack with control mapping comes out, and the change gets a risk score with reasons.

### 1.1 Goals

1. Generate change-board evidence from the code, tests and tickets, with no manual forms.
2. Map every piece of evidence to a control (e.g. MAS TRM).
3. Score each change for risk and give the reasons.
4. Let low-risk changes ship automatically once the evidence has proven reliable (stage 2).
5. Keep the prototype small enough to build in a coding workshop.

### 1.2 Target Users

- Delivery squads at banks and insurers.
- Risk officers and change-board members who review evidence.
- Auditors who need an audit-ready trail.
- Workshop builders who need a clear target for a developer-tooling flow.

### 1.3 Business Context

- **Opportunity:** AI made coding much faster, but banks and insurers still release through manual risk forms, evidence collection and fortnightly change boards. The speed-up is lost in the queue.
- **Client:** banks and insurers.
- **Zühlke offering:** a compliant-delivery accelerator for regulated firms. This is close to work Zühlke already sells.
- **AI-native angle:** reading code, tests and tickets together to produce evidence a risk officer accepts.
- **Why Zühlke:** the strongest of the five ideas on this point. AI earns the right to approve by first proving its evidence is reliable, and every decision traces back to a control.

## 2. Core User Journeys

### 2.1 Pack Ready with the Code (hero flow, stage 1)

1. Priya's squad builds a change in two days.
2. They open a pull request.
3. The autopilot reads the diff, tests, linked tickets and threat model.
4. It generates the change-board pack, with each piece of evidence mapped to a control.
5. The pack is ready the moment the code is, instead of weeks later.

### 2.2 Risk Officer Review

1. The risk officer opens the pack.
2. They follow each piece of evidence back to its source (commit, test result, ticket).
3. They approve, reject or ask for more evidence.

### 2.3 Fast Lane (stage 2)

1. A new change gets a risk score with reasons.
2. A low-risk change ships automatically with its full evidence pack.
3. A high-risk change goes to a person for review.

## 3. Functional Requirements

### 3.1 Evidence Collection

- The tool must read the pull request diff, test results, linked tickets and threat model.
- Each piece of evidence must link back to its source.

### 3.2 Change-Board Pack

- The tool must generate a change-board pack in the format the client's change board uses.
- Each section of the pack must map to a named control (e.g. MAS TRM).
- The pack must flag missing evidence instead of filling the gap.

### 3.3 Risk Scoring (stage 2)

- Each change must get a risk score with written reasons.
- The thresholds for "low risk" are set by the client's risk team.

### 3.4 Approval Routing (stage 2)

- Low-risk changes may ship automatically with full evidence, once the risk team enables this.
- High-risk changes must go to a person.
- Every automatic approval must be logged with its score, reasons and evidence.

## 4. Acceptance Criteria

1. A user can submit a pull request to the tool.
2. The tool generates a change-board pack from the diff, tests and tickets.
3. Each section of the pack maps to a named control.
4. Each piece of evidence links to its source.
5. Missing evidence is flagged, not invented.
6. The change gets a risk score with written reasons.
7. The prototype stays simple enough for workshop implementation.

## 5. Open Questions

- **Will a regulator accept automated approval?** Not on day one. That's why stage 1 comes first.
- **Isn't this just DevOps tooling?** The tooling exists. The new part is AI producing evidence a risk team trusts, and the stage-2 risk scoring.
- **Timings:** "two days to build, weeks to release" is illustrative. Swap in a real number from a client project if someone on the team has one.
