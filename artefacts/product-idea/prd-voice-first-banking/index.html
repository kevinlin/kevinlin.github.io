# PRD: Voice-First Banking

## 1. Overview

Voice-First Banking is a voice agent inside a retail bank's app. Customers do everyday banking by talking to it in their own language or dialect. When a transaction looks like a scam, the agent pauses it and offers to bring in a trusted family contact before any money moves.

The workshop goal is to build the scam-intervention flow: the customer speaks a transfer request, the agent spots the risk pattern, pauses, and offers to call a family member first.

### 1.1 Goals

1. Let customers who struggle with small text and menus bank by voice, in their own language or dialect.
2. Detect likely scams from the conversation pattern (urgency, new payee, large amount) and pause risky transfers.
3. Keep a person in the loop for every risky action.
4. Log every intervention so the bank can explain it to the regulator.
5. Keep the prototype small enough to build in a coding workshop.

### 1.2 Target Users

- Elderly and less digitally confident retail banking customers.
- Family members who opt in as trusted contacts.
- Bank fraud and compliance teams who review interventions.
- Workshop builders who need a clear target for a voice-in, voice-out flow.

### 1.3 Business Context

- **Opportunity:** real-time voice models can now hold a natural conversation in many languages. Elderly and less digitally confident customers still get apps made of small text and menus, and scammers target them most.
- **Client:** retail bank. The same pattern sells to insurers and telcos.
- **Zühlke offering:** a voice-agent layer for regulated consumer apps, with dialect support and scam intervention.
- **AI-native angle:** natural speech in dialect, and scam detection from the conversation pattern. Neither was workable in 2020.
- **Why Zühlke:** a person stays in the loop for risky actions, every intervention is logged, and the bank can explain each one to the regulator.

## 2. Core User Journeys

### 2.1 Everyday Task by Voice

1. Customer opens the app and starts talking.
2. Customer asks for a routine task (check balance, pay a known payee) in their own language.
3. The agent confirms the request back in the same language.
4. Customer confirms, and the agent completes the task.

### 2.2 Scam Intervention (hero flow)

1. Auntie Lim is on a call with a scammer and asks the app to move her savings to a new payee.
2. The agent notices the risk signals: urgency in her speech, a payee she has never paid, a large amount.
3. The agent pauses the transfer and asks, in Hokkien, whether she wants to call her daughter first.
4. Auntie Lim agrees, and the app connects her to her opted-in family contact.
5. The transfer stays on hold until she confirms again or cancels.
6. The intervention is logged with the signals that triggered it.

### 2.3 Fallback to a Human

1. The agent cannot understand the request with enough confidence, or the customer asks for a person.
2. The agent hands over to a human bank agent with a summary of the conversation so far.

## 3. Functional Requirements

### 3.1 Voice Conversation

- The agent must accept speech input and reply with speech output.
- The agent must support two or three languages or dialects at launch. Each one is measured for accuracy before release.
- The agent must read back each transaction before it executes.

### 3.2 Risk Detection

- The agent must score each transfer request against scam signals: urgency, new payee, large amount.
- The agent must pause only on high-risk patterns, to keep false alarms low.
- The agent must not execute a paused transfer without fresh confirmation from the customer.

### 3.3 Trusted Contacts

- Customers must opt in to add family contacts. No contact is added by default.
- During an intervention, the agent offers to call a trusted contact before the transfer continues.

### 3.4 Human Escalation

- The agent must hand over to a human agent when its confidence is low or when the customer asks.
- The handover must include a summary of the conversation.

### 3.5 Audit Log

- Every intervention must be logged with time, signals detected, the agent's message, and the customer's decision.
- The bank's compliance team must be able to read the log and explain each intervention.

## 4. Acceptance Criteria

1. A customer can speak a transfer request and hear the agent reply by voice.
2. The agent replies in the same language or dialect as the customer.
3. A request with urgency, a new payee and a large amount triggers a pause.
4. A routine payment to a known payee goes through without a pause.
5. During a pause, the agent offers to call an opted-in family contact.
6. A paused transfer does not execute without fresh confirmation.
7. Each intervention appears in an audit log with the signals that triggered it.
8. The prototype covers the scam-intervention conversation in about three screens.

## 5. Open Questions

- **Accuracy in dialect?** Start with two or three languages and measure. Fall back to a human agent.
- **Will false alarms annoy people?** The agent pauses only on high-risk patterns, and family contacts are opt-in.
- **Scale of the problem?** SG scam losses reportedly passed S$1.1b in 2024 (SPF figures). Check the latest number before quoting it.
