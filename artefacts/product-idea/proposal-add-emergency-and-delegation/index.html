## Why

The app's primary user is an elderly Singapore resident, and its second user is the family member or helper who manages that person's affairs. Two foundations have to be right before any feature is built on top of them:

1. **Emergency response.** The one path that must work when everything else fails — no network, no model, no backend. Getting this wrong is a life-safety defect, and every screen in the app sits next to it.
2. **Care delegation.** The elderly user is frequently not the phone-competent one. If the data model assumes a single self-serving user, adding caregivers later means rewriting identity, consent, notification routing and every read path.

Both are load-bearing and neither can be retrofitted cheaply. Everything else in the product (facility discovery, bookings, events, proactive nudges) reads profile data through the delegation model and sits one tap away from the emergency surface.

## What Changes

**Emergency response**

- Dedicated always-reachable emergency surface, reachable from every screen at the same position.
- Three routes, split by kind of help rather than by who gets notified:
  - **995** — ambulance/fire (SCDF). The default for this cohort; most elderly emergencies are medical.
  - **999** — police.
  - **Call my next-of-kin** — the "not sure / need help" path, so uncertainty has somewhere to go other than freezing or over-escalating.
- Next-of-kin notification fires automatically on 995 and 999. It is not a button the user picks during a crisis.
- **Confirm-to-proceed**: pressing an emergency button raises a persistent, spoken, haptic confirmation prompt, and the call is placed only on explicit confirmation. Silence produces no call. See design.md D1 for the accepted risk this carries and what would reopen it.
- Emergency dialling is hardcoded and offline-capable. No LLM, no network call, and no backend dependency sits between the press and the dial.
- Alarm salience comes from size, motion, sound and haptics rather than colour, since colour-vision loss and cataracts are near-universal in this cohort.
- Responder context (location, medical profile, NOK details) is assembled around the call on a best-effort basis and never gates it.

**Care delegation**

- A resident may grant scoped, revocable access over their own record to one or more caregivers (adult child, spouse, domestic helper, social worker).
- Scopes are explicit and separable — appointments, health, emergency contact, bookings — so a helper managing transport does not see clinical history.
- Delegation grants are recorded with their own audit trail. Singpass proves who a person is; it does not record what they agreed to.
- Actions taken on a resident's behalf are attributed and visible to the resident.
- Notifications route to whoever can act on them, not to whoever owns the data.
- Revocation is available to the resident at all times, with an assisted path for the case where the resident can no longer manage it themselves.

## Capabilities

### New Capabilities

- `emergency-response`: the emergency surface, its three routes, the confirm-to-proceed interaction, offline and no-LLM guarantees, automatic next-of-kin notification, and responder context assembly.
- `care-delegation`: the resident/caregiver relationship, scope definitions, grant and revocation lifecycle, consent audit trail, action attribution, and notification routing by actionability.

### Modified Capabilities

None. This is the first change in the project; no specs exist yet.

## Impact

- **Identity**: Singpass/Myinfo supplies identity, address and household. Health conditions, mobility and language are not available from Myinfo and must be declared by the resident or a caregiver. Delegation grants are app-owned data, not Myinfo data.
- **Data protection**: health scopes and delegation records are PDPA-sensitive and carry the heaviest governance in the product. Consent records must survive account changes and be independently auditable.
- **Platform**: emergency dialling needs native telephony, offline persistence of NOK details, and permission to place calls and read location from a locked or backgrounded state. This constrains the choice of app shell — a pure web app cannot meet the offline dialling requirement.
- **Downstream**: every later capability (facility discovery, bookings, events, proactive nudges) reads profile through delegation scopes and must respect action attribution. The agent's "confirm before any outbound action" rule depends on delegation to decide *who* is entitled to confirm.
- **Out of scope for this change**: facility discovery, booking flows, the events feed, the proactive nudge engine, and the agent's conversational surface. Mocked booking integrations are introduced in a later change.

    <script>
        // The source block carries the Markdown verbatim except for two escaped

        (function () {
            // textContent starts at the newline that follows the opening tag, which
            // the Python-side extract_markdown slice does not include. Drop it so

            var raw = document.getElementById('markdown-source').textContent.replace(/^\n/, '');
            var text = raw.replace(/<(\\+)(\/script|!--)/gi, function (match, slashes, marker) {
                return '<' + slashes.slice(1) + marker;
            });
            var body = document.getElementById('markdown-body');
            body.innerHTML = marked.parse(text);
            // Most documents open with their own H1, and the proposal derives the
            // manifest title from exactly that heading, so the page would print the
            // title twice. Drop the article's copy when it repeats the header rather
            // than stripping it from the source, which has to stay byte-exact.
            // The H1 is not always the first element — several sources open with a
            // banner line — so match on the first H1 anywhere in the article. Equal
            // text is the whole test: a heading that differs really does say
            // something else, and both copies stay.
            var lead = body.querySelector('h1');
            var heading = document.querySelector('header h1');
            if (lead && heading &&
                lead.textContent.trim() === heading.textContent.trim()) {
                lead.remove();
            }
