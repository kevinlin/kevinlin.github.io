# PRD: Try Before You Decide

## 1. Overview

Try Before You Decide is a decision simulator inside a retail bank's consumer app. At a real decision point (instalment plan, loan, first investment), the app plays out the next 12 to 24 months as a short interactive story using the customer's own numbers. The customer can change the choice and watch the story change.

The workshop goal is to build one decision: at checkout, the customer taps "play out 24 months", sees three story cards, and then chooses a plan.

### 1.1 Goals

1. Show customers the consequences of a financial choice before they commit to it.
2. Build each scenario from the customer's real account data, at the moment of decision.
3. Let the customer compare options by changing the choice and replaying the story.
4. Stay on the education side of the line: show consequences, never recommend a product.
5. Make every number on screen traceable to its source.

### 1.2 Target Users

- Retail bank customers about to take an instalment plan, loan or first investment.
- The bank's compliance team, who must sign off that the feature is not advice.
- Later: parents and teens, through a family version.
- Workshop builders who need a clear target for a generated, data-driven flow.

### 1.3 Business Context

- **Opportunity:** AI can generate interactive, personal scenarios on the fly, but financial education is still articles and quizzes nobody reads. People learn about debt after they're already in trouble.
- **Client:** retail bank, built into its consumer app.
- **Zühlke offering:** a decision simulator for any lender's app. A family version for parents and teens is the next step.
- **AI-native angle:** a personal scenario generated from real account data at the moment of the decision. A generic course can't do that.
- **Why Zühlke:** the line between education and advice. The feature has to stay outside MAS financial advisory rules, and every number on screen must be traceable. That is a design and compliance problem as much as a technical one.

## 2. Core User Journeys

### 2.1 Play Out a Decision (hero flow)

1. Daniel is at checkout, about to take a 24-month instalment plan.
2. The app offers "play out 24 months".
3. The app shows three story cards built from his own numbers.
4. In month 7 the aircon breaks, rent goes up, and his three other plans are still running.
5. Daniel sees how much room is left in his budget that month.

### 2.2 Change the Choice

1. Daniel switches to a shorter plan or a smaller amount.
2. The story replays with the new choice.
3. He compares the two outcomes and chooses a plan.

### 2.3 Trace a Number

1. The customer taps any number in a story card.
2. The app shows where the number comes from: account data, the plan terms, or a stated assumption.

## 3. Functional Requirements

### 3.1 Trigger

- The simulator must appear at real decision points in the app, starting with checkout instalment plans.
- The customer can skip it and continue.

### 3.2 Scenario Generation

- Each scenario must use the customer's real account data: income, existing plans, regular costs.
- The story must cover 12 to 24 months, told as a small number of cards.
- Life events in the story (a repair bill, a rent rise) must be labelled as examples, not predictions.

### 3.3 Compare Choices

- The customer must be able to change the choice and replay the story.
- The app must show the outcomes of different choices side by side or one after another.

### 3.4 Compliance Guardrails

- The app must never recommend a product.
- Every number on screen must be traceable to account data, plan terms or a stated assumption.
- Compliance reviews the wording before launch.

## 4. Acceptance Criteria

1. A customer at checkout can start "play out 24 months".
2. The app shows three story cards using the customer's own numbers.
3. The customer can change the plan and see the story change.
4. Every number on a card shows its source on tap.
5. Example events are clearly labelled as examples.
6. No screen recommends a product.
7. The customer can choose a plan and return to checkout.
8. The prototype stays simple enough for workshop implementation.

## 5. Open Questions

- **Won't the bank lose sales?** Some. It gains fewer defaults and complaints, plus customers who trust it.
- **Is it advice?** No. It shows consequences and never recommends a product. Get compliance in early.
