# PRD: Luggage Packing Genie

## 1. Overview

Luggage Packing Genie is a packing assistant inside a travel platform or super-app. The traveller takes a photo of the items on the bed and of the open suitcase. If everything fits, the app shows a 3D view of the packed bag and a step-by-step packing order. If it doesn't fit, the app uses the itinerary to suggest what to buy at the destination, what to send ahead to a later stop, and what to get rid of along the way.

The workshop goal is to build the "doesn't fit" flow: photo, item list, "doesn't fit" result, then three suggestions tied to the itinerary.

### 1.1 Goals

1. Estimate items and volume from one photo.
2. Show whether the items fit the suitcase, and how to pack them if they do.
3. When they don't fit, give suggestions based on the trip itinerary.
4. Present every estimate as a guide, not a guarantee.
5. Keep the prototype small enough to build in a coding workshop.

### 1.2 Target Users

- Travellers on multi-stop trips.
- The travel platform, which earns commission on forwarding, shopping and local services.
- Later: airlines.
- Workshop builders who need a clear target for a photo-to-plan flow.

### 1.3 Business Context

- **Opportunity:** packing for a multi-stop trip is a nightly routine of guessing, repacking and paying excess baggage. Vision models can now estimate what's in a photo, and the platform already knows the itinerary.
- **Client:** travel platform or super-app. Airlines are the second market.
- **Zühlke offering:** an AI trip-logistics layer: packing, forwarding, shopping at the destination.
- **AI-native angle:** estimating items and volume from a photo, packing them in 3D, and planning around the trip. Each step needs a different kind of AI.
- **Why Zühlke:** honest estimates, airline rules on batteries and liquids, and private handling of photos of people's belongings. This is the weakest of the five ideas on "why Zühlke", so the pitch leans on design and integration.

## 2. Core User Journeys

### 2.1 It Fits

1. The traveller photographs the items on the bed and the open suitcase.
2. The app lists the items it recognised.
3. The app shows a 3D view of the packed bag.
4. The app gives a step-by-step packing order.

### 2.2 It Doesn't Fit (hero flow)

1. Wei Ling has Tokyo meetings, then Hokkaido skiing.
2. She photographs her items and her suitcase.
3. The app lists the items and shows they don't fit.
4. The app reads her itinerary and suggests sending the ski gear ahead to the Hokkaido hotel.
5. The app offers two more suggestions, such as buying an item at the destination.
6. She accepts the forwarding suggestion and books it in the app.

### 2.3 Rules Check

1. The app spots an item covered by airline rules, such as a power bank or liquids.
2. The app tells the traveller which bag it must go in, or that it must stay behind.

## 3. Functional Requirements

### 3.1 Photo Capture

- The app must accept a photo of the items and a photo of the open suitcase.
- Photos of people's belongings must be handled privately and not kept longer than needed.

### 3.2 Item Recognition

- The app must list recognised items with an estimated volume for each.
- The traveller must be able to correct the list (add, remove, rename items).

### 3.3 Fit Check and 3D View

- The app must estimate whether the items fit the suitcase.
- If they fit, the app shows a 3D view and a packing order.
- Every estimate must be labelled as a guide.

### 3.4 Itinerary Suggestions

- If the items don't fit, the app must read the itinerary and make suggestions in three kinds: buy at the destination, send ahead to a later stop, get rid of along the way.
- Each suggestion must name the trip stop it relates to.
- The traveller can book a forwarding or shopping suggestion in the app.

### 3.5 Airline Rules

- The app must flag items covered by airline rules on batteries and liquids.

## 4. Acceptance Criteria

1. A traveller can upload a photo of items and a photo of a suitcase.
2. The app shows a list of recognised items that the traveller can edit.
3. The app shows whether the items fit, labelled as an estimate.
4. When items don't fit, the app shows three suggestions tied to the itinerary.
5. Each suggestion names the trip stop it relates to.
6. The app flags batteries and liquids.
7. The prototype stays simple enough for workshop implementation.

## 5. Open Questions

- **Can it really judge volume from one photo?** Roughly. Pitch the 3D view as a guide. The "doesn't fit" branch is where the value is anyway.
- **How does the platform make money?** Commission on luggage forwarding, destination shopping and local services.
