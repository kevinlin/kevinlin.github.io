    <style>
/* =============================================================
   Asia Pacific Earthquake Map
   Direction: seismograph instrument panel.
   Dark glass chrome, monospace readouts, hairline rules,
   magma depth ramp, seismic-orange accent.
   ============================================================= */

:root {
    /* Surfaces */
    --ink:    220 16% 6%;
    --panel:  220 14% 9%;
    --raised: 220 12% 16%;

    /* Text — every pair checked against --panel for WCAG AA */
    --fg:       40 18% 95%;
    --fg-muted: 40 8% 74%;
    --fg-dim:   40 6% 60%;

    /* Accents */
    --accent: 14 88% 58%;
    --warn:   38 92% 56%;
    --danger: 358 74% 64%;

    --line: 0 0% 100%;

    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono",
                 Menlo, Consolas, "Liberation Mono", monospace;

    /* Radii — concentric: outer = inner + padding */
    --r-panel: 14px;
    --r-inner: 8px;

    --shadow:
        0 1px 2px   hsl(220 50% 2% / 0.34),
        0 4px 12px  hsl(220 50% 2% / 0.30),
        0 18px 44px hsl(220 50% 2% / 0.26);

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

    /* Clearance so Leaflet's own controls never sit under the fixed chrome.
       Seeded here for first paint, then measured from the real elements. */
    --chrome-top:    92px;
    --chrome-bottom: 104px;

    /* Layers */
    --z-map:     0;
    --z-chrome:  500;
    --z-readout: 600;
    --z-toast:   900;
    --z-overlay: 1000;
}

*, *::before, *::after { box-sizing: border-box; }

html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

body {
    margin: 0;
    overflow: hidden;
    background: hsl(var(--ink));
    color: hsl(var(--fg));
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.5;
}

h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }

/* Anything whose value changes must not reflow its neighbours. */
output, dd, .readout-primary, .readout-secondary { font-variant-numeric: tabular-nums; }

:focus-visible {
    outline: 2px solid hsl(var(--accent));
    outline-offset: 2px;
}

/* ---------- Skip link ---------- */

.skip-link {
    position: fixed;
    top: 8px;
    left: 50%;
    z-index: calc(var(--z-overlay) + 1);
    transform: translate(-50%, -250%);
    padding: 10px 18px;
    border-radius: var(--r-inner);
    background: hsl(var(--accent));
    color: hsl(var(--ink));
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 180ms var(--ease-out);
}

.skip-link:focus { transform: translate(-50%, 0); }

/* ---------- Map ---------- */

#map-container {
    position: fixed;
    inset: 0;
    z-index: var(--z-map);
}

#map {
    width: 100%;
    height: 100%;
    background: hsl(var(--ink));
}

.leaflet-container { font-family: var(--font-mono); }

.leaflet-top    { top: var(--chrome-top); }
.leaflet-bottom { bottom: var(--chrome-bottom); }

/* ---------- Fixed chrome (header + footer) ---------- */

.chrome {
    position: fixed;
    left: 50%;
    z-index: var(--z-chrome);
    width: min(100% - 24px, 1100px);
    transform: translateX(-50%);
    background: hsl(var(--panel) / 0.82);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid hsl(var(--line) / 0.10);
    box-shadow: var(--shadow);
    transition: opacity 240ms var(--ease-out), transform 240ms var(--ease-out);
}

.chrome[data-hidden="true"] {
    opacity: 0;
    pointer-events: none;
}

.chrome--top {
    top: 0;
    padding: 12px 20px 14px;
    border-top: 0;
    border-radius: 0 0 var(--r-panel) var(--r-panel);
    text-align: center;
}

.chrome--top[data-hidden="true"] { transform: translateX(-50%) translateY(-100%); }

/* Seismic hairline under the title block. */
.chrome--top::after {
    content: "";
    position: absolute;
    inset-inline: 20px;
    bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, hsl(var(--accent) / 0.55), transparent);
}

.chrome--top h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

.chrome--top h1 em {
    font-style: normal;
    color: hsl(var(--accent));
}

.chrome--top p {
    margin: 6px 0 0;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: hsl(var(--fg-muted));
}

.chrome--bottom {
    bottom: 0;
    padding: 14px 20px 12px;
    border-bottom: 0;
    border-radius: var(--r-panel) var(--r-panel) 0 0;
}

.chrome--bottom[data-hidden="true"] { transform: translateX(-50%) translateY(100%); }

/* ---------- Filter controls ---------- */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.field {
    display: flex;
    align-items: center;
    gap: 14px;
}

.field-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: hsl(var(--fg-dim));
}

#year-slider {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(170px, 32vw, 320px);
    height: 44px;            /* 44px hit area around a 4px track */
    margin: 0;
    background: transparent;
    cursor: pointer;
}

#year-slider::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background:
        linear-gradient(90deg,
            hsl(var(--accent)) var(--fill, 100%),
            hsl(var(--line) / 0.16) var(--fill, 100%));
}

#year-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    margin-top: -6px;
    border: 3px solid hsl(var(--accent));
    border-radius: 50%;
    background: hsl(var(--fg));
    box-shadow: 0 1px 3px hsl(220 50% 2% / 0.55);
    transition: transform 120ms var(--ease-out);
}

#year-slider:active::-webkit-slider-thumb { transform: scale(1.14); }

#year-slider::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: hsl(var(--line) / 0.16);
}

#year-slider::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: hsl(var(--accent));
}

#year-slider::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border: 3px solid hsl(var(--accent));
    border-radius: 50%;
    background: hsl(var(--fg));
}

#year-readout {
    display: flex;
    align-items: baseline;
    gap: 5px;
    min-width: 184px;        /* reserved so digits never shift the row */
}

.readout-primary {
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
}

.readout-unit {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: hsl(var(--fg-dim));
}

.readout-secondary {
    margin-left: 4px;
    font-size: 11px;
    color: hsl(var(--fg-muted));
}

.source-line {
    margin: 10px 0 0;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-align: center;
    color: hsl(var(--fg-dim));
}

/* ---------- Buttons ---------- */

.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 124px;
    min-height: 44px;
    padding: 0 18px;
    border: 1px solid hsl(var(--line) / 0.14);
    border-radius: var(--r-inner);
    background: hsl(var(--raised) / 0.85);
    color: hsl(var(--fg));
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 130ms var(--ease-out),
                border-color 130ms var(--ease-out),
                transform 90ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
    .btn:hover {
        background: hsl(var(--raised));
        border-color: hsl(var(--accent) / 0.55);
    }
}

.btn:active { transform: scale(0.97); }

.btn[disabled] {
    opacity: 0.5;
    cursor: default;
}

.btn::before {
    content: "";
    display: none;
    width: 12px;
    height: 12px;
    border: 2px solid hsl(var(--line) / 0.28);
    border-top-color: hsl(var(--accent));
    border-radius: 50%;
    animation: spin 700ms linear infinite;
}

.btn[aria-busy="true"]::before { display: block; }

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Legend ---------- */

.legend {
    max-width: 268px;
    padding: 6px;            /* concentric: 14 - 6 = 8 inner */
    border: 1px solid hsl(var(--line) / 0.10);
    border-radius: var(--r-panel);
    background: hsl(var(--panel) / 0.86);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    color: hsl(var(--fg));
}

.legend summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
    padding: 0 8px;
    border-radius: var(--r-inner);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: hsl(var(--fg-muted));
    cursor: pointer;
    list-style: none;
}

.legend summary::-webkit-details-marker { display: none; }

.legend summary::after {
    content: "";
    width: 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-135deg);
    transition: transform 180ms var(--ease-out);
}

.legend:not([open]) summary::after { transform: rotate(45deg); }

@media (hover: hover) and (pointer: fine) {
    .legend summary:hover { background: hsl(var(--line) / 0.06); }
}

.legend-body { padding: 4px 8px 8px; }

.legend h3 {
    margin: 12px 0 6px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: hsl(var(--fg-dim));
}

.legend h3:first-child { margin-top: 4px; }

.legend ul {
    margin: 0;
    padding: 0;
    list-style: none;
}

/* Depth ramp: five equal bands, each labelled — never colour alone. */
.depth-ramp {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
}

.depth-ramp li {
    font-size: 9px;
    text-align: center;
    color: hsl(var(--fg-muted));
}

.depth-ramp li::before {
    content: "";
    display: block;
    height: 9px;
    margin-bottom: 4px;
    border-radius: 2px;
    background: var(--c);
}

.mag-scale {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    padding-left: 2px;
}

.mag-scale li {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    color: hsl(var(--fg-muted));
}

.mag-scale .dot {
    width: var(--d);
    height: var(--d);
    border: 1px solid hsl(var(--line) / 0.55);
    border-radius: 50%;
    background: hsl(var(--line) / 0.14);
}

.belt-key li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: hsl(var(--fg-muted));
}

.belt-key li + li { margin-top: 5px; }

/* The dash pattern carries the meaning alongside the hue. */
.belt-key .dash {
    flex: 0 0 22px;
    height: 0;
    border-top: 2px dashed var(--c);
}

.belt-key .dash[data-pattern="dotted"] { border-top-style: dotted; }

/* ---------- Leaflet control skins ---------- */

.leaflet-bar {
    border: 0 !important;
    border-radius: var(--r-inner) !important;
    box-shadow: var(--shadow) !important;
    overflow: hidden;
}

.leaflet-bar a,
.leaflet-bar a:hover {
    width: 34px;
    height: 34px;
    line-height: 34px;
    border-bottom: 1px solid hsl(var(--line) / 0.10);
    background: hsl(var(--panel) / 0.88);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: hsl(var(--fg));
}

@media (hover: hover) and (pointer: fine) {
    .leaflet-bar a:hover { background: hsl(var(--raised)); }
}

@media (pointer: coarse) {
    .leaflet-touch .leaflet-bar a,
    .leaflet-bar a {
        width: 44px;
        height: 44px;
        line-height: 44px;
    }

    .leaflet-touch .leaflet-control-layers-toggle { background-size: 22px 22px; }
}

.leaflet-control-layers {
    border: 1px solid hsl(var(--line) / 0.10) !important;
    border-radius: var(--r-inner) !important;
    background: hsl(var(--panel) / 0.88) !important;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow) !important;
    color: hsl(var(--fg));
}

.leaflet-control-layers-toggle {
    width: 34px;
    height: 34px;
    background-size: 18px 18px;
    filter: invert(1) opacity(0.85);
}

.leaflet-control-layers-expanded {
    padding: 10px 12px !important;
    font-size: 11px;
}

.leaflet-control-layers-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 30px;
    margin: 0;
}

.leaflet-control-layers input { accent-color: hsl(var(--accent)); }

.leaflet-control-attribution {
    padding: 2px 8px;
    border-radius: 6px 0 0 0;
    background: hsl(var(--panel) / 0.74) !important;
    color: hsl(var(--fg-dim)) !important;
    font-size: 9px;
}

.leaflet-control-attribution a { color: hsl(var(--fg-muted)) !important; }

/* ---------- Marker tooltip ---------- */

.leaflet-tooltip.quake-tip {
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
}

.leaflet-tooltip.quake-tip::before { display: none; }

.quake-tip__body {
    min-width: 208px;
    padding: 10px 12px;
    border: 1px solid hsl(var(--line) / 0.14);
    border-radius: var(--r-inner);
    background: hsl(var(--panel) / 0.95);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    color: hsl(var(--fg));
}

.quake-tip__mag {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}

.quake-tip__place {
    margin-top: 2px;
    font-size: 11px;
    line-height: 1.35;
    color: hsl(var(--fg-muted));
}

.quake-tip__body dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 12px;
    margin: 9px 0 0;
    padding-top: 8px;
    border-top: 1px solid hsl(var(--line) / 0.10);
    font-size: 10px;
}

.quake-tip__body dt {
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: hsl(var(--fg-dim));
}

.quake-tip__body dd {
    margin: 0;
    color: hsl(var(--fg));
}

/* ---------- Loading overlay ---------- */

#loading-overlay {
    position: fixed;
    inset: 0;
    z-index: var(--z-overlay);
    display: none;
    place-items: center;
    background: hsl(var(--ink) / 0.78);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
}

#loading-overlay[data-visible="true"] { display: grid; }

.loading-panel {
    width: min(90vw, 372px);
    padding: 28px;
    border: 1px solid hsl(var(--line) / 0.10);
    border-radius: 18px;
    background: hsl(var(--panel));
    box-shadow: var(--shadow);
    text-align: center;
    animation: panelIn 260ms var(--ease-out) both;
}

@keyframes panelIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
}

/* A seismograph trace stands in for the generic spinner. */
.trace {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 44px;
    margin-bottom: 20px;
}

.trace span {
    width: 4px;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(180deg, hsl(var(--accent)), hsl(var(--warn)));
    transform: scaleY(0.2);
    animation: seismic 1100ms var(--ease-out) infinite;
}

.trace span:nth-child(1) { animation-delay: 0ms; }
.trace span:nth-child(2) { animation-delay: 80ms; }
.trace span:nth-child(3) { animation-delay: 160ms; }
.trace span:nth-child(4) { animation-delay: 240ms; }
.trace span:nth-child(5) { animation-delay: 320ms; }
.trace span:nth-child(6) { animation-delay: 400ms; }
.trace span:nth-child(7) { animation-delay: 480ms; }

@keyframes seismic {
    0%, 100% { transform: scaleY(0.16); opacity: 0.45; }
    50%      { transform: scaleY(1);    opacity: 1; }
}

.loading-panel h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.loading-panel p {
    margin: 8px 0 16px;
    font-size: 11px;
    color: hsl(var(--fg-muted));
}

#loading-progress {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: hsl(var(--accent));
}

/* ---------- Toasts ---------- */

.toast-region {
    position: fixed;
    bottom: var(--chrome-bottom);
    left: 16px;
    z-index: var(--z-toast);
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(92vw, 336px);
    pointer-events: none;
}

.toast {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 12px;
    border: 1px solid hsl(var(--line) / 0.12);
    border-left: 3px solid hsl(var(--danger));
    border-radius: var(--r-inner);
    background: hsl(var(--panel) / 0.94);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    pointer-events: auto;
    animation: toastIn 220ms var(--ease-out) both;
}

.toast--warn { border-left-color: hsl(var(--warn)); }

/* Exits are quicker and softer than entrances. */
.toast[data-leaving="true"] { animation: toastOut 150ms var(--ease-out) both; }

@keyframes toastIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-14px); }
}

.toast p {
    flex: 1;
    margin: 0;
    font-size: 11px;
    line-height: 1.45;
    color: hsl(var(--fg-muted));
}

.toast strong {
    display: block;
    margin-bottom: 2px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: hsl(var(--fg));
}

/* ---------- Readout card ---------- */

.readout-card {
    position: fixed;
    top: var(--chrome-top);
    right: 12px;
    z-index: var(--z-readout);
    width: min(88vw, 286px);
    padding: 6px;
    border: 1px solid hsl(var(--line) / 0.10);
    border-radius: var(--r-panel);
    background: hsl(var(--panel) / 0.86);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out);
}

.readout-card[data-leaving="true"] {
    opacity: 0;
    transform: translateX(14px);
}

.readout-card__inner {
    padding: 12px;
    border-radius: var(--r-inner);
    background: hsl(var(--line) / 0.03);
}

.readout-card--fallback { border-left: 3px solid hsl(var(--warn)); }

.readout-card h2 {
    margin: 0 0 10px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: hsl(var(--fg-dim));
}

.readout-card dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 5px 12px;
    margin: 0;
    font-size: 11px;
}

.readout-card dt {
    align-self: center;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: hsl(var(--fg-dim));
}

.readout-card dd { margin: 0; }

.readout-card .note {
    margin: 10px 0 0;
    padding-top: 8px;
    border-top: 1px solid hsl(var(--line) / 0.10);
    font-size: 10px;
    line-height: 1.4;
    color: hsl(var(--warn));
}

.close-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: hsl(var(--fg-dim));
    font: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out);
}

/* Pads a 26px glyph out to a 44px touch target. */
.close-btn::before {
    content: "";
    position: absolute;
    inset: -9px;
}

@media (hover: hover) and (pointer: fine) {
    .close-btn:hover {
        background: hsl(var(--line) / 0.10);
        color: hsl(var(--fg));
    }
}

.close-btn:active { transform: scale(0.94); }

/* ---------- Responsive ---------- */

@media (max-width: 880px) {
    .controls {
        flex-direction: column;
        gap: 12px;
    }

    .readout-card {
        right: 12px;
        left: 12px;
        width: auto;
    }
}

@media (max-width: 620px) {
    .chrome--top { padding: 10px 14px 12px; }
    .chrome--top h1 { font-size: 12px; letter-spacing: 0.14em; }
    .chrome--top p { font-size: 10px; }
    .chrome--bottom { padding: 12px 14px 10px; }

    .field {
        flex-direction: column;
        gap: 2px;
    }

    #year-slider { width: min(78vw, 300px); }

    #year-readout {
        min-width: 0;
        justify-content: center;
    }

    .legend { max-width: 232px; }

    .toast-region { left: 12px; }
}

/* ---------- Reduced motion ---------- */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }

    /* Keep the loader legible once its animation is stilled. */
    .trace span {
        transform: scaleY(0.6);
        opacity: 0.9;
    }
}
    </style>
</head>
<body>
    <a class="skip-link" href="#year-slider">Skip to map controls</a>

    <header class="chrome chrome--top" id="app-header">
        <h1>Asia Pacific <em>Earthquake Map</em></h1>
        <p>Magnitude 6.0 and above, past 200 years, over the tectonic belts</p>
    </header>

    <div id="map-container">
        <div id="map" role="application" aria-label="Interactive map of Asia Pacific earthquakes. Use arrow keys to pan and plus or minus to zoom."></div>
    </div>

    <footer class="chrome chrome--bottom" id="app-footer">
        <div class="controls">
            <div class="field">
                <label class="field-label" for="year-slider">Time window</label>
                <input type="range" id="year-slider" min="1" max="200" value="200"
                       aria-describedby="year-readout">
                <output id="year-readout" for="year-slider" aria-live="polite">
                    <span class="readout-primary" id="year-value">200</span>
                    <span class="readout-unit">years</span>
                    <span class="readout-secondary" id="event-summary">loading</span>
                </output>
            </div>
            <button type="button" id="refresh-data" class="btn">
                <span class="btn-label">Refresh</span>
            </button>
        </div>
        <p class="source-line">Live USGS Earthquake Catalog, with a bundled catalog file as fallback</p>
    </footer>

    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

    <div id="loading-overlay" role="status" aria-live="polite">
        <div class="loading-panel">
            <div class="trace" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <h2>Reading the catalog</h2>
            <p>Querying the USGS earthquake archive</p>
            <div id="loading-progress">0 events</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
/* =============================================================
   Asia Pacific Earthquake Map
   ============================================================= */

// ---------- Configuration ----------

const USGS_API_BASE = 'https://earthquake.usgs.gov/fdsnws/event/1/query';
const MIN_MAGNITUDE = 6.0;
const YEARS_OF_HISTORY = 200;
const PAGE_SIZE = 20000;
const FALLBACK_CSV_URL = 'data/major-earthquakes.csv';

// Two windows, so no single query straddles the International Date Line.
const REGIONS = [
    { name: 'Western Pacific', minlatitude: -60, maxlatitude: 70, minlongitude: 60,   maxlongitude: 180 },
    { name: 'Eastern Pacific', minlatitude: -60, maxlatitude: 70, minlongitude: -180, maxlongitude: -120 }
];

// Magma ramp, shallow to deep. Single source of truth for markers and legend.
const DEPTH_STOPS = [
    { max: 10,       color: '#fcfdbf', label: '<10'     },
    { max: 50,       color: '#fe9f6d', label: '10–50'   },
    { max: 100,      color: '#de4968', label: '50–100'  },
    { max: 300,      color: '#8c2981', label: '100–300' },
    { max: Infinity, color: '#5b1a8f', label: '>300'    }
];

const MAGNITUDE_TICKS = [6, 7, 8, 9];

// Belts read as cool dashed lines so they never compete with the magma markers.
const BELTS = [
    {
        name: 'Ring of Fire',
        color: '#38bdf8',
        pattern: 'dashed',
        dashArray: '10 7',
        coordinates: [
            // Segment 1 — the Americas
            [
                // North America West Coast
                [60, -150], [55, -135], [50, -125], [45, -125], [40, -125], [35, -120], [30, -115], [25, -110],
                // Central America
                [20, -105], [15, -95], [10, -85],
                // South America West Coast
                [5, -80], [0, -80], [-5, -80], [-10, -75], [-15, -75], [-20, -70], [-25, -70], [-30, -70], [-35, -70], [-40, -75], [-45, -75], [-50, -75]
            ],
            // Segment 2 — Antarctica through Asia to the Aleutians.
            // Longitudes run past 180 so the line leaves the frame instead of
            // doubling back across it.
            [
                // Antarctica to New Zealand
                [-65, 170], [-60, 175], [-45, 170], [-40, 175],
                // New Zealand to Papua New Guinea
                [-35, 175], [-30, 170], [-25, 165], [-20, 160], [-15, 155], [-10, 150], [-5, 145],
                // Indonesia, Philippines
                [0, 140], [5, 135], [10, 125], [15, 120],
                // Japan, Kuril Islands, Kamchatka
                [20, 125], [25, 125], [30, 130], [35, 140], [40, 145], [45, 150], [50, 155], [55, 160], [60, 165],
                // Aleutian Islands, Alaska
                [55, 170], [55, 180], [55, 190], [55, 200], [60, 210]
            ]
        ]
    },
    {
        name: 'Alpide belt',
        color: '#a3e635',
        pattern: 'dotted',
        dashArray: '2 7',
        coordinates: [
                // Mediterranean to Middle East
                [35, -5], [37, 0], [38, 5], [38, 10], [38, 15], [37, 20], [37, 25], [38, 30], [38, 35], [37, 40], [37, 45],
                // Iran, Afghanistan, Pakistan
                [35, 50], [33, 55], [32, 60], [30, 65], [28, 70],
                // Himalayas
                [27, 75], [28, 80], [28, 85], [28, 90], [27, 95],
                // Myanmar, Thailand
                [25, 97], [20, 98], [15, 99], [10, 100],
                // Indonesia (connecting to Ring of Fire)
                [5, 105], [0, 110], [-5, 115], [-10, 120]
        ]
    }
];

// ---------- State ----------

let map;
let allEarthquakes = [];
let earthquakeLayer;
let currentYearFilter = YEARS_OF_HISTORY;

// ---------- Map setup ----------

// preferCanvas keeps ~14k circle markers pannable; SVG chokes at that count.
map = L.map('map', {
    preferCanvas: true,
    zoomControl: false,
    worldCopyJump: true
}).setView([20, 130], 3);

L.control.zoom({ position: 'topleft' }).addTo(map);

const OSM_ATTRIBUTION =
    'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

const ESRI_DARK = 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_{layer}/MapServer/tile/{z}/{y}/{x}';

// Base and labels are separate Esri services, so the dark ground is one group.
const darkBasemap = L.layerGroup([
    L.tileLayer(ESRI_DARK, { layer: 'Base', attribution: 'Tiles &copy; <a href="https://www.esri.com">Esri</a>', maxZoom: 16 }),
    L.tileLayer(ESRI_DARK, { layer: 'Reference', maxZoom: 16 })
]);

const baseLayers = {
    // Dark ground by default: the magma ramp only reads against it.
    'Dark': darkBasemap,
    'Terrain': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: `${OSM_ATTRIBUTION}, <a href="http://viewfinderpanoramas.org">SRTM</a> | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)`,
        maxZoom: 17
    })
};

darkBasemap.addTo(map);
L.control.layers(baseLayers, null, { position: 'topleft' }).addTo(map);

// Dedicated pane keeps the belts beneath the event markers whatever the draw order.
map.createPane('belts');
map.getPane('belts').style.zIndex = 350;

// ---------- Scales ----------

// Doubling radius per magnitude step, so an M8 reads as an order of magnitude
// bigger than an M6 rather than 30% bigger.
function getMarkerSize(magnitude) {
    return 2 + Math.pow(2, magnitude - MIN_MAGNITUDE) * 1.15;
}

function getMarkerColor(depth) {
    return (DEPTH_STOPS.find(stop => depth < stop.max) || DEPTH_STOPS[DEPTH_STOPS.length - 1]).color;
}

// ---------- Belts and legend ----------

function drawEarthquakeBelts() {
    BELTS.forEach(belt => {
        L.polyline(belt.coordinates, {
            pane: 'belts',
            color: belt.color,
            weight: 2,
            opacity: 0.75,
            dashArray: belt.dashArray,
            smoothFactor: 1,
            interactive: false
        }).addTo(map);
    });
}

// One legend for depth, magnitude and belts. Swatches are generated from the
// same scale functions the markers use, so they cannot drift apart.
function addLegend() {
    const control = L.control({ position: 'bottomright' });

    control.onAdd = function () {
        const details = L.DomUtil.create('details', 'legend');
        details.open = !window.matchMedia('(max-width: 700px)').matches;

        const depthCells = DEPTH_STOPS
            .map(stop => `<li style="--c: ${stop.color}">${stop.label}</li>`)
            .join('');

        const magCells = MAGNITUDE_TICKS
            .map(mag => `<li><span class="dot" style="--d: ${(getMarkerSize(mag) * 2).toFixed(1)}px"></span>${mag}</li>`)
            .join('');

        const beltCells = BELTS
            .map(belt => `<li><span class="dash" data-pattern="${belt.pattern}" style="--c: ${belt.color}"></span>${belt.name}</li>`)
            .join('');

        details.innerHTML = `
            <summary><span>Scale</span></summary>
            <div class="legend-body">
                <h3>Depth, km below surface</h3>
                <ul class="depth-ramp">${depthCells}</ul>
                <h3>Magnitude</h3>
                <ul class="mag-scale">${magCells}</ul>
                <h3>Tectonic belts</h3>
                <ul class="belt-key">${beltCells}</ul>
            </div>
        `;

        // Let the legend take clicks and scrolls without panning the map underneath.
        L.DomEvent.disableClickPropagation(details);
        L.DomEvent.disableScrollPropagation(details);
        return details;
    };

    control.addTo(map);
}

// ---------- Chrome (auto-hide header and footer) ----------

const INACTIVITY_DELAY = 5000;   // long enough to read the title and reach the slider
let inactivityTimer;

function chromeElements() {
    return [document.getElementById('app-header'), document.getElementById('app-footer')];
}

// Never hide chrome that the pointer is over or the keyboard is inside.
function chromeIsEngaged() {
    return chromeElements().some(el =>
        el && (el.matches(':hover') || el.contains(document.activeElement))
    );
}

function setChromeHidden(hidden) {
    chromeElements().forEach(el => {
        if (el) el.dataset.hidden = String(hidden);
    });
}

// Leaflet's controls, the toast and the readout card all clear the chrome by
// its measured height, so a taller stacked footer can never cover them.
function syncChromeClearance() {
    const [header, footer] = chromeElements();
    const root = document.documentElement.style;
    if (header) root.setProperty('--chrome-top', `${Math.ceil(header.offsetHeight) + 12}px`);
    if (footer) root.setProperty('--chrome-bottom', `${Math.ceil(footer.offsetHeight) + 12}px`);
}

function resetInactivityTimer() {
    clearTimeout(inactivityTimer);
    setChromeHidden(false);
    inactivityTimer = setTimeout(() => {
        if (!chromeIsEngaged()) setChromeHidden(true);
    }, INACTIVITY_DELAY);
}

// ---------- Loading overlay ----------

function showLoadingIndicator() {
    document.getElementById('loading-overlay').dataset.visible = 'true';
}

function hideLoadingIndicator() {
    document.getElementById('loading-overlay').dataset.visible = 'false';
}

function updateLoadingProgress(count, regionInfo = '') {
    const el = document.getElementById('loading-progress');
    if (!el) return;
    el.textContent = `${count.toLocaleString()} events${regionInfo ? ` · ${regionInfo}` : ''}`;
}

// ---------- Toasts ----------

// A non-blocking toast, not a modal: a failed API call still leaves a usable map
// behind it, and nothing should be covering that.
function showToast(title, message, variant = 'error') {
    const region = document.getElementById('toast-region');
    if (!region) return;

    const toast = document.createElement('div');
    toast.className = `toast${variant === 'warn' ? ' toast--warn' : ''}`;

    const text = document.createElement('p');
    const heading = document.createElement('strong');
    heading.textContent = title;
    text.append(heading, document.createTextNode(message));

    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'close-btn';
    close.setAttribute('aria-label', 'Dismiss notification');
    close.textContent = '×';

    const dismiss = () => {
        toast.dataset.leaving = 'true';
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
        setTimeout(() => toast.remove(), 400);
    };

    close.addEventListener('click', dismiss);
    toast.append(text, close);
    region.appendChild(toast);
    setTimeout(dismiss, 9000);
}

// ---------- Readout card ----------

function dismissReadoutCard() {
    const card = document.getElementById('data-source-info');
    if (!card) return;
    clearTimeout(card.dismissTimer);
    card.dataset.leaving = 'true';
    setTimeout(() => card.remove(), 300);
}

function showReadoutCard(count, isFallback) {
    dismissReadoutCard();

    const card = document.createElement('div');
    card.id = 'data-source-info';
    card.className = `readout-card${isFallback ? ' readout-card--fallback' : ''}`;

    const rows = [
        ['Source', isFallback ? 'Local catalog file' : 'USGS live catalog'],
        ['Events', `${count.toLocaleString()} at M${MIN_MAGNITUDE.toFixed(1)}+`],
        ['Window', `${YEARS_OF_HISTORY} years`],
        ['Region', 'Asia Pacific'],
        ['Loaded', new Date().toLocaleTimeString()]
    ];

    const dl = document.createElement('dl');
    rows.forEach(([term, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = term;
        const dd = document.createElement('dd');
        dd.textContent = value;
        dl.append(dt, dd);
    });

    const heading = document.createElement('h2');
    heading.textContent = 'Data readout';

    const inner = document.createElement('div');
    inner.className = 'readout-card__inner';
    inner.append(heading, dl);

    if (isFallback) {
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = 'Live API unreachable, showing the bundled catalog file.';
        inner.appendChild(note);
    }

    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'close-btn';
    close.setAttribute('aria-label', 'Dismiss data readout');
    close.textContent = '×';
    close.addEventListener('click', dismissReadoutCard);

    card.append(inner, close);
    document.body.appendChild(card);

    // Auto-dismiss, paused whenever the card is hovered or focused.
    const arm = (delay) => {
        clearTimeout(card.dismissTimer);
        card.dismissTimer = setTimeout(dismissReadoutCard, delay);
    };
    card.addEventListener('mouseenter', () => clearTimeout(card.dismissTimer));
    card.addEventListener('focusin', () => clearTimeout(card.dismissTimer));
    card.addEventListener('mouseleave', () => arm(5000));
    card.addEventListener('focusout', () => arm(5000));
    arm(10000);
}

// ---------- Fetching ----------

function buildUSGSApiUrl(startDate, endDate, bounds, offset) {
    const params = new URLSearchParams({
        format: 'geojson',
        minmagnitude: MIN_MAGNITUDE,
        starttime: startDate,
        endtime: endDate,
        minlatitude: bounds.minlatitude,
        maxlatitude: bounds.maxlatitude,
        minlongitude: bounds.minlongitude,
        maxlongitude: bounds.maxlongitude,
        orderby: 'time',
        limit: PAGE_SIZE,
        offset: offset
    });

    return `${USGS_API_BASE}?${params.toString()}`;
}

async function fetchEarthquakeDataFromRegion(startDate, endDate, bounds, regionName) {
    const features = [];
    let offset = 1;

    while (true) {
        const response = await fetch(buildUSGSApiUrl(startDate, endDate, bounds, offset));
        if (!response.ok) {
            throw new Error(`HTTP ${response.status} for ${regionName}`);
        }

        const data = await response.json();
        if (!data.features || data.features.length === 0) break;

        features.push(...data.features);
        updateLoadingProgress(features.length, regionName);

        if (data.features.length < PAGE_SIZE) break;
        offset += PAGE_SIZE;
    }

    return features;
}

async function fetchEarthquakeData(startDate, endDate) {
    const features = [];

    for (const region of REGIONS) {
        const regionFeatures = await fetchEarthquakeDataFromRegion(
            startDate, endDate, region, region.name
        );
        features.push(...regionFeatures);
        updateLoadingProgress(features.length, region.name);
    }

    return features;
}

// ---------- Parsing ----------

function toQuake({ lat, lng, magnitude, depth, place, time }) {
    const date = new Date(time);
    return {
        lat, lng, magnitude,
        depth: depth || 0,
        place: place || 'Unknown location',
        time: date,
        year: date.getFullYear(),
        yearsFromPresent: new Date().getFullYear() - date.getFullYear()
    };
}

function processEarthquakeData(features) {
    return features.reduce((quakes, feature) => {
        const coords = feature.geometry && feature.geometry.coordinates;
        const props = feature.properties;
        if (!coords || coords.length < 2 || !props || !props.mag || !props.time) return quakes;

        quakes.push(toQuake({
            lat: coords[1],          // GeoJSON order is [lng, lat, depth]
            lng: coords[0],
            depth: coords[2],
            magnitude: props.mag,
            place: props.place,
            time: props.time
        }));
        return quakes;
    }, []);
}

// The snapshot is a global catalog, so it gets clipped to the same windows the
// live query uses — otherwise the fallback shows events the API path never would.
function isInRegion(lat, lng) {
    return REGIONS.some(r =>
        lat >= r.minlatitude && lat <= r.maxlatitude &&
        lng >= r.minlongitude && lng <= r.maxlongitude
    );
}

// Minimal RFC 4180 scanner. Every `place` in the catalog is quoted and most
// contain a comma, so splitting on commas would shear the rows apart.
function parseCSV(text) {
    const rows = [];
    let row = [], field = '', quoted = false;

    for (let i = 0; i < text.length; i++) {
        const c = text[i];

        if (quoted) {
            if (c !== '"') field += c;
            else if (text[i + 1] === '"') { field += '"'; i++; }   // escaped quote
            else quoted = false;
            continue;
        }

        if (c === '"') quoted = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(field);
            if (row.length > 1 || row[0] !== '') rows.push(row);
            row = []; field = '';
        }
        else field += c;
    }

    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
}

function parseCsvEarthquakeData(text) {
    const [header, ...rows] = parseCSV(text);
    if (!header) throw new Error('Catalog file is empty');

    // Read columns by name: the catalog's column set has changed before.
    const col = {};
    header.forEach((name, i) => { col[name.trim()] = i; });

    const missing = ['time', 'latitude', 'longitude', 'mag'].filter(name => !(name in col));
    if (missing.length) throw new Error(`Catalog file is missing columns: ${missing.join(', ')}`);

    return rows.reduce((quakes, row) => {
        const lat = Number(row[col.latitude]);
        const lng = Number(row[col.longitude]);
        const magnitude = Number(row[col.mag]);
        const time = row[col.time];

        if (!time || !Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(magnitude)) {
            return quakes;
        }
        if (!isInRegion(lat, lng)) return quakes;

        quakes.push(toQuake({
            lat, lng, magnitude,
            depth: Number(row[col.depth]) || 0,
            place: row[col.place],
            time
        }));
        return quakes;
    }, []);
}

// ---------- Loading ----------

async function loadFallbackEarthquakeData() {
    console.log(`Falling back to ${FALLBACK_CSV_URL}...`);
    showLoadingIndicator();
    updateLoadingProgress(0, 'catalog file');

    try {
        const response = await fetch(FALLBACK_CSV_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status} for ${FALLBACK_CSV_URL}`);

        allEarthquakes = parseCsvEarthquakeData(await response.text());
        if (allEarthquakes.length === 0) throw new Error('Catalog file held no usable events');

        displayEarthquakes(allEarthquakes);
        showReadoutCard(allEarthquakes.length, true);
        showToast('Local snapshot',
            'The live USGS API did not respond, so the bundled catalog file is on the map instead.',
            'warn');

    } catch (error) {
        console.error('Failed to load the fallback catalog file:', error);
        showToast('No data available',
            'Neither the live API nor the bundled catalog file could be read. Try Refresh in a moment.');
    } finally {
        hideLoadingIndicator();
    }
}

async function loadEarthquakeData() {
    const endDate = new Date();
    const startDate = new Date();
    startDate.setFullYear(endDate.getFullYear() - YEARS_OF_HISTORY);

    showLoadingIndicator();

    try {
        const features = await fetchEarthquakeData(
            startDate.toISOString().split('T')[0],
            endDate.toISOString().split('T')[0]
        );

        if (features.length === 0) throw new Error('API returned no events');

        allEarthquakes = processEarthquakeData(features);
        displayEarthquakes(allEarthquakes);
        showReadoutCard(allEarthquakes.length, false);
        hideLoadingIndicator();
        console.log(`Loaded ${allEarthquakes.length} earthquakes from the USGS API`);

    } catch (error) {
        // No toast here: the fallback usually succeeds and reports for itself.
        console.error('API failed, attempting the catalog file:', error);
        await loadFallbackEarthquakeData();
    }
}

// ---------- Rendering ----------

function buildTooltip(quake) {
    const body = document.createElement('div');
    body.className = 'quake-tip__body';

    const mag = document.createElement('div');
    mag.className = 'quake-tip__mag';
    mag.style.color = getMarkerColor(quake.depth);
    mag.textContent = `M ${quake.magnitude.toFixed(1)}`;

    const place = document.createElement('div');
    place.className = 'quake-tip__place';
    place.textContent = quake.place;    // textContent: catalog text is never parsed as HTML

    const dl = document.createElement('dl');
    [
        ['Depth', `${quake.depth.toFixed(1)} km`],
        ['Date', quake.time.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' })],
        ['Position', `${quake.lat.toFixed(2)}, ${quake.lng.toFixed(2)}`]
    ].forEach(([term, value]) => {
        const dt = document.createElement('dt');
        dt.textContent = term;
        const dd = document.createElement('dd');
        dd.textContent = value;
        dl.append(dt, dd);
    });

    body.append(mag, place, dl);
    return body;
}

function displayEarthquakes(earthquakes) {
    if (earthquakeLayer) map.removeLayer(earthquakeLayer);
    earthquakeLayer = L.layerGroup().addTo(map);

    earthquakes.forEach(quake => {
        L.circleMarker([quake.lat, quake.lng], {
            radius: getMarkerSize(quake.magnitude),
            fillColor: getMarkerColor(quake.depth),
            fillOpacity: 0.68,
            color: '#ffffff',
            weight: 0.5,
            opacity: 0.32
        })
            // Built on open, not up front: 14k eager tooltips would stall the load.
            .bindTooltip(() => buildTooltip(quake), { sticky: true, className: 'quake-tip' })
            .addTo(earthquakeLayer);
    });

    updateEventSummary(earthquakes);
}

// Doubles as the non-visual summary of what is on the map, since 14k canvas
// markers cannot themselves be reached by a screen reader.
function updateEventSummary(earthquakes) {
    const summary = document.getElementById('event-summary');
    if (!summary) return;

    if (earthquakes.length === 0) {
        summary.textContent = 'no events in range';
        return;
    }

    const mags = earthquakes.map(q => q.magnitude);
    const years = earthquakes.map(q => q.year);
    summary.textContent =
        `${earthquakes.length.toLocaleString()} events, ` +
        `M${Math.min(...mags).toFixed(1)}–${Math.max(...mags).toFixed(1)}, ` +
        `${Math.min(...years)}–${Math.max(...years)}`;
}

// ---------- Controls ----------

function setupControls() {
    const slider = document.getElementById('year-slider');
    const yearValue = document.getElementById('year-value');
    const refreshBtn = document.getElementById('refresh-data');

    const paintTrack = () => {
        const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
        slider.style.setProperty('--fill', `${pct}%`);
    };

    // Dragging updates the number only; the redraw waits for release, so the
    // slider never fights 14k markers mid-gesture.
    slider.addEventListener('input', () => {
        yearValue.textContent = slider.value;
        paintTrack();
    });

    slider.addEventListener('change', () => {
        currentYearFilter = Number(slider.value);
        displayEarthquakes(allEarthquakes.filter(q => q.yearsFromPresent <= currentYearFilter));
    });

    refreshBtn.addEventListener('click', async () => {
        refreshBtn.disabled = true;
        refreshBtn.setAttribute('aria-busy', 'true');
        refreshBtn.querySelector('.btn-label').textContent = 'Refreshing';

        try {
            await loadEarthquakeData();
            slider.value = String(YEARS_OF_HISTORY);
            currentYearFilter = YEARS_OF_HISTORY;
            yearValue.textContent = String(YEARS_OF_HISTORY);
            paintTrack();
        } finally {
            refreshBtn.disabled = false;
            refreshBtn.removeAttribute('aria-busy');
            refreshBtn.querySelector('.btn-label').textContent = 'Refresh';
        }
    });

    paintTrack();
}

// ---------- Init ----------

['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetInactivityTimer, { passive: true });
});

document.addEventListener('DOMContentLoaded', () => {
    drawEarthquakeBelts();
    addLegend();
    setupControls();
    syncChromeClearance();
    chromeElements().forEach(el => el && new ResizeObserver(syncChromeClearance).observe(el));
    resetInactivityTimer();
    loadEarthquakeData();
});
    </script>
</body>
