Yes. **Java 11 is a major Java feature release**, and it is also an LTS release. Since Java 10, Java has followed a six-month feature-release cycle. In the range from Java 11 onward, the LTS releases are **11, 17, 21, and 25**. As of August 2026, Java 26 is the latest generally available feature release, while Java 25 is the latest LTS release. ([OpenJDK][1])

This covers the main developer-facing features rather than every JEP or internal JVM improvement.

## Release timeline

| Java    |       Released | Support type |
| ------- | -------------: | ------------ |
| Java 11 | September 2018 | LTS          |
| Java 12 |     March 2019 | Non-LTS      |
| Java 13 | September 2019 | Non-LTS      |
| Java 14 |     March 2020 | Non-LTS      |
| Java 15 | September 2020 | Non-LTS      |
| Java 16 |     March 2021 | Non-LTS      |
| Java 17 | September 2021 | LTS          |
| Java 18 |     March 2022 | Non-LTS      |
| Java 19 | September 2022 | Non-LTS      |
| Java 20 |     March 2023 | Non-LTS      |
| Java 21 | September 2023 | LTS          |
| Java 22 |     March 2024 | Non-LTS      |
| Java 23 | September 2024 | Non-LTS      |
| Java 24 |     March 2025 | Non-LTS      |
| Java 25 | September 2025 | LTS          |
| Java 26 |     March 2026 | Non-LTS      |

OpenJDK publishes a feature release every six months. Non-LTS releases are normally superseded by the next feature release. ([OpenJDK][1])

## Java 11, September 2018, LTS

Major features included the standardized HTTP Client, local-variable syntax in lambda parameters, Java Flight Recorder, the Epsilon no-op garbage collector, and stronger removal of older Java EE and CORBA modules. ([OpenJDK][2])

### HTTP Client API

The incubating HTTP client from Java 9 and 10 became a standard API. It supports synchronous and asynchronous calls, HTTP/1.1, HTTP/2, WebSocket integration, and immutable request objects.

```java
import java.net.URI;
import java.net.http.HttpClient;
import java.net.http.HttpRequest;
import java.net.http.HttpResponse;

public class Example {
    public static void main(String[] args) throws Exception {
        HttpClient client = HttpClient.newHttpClient();

        HttpRequest request = HttpRequest.newBuilder()
                .uri(URI.create("https://example.com"))
                .GET()
                .build();

        HttpResponse<String> response = client.send(
                request,
                HttpResponse.BodyHandlers.ofString()
        );

        System.out.println(response.statusCode());
        System.out.println(response.body());
    }
}
```

### `var` in lambda parameters

Java 10 introduced `var` for local variables. Java 11 allowed it in explicitly typed lambda parameters, mainly so annotations can be attached consistently.

```java
import java.util.function.BiFunction;

BiFunction<String, String, String> join =
        (var first, var second) -> first + second;
```

### Java Flight Recorder

JFR became a standard production profiling and diagnostics tool.

```bash
java -XX:StartFlightRecording=filename=recording.jfr,duration=60s \
     -jar application.jar
```

---

## Java 12, March 2019

The main developer-visible change was switch expressions as a preview feature. Runtime improvements included the experimental Shenandoah garbage collector, default CDS archives and G1 memory improvements. ([OpenJDK][3])

### Switch expressions, preview

A `switch` could produce a value and use arrow-style cases, avoiding fall-through.

```java
int numberOfDays = switch (month) {
    case 2 -> 28;
    case 4, 6, 9, 11 -> 30;
    default -> 31;
};
```

In Java 12, this required preview features:

```bash
javac --enable-preview --release 12 Main.java
java --enable-preview Main
```

### Shenandoah GC, experimental

Shenandoah performs much of its garbage-collection work concurrently with application threads to reduce pause times.

```bash
java -XX:+UnlockExperimentalVMOptions \
     -XX:+UseShenandoahGC \
     -jar application.jar
```

---

## Java 13, September 2019

Java 13 introduced text blocks as a preview feature, revised switch expressions and added dynamic CDS archives. ([OpenJDK][4])

### Text blocks, preview

Text blocks simplify multiline JSON, SQL, HTML and other embedded text.

```java
String json = """
        {
          "name": "Ada",
          "role": "Engineer"
        }
        """;
```

Before text blocks:

```java
String json = "{\n" +
              "  \"name\": \"Ada\",\n" +
              "  \"role\": \"Engineer\"\n" +
              "}";
```

### `yield` in switch expressions

Java 13 replaced Java 12's `break value` syntax with `yield`.

```java
String category = switch (day) {
    case SATURDAY, SUNDAY -> "weekend";
    default -> {
        System.out.println("Working day");
        yield "weekday";
    }
};
```

### Dynamic CDS archives

Applications could create a class-data-sharing archive after a representative execution.

```bash
java -XX:ArchiveClassesAtExit=application.jsa \
     -cp application.jar com.example.Main

java -XX:SharedArchiveFile=application.jsa \
     -cp application.jar com.example.Main
```

---

## Java 14, March 2020

Java 14 introduced records and `instanceof` pattern matching as preview features. Switch expressions became final. It also added helpful null-pointer exceptions, JFR event streaming and the incubating `jpackage` tool. ([OpenJDK][5])

### Records, preview

Records provide a compact way to model immutable data carriers.

```java
record User(String id, String email) {
}

User user = new User("123", "ada@example.com");

System.out.println(user.id());
System.out.println(user.email());
```

The compiler generates:

* Final fields
* A canonical constructor
* Accessor methods
* `equals`
* `hashCode`
* `toString`

### Pattern matching for `instanceof`, preview

The type check and cast can be combined.

```java
Object value = "Hello";

if (value instanceof String text) {
    System.out.println(text.toUpperCase());
}
```

Before:

```java
if (value instanceof String) {
    String text = (String) value;
    System.out.println(text.toUpperCase());
}
```

### Helpful null-pointer exceptions

The JVM reports which expression in a chain produced `null`.

```java
String city = customer.address().city();
```

Instead of only reporting that an NPE occurred, the JVM can identify whether `customer`, `address()` or another component was null.

## Java 15, September 2020

Text blocks became final. Sealed classes were introduced as a preview feature. ZGC and Shenandoah became production garbage collectors, and hidden classes were added for frameworks that generate classes dynamically. ([OpenJDK][6])

### Text blocks, final

```java
String query = """
        SELECT id, name, email
        FROM users
        WHERE active = true
        ORDER BY name
        """;
```

### Sealed classes, preview

A sealed hierarchy restricts which classes can extend or implement a type.

```java
sealed interface Shape permits Circle, Rectangle {
}

record Circle(double radius) implements Shape {
}

final class Rectangle implements Shape {
    private final double width;
    private final double height;

    Rectangle(double width, double height) {
        this.width = width;
        this.height = height;
    }
}
```

Each permitted subtype must be declared `final`, `sealed` or `non-sealed`. Records are implicitly final.

### Production ZGC

```bash
java -XX:+UseZGC -jar application.jar
```

ZGC targets very low pause times for large heaps.

---

## Java 16, March 2021

Records and `instanceof` pattern matching became final. `jpackage` became final, Unix-domain socket channels were added, and sealed classes received a second preview. ([OpenJDK][7])

### Records, final

Records can contain validation and additional methods.

```java
import java.util.Objects;

record User(String id, String email) {
    User {
        Objects.requireNonNull(id);
        Objects.requireNonNull(email);

        if (!email.contains("@")) {
            throw new IllegalArgumentException("Invalid email");
        }
    }

    String displayName() {
        return id + " <" + email + ">";
    }
}
```

### Final `instanceof` pattern matching

Pattern variables can participate in boolean expressions.

```java
Object value = "Java";

if (value instanceof String text && !text.isBlank()) {
    System.out.println(text.toUpperCase());
}
```

### `jpackage`

`jpackage` creates platform-specific application packages containing the application and a runtime.

```bash
jpackage \
  --input build/libs \
  --main-jar application.jar \
  --main-class com.example.Main \
  --name ExampleApp
```

### Unix-domain sockets

```java
import java.net.StandardProtocolFamily;
import java.net.UnixDomainSocketAddress;
import java.nio.channels.SocketChannel;

var address = UnixDomainSocketAddress.of("/tmp/example.sock");

try (var channel = SocketChannel.open(StandardProtocolFamily.UNIX)) {
    channel.connect(address);
}
```

---

## Java 17, September 2021, LTS

Sealed classes became final. Java 17 also introduced pattern matching for `switch` as a preview, enhanced pseudo-random number generators, strong encapsulation of JDK internals, and a native macOS/AArch64 port. ([OpenJDK][8])

### Sealed classes, final

```java
sealed interface PaymentResult permits PaymentSuccess, PaymentFailure {
}

record PaymentSuccess(String transactionId)
        implements PaymentResult {
}

record PaymentFailure(String reason)
        implements PaymentResult {
}
```

### Pattern matching for switch, preview

Combined with sealed classes, pattern switches support type-safe handling of closed hierarchies.

```java
static String describe(PaymentResult result) {
    return switch (result) {
        case PaymentSuccess success ->
                "Transaction: " + success.transactionId();

        case PaymentFailure failure ->
                "Failed: " + failure.reason();
    };
}
```

Compile with preview enabled:

```bash
javac --enable-preview --release 17 Main.java
java --enable-preview Main
```

### Enhanced pseudo-random number generators

Java 17 introduced a common abstraction for different random-number algorithms.

```java
import java.util.random.RandomGenerator;

RandomGenerator random =
        RandomGenerator.of("L64X128MixRandom");

int value = random.nextInt(1, 101);
```

### Strong JDK-internal encapsulation

Access to internal APIs such as `sun.misc.*` became more restricted. Applications were expected to migrate to supported standard APIs instead of relying on JDK implementation details.

---

## Java 18, March 2022

Java 18 standardized UTF-8 as the default charset, added a simple web server, introduced Javadoc code snippets and deprecated finalization for removal. ([OpenJDK][9])

### UTF-8 by default

Standard APIs that depend on the default charset now behave consistently across operating systems and locales.

```java
import java.nio.file.Files;
import java.nio.file.Path;

Path path = Path.of("message.txt");

Files.writeString(path, "你好, Java");
String content = Files.readString(path);
```

The implicit charset is UTF-8 unless a charset is explicitly supplied.

### Simple web server

Java 18 added a small static-file web server for testing and development.

```bash
jwebserver -p 8080 -d public
```

Then open:

```text
http://localhost:8080
```

### Javadoc snippets

The `{@snippet}` tag provides better formatting and validation for code examples.

```java
/**
 * Creates an immutable user.
 *
 * {@snippet :
 * User user = new User("123", "ada@example.com");
 * System.out.println(user.email());
 * }
 */
record User(String id, String email) {
}
```

---

## Java 19, September 2022

Java 19 introduced virtual threads, record patterns, the Foreign Function and Memory API, and structured concurrency. All were preview or incubating features. ([OpenJDK Mail][10])

### Virtual threads, preview

Virtual threads allow thread-per-request programming with far more concurrent threads than traditional platform threads.

```java
import java.util.concurrent.Executors;

try (var executor =
             Executors.newVirtualThreadPerTaskExecutor()) {

    var future = executor.submit(() -> {
        Thread.sleep(100);
        return "completed";
    });

    System.out.println(future.get());
}
```

Virtual threads are most useful for workloads that spend significant time waiting for network, database or file I/O.

### Record patterns, preview

Records can be checked and deconstructed in one operation.

```java
record Point(int x, int y) {
}

Object value = new Point(10, 20);

if (value instanceof Point(int x, int y)) {
    System.out.println("x=" + x + ", y=" + y);
}
```

### Structured concurrency, incubator

Related concurrent tasks are managed as one unit.

```java
import jdk.incubator.concurrent.StructuredTaskScope;

try (var scope =
             new StructuredTaskScope.ShutdownOnFailure()) {

    var user = scope.fork(() -> loadUser());
    var orders = scope.fork(() -> loadOrders());

    scope.join();
    scope.throwIfFailed();

    return new Response(user.resultNow(), orders.resultNow());
}
```

The exact API evolved across subsequent releases.

## Java 20, March 2023

Java 20 contained seven JEPs, all in preview or incubation. These included scoped values, virtual threads, record patterns, pattern matching for `switch`, the Foreign Function and Memory API, structured concurrency and the Vector API. ([OpenJDK Mail][11])

### Scoped values, incubator

Scoped values provide an immutable alternative to many `ThreadLocal` use cases.

```java
import jdk.incubator.concurrent.ScopedValue;

static final ScopedValue<String> CURRENT_USER =
        ScopedValue.newInstance();

void handleRequest() {
    ScopedValue.where(CURRENT_USER, "alice")
            .run(() -> processRequest());
}

void processRequest() {
    System.out.println(CURRENT_USER.get());
}
```

The value is available only during the bounded operation passed to `run`.

### Continued virtual-thread preview

```java
Thread thread = Thread.startVirtualThread(() -> {
    System.out.println(
            "Running on " + Thread.currentThread()
    );
});

thread.join();
```

Java 20 was mainly a refinement release on the path toward the finalized Java 21 concurrency and pattern-matching features.

## Java 21, September 2023, LTS

Java 21 finalized virtual threads, record patterns and pattern matching for `switch`. It also introduced sequenced collections and Generational ZGC. Scoped values, structured concurrency and string templates appeared as previews. ([OpenJDK][12])

### Virtual threads, final

```java
import java.util.concurrent.Executors;
import java.util.stream.IntStream;

try (var executor =
             Executors.newVirtualThreadPerTaskExecutor()) {

    var futures = IntStream.range(0, 10_000)
            .mapToObj(id ->
                    executor.submit(() -> fetchCustomer(id)))
            .toList();

    for (var future : futures) {
        System.out.println(future.get());
    }
}
```

Virtual threads make straightforward blocking code practical for highly concurrent I/O workloads.

They do not make CPU-intensive code execute faster. CPU-bound work is still limited by available processor cores.

### Record patterns and pattern switch, final

```java
sealed interface Shape permits Circle, Rectangle {
}

record Circle(double radius) implements Shape {
}

record Rectangle(double width, double height)
        implements Shape {
}

static double area(Shape shape) {
    return switch (shape) {
        case Circle(double radius) ->
                Math.PI * radius * radius;

        case Rectangle(double width, double height) ->
                width * height;
    };
}
```

This provides concise, exhaustive handling of sealed object models.

### Sequenced collections

New collection interfaces provide consistent first, last and reversed operations.

```java
import java.util.ArrayList;
import java.util.List;
import java.util.SequencedCollection;

SequencedCollection<String> names =
        new ArrayList<>(List.of("Bob", "Carol"));

names.addFirst("Alice");
names.addLast("David");

System.out.println(names.getFirst()); // Alice
System.out.println(names.getLast());  // David
System.out.println(names.reversed());
```

### Generational ZGC

Generational ZGC divides the heap by object age, based on the observation that most objects die young.

```bash
java -XX:+UseZGC \
     -XX:+ZGenerational \
     -jar application.jar
```

### String templates, historical preview

Java 21 and 22 previewed syntax such as:

```java
String message = STR."Hello, \{name}";
```

However, string templates were not continued into Java 23. They should be treated as a historical preview, not a feature to target when upgrading applications. ([OpenJDK][12])

## Java 22, March 2024

The Foreign Function and Memory API and unnamed variables and patterns became final. Java 22 also introduced Stream Gatherers, the Class-File API and statements before `super(...)` as previews, plus support for launching multi-file source programs. ([OpenJDK][13])

### Foreign Function and Memory API, final

The FFM API provides controlled access to off-heap memory and native functions without relying directly on JNI.

```java
import java.lang.foreign.Arena;
import java.lang.foreign.MemorySegment;
import java.lang.foreign.ValueLayout;

try (Arena arena = Arena.ofConfined()) {
    MemorySegment numbers =
            arena.allocate(ValueLayout.JAVA_INT, 3);

    numbers.setAtIndex(ValueLayout.JAVA_INT, 0, 10);
    numbers.setAtIndex(ValueLayout.JAVA_INT, 1, 20);
    numbers.setAtIndex(ValueLayout.JAVA_INT, 2, 30);

    int value =
            numbers.getAtIndex(ValueLayout.JAVA_INT, 1);

    System.out.println(value); // 20
}
```

### Unnamed variables and patterns

Use `_` when a variable is deliberately ignored.

```java
try {
    processFile();
} catch (java.io.IOException _) {
    System.out.println("Unable to process file");
}
```

It can also be used in patterns:

```java
if (value instanceof Point(int x, _)) {
    System.out.println("x = " + x);
}
```

### Stream Gatherers, preview

Gatherers provide custom intermediate stream operations.

```java
import java.util.List;
import java.util.stream.Gatherers;

List<List<Integer>> windows =
        List.of(1, 2, 3, 4, 5)
                .stream()
                .gather(Gatherers.windowFixed(3))
                .toList();

System.out.println(windows);
// [[1, 2, 3], [4, 5]]
```

### Multi-file source-code programs

Given:

```text
Main.java
MessageService.java
```

You can launch the program directly:

```bash
java Main.java
```

The launcher locates and compiles referenced source files without requiring a separate `javac` command.

## Java 23, September 2024

Java 23 added Markdown documentation comments and previewed module imports, primitive patterns and flexible constructor bodies. Generational ZGC became the default ZGC mode. ([OpenJDK][14])

### Markdown documentation comments

Documentation can be written with `///` and Markdown syntax.

```java
/// Finds a customer by ID.
///
/// Returns an empty result when the customer does not exist.
///
/// @param id the customer identifier
/// @return the matching customer
Optional<Customer> findCustomer(String id) {
    // ...
}
```

### Module import declarations, preview

A module import makes public types from exported packages in a module available without individual package imports.

```java
import module java.base;

List<String> names = List.of("Alice", "Bob");
Map<String, Integer> scores = new HashMap<>();
```

Normally these would require imports from `java.util`.

### Primitive types in patterns, preview

Pattern matching began to support primitive types and value-safe primitive conversions.

```java
static String classify(long value) {
    return switch (value) {
        case byte b -> "fits in byte: " + b;
        case short s -> "fits in short: " + s;
        case int i -> "fits in int: " + i;
        default -> "requires long";
    };
}
```

### Generational ZGC by default

With Java 23, selecting ZGC selects its generational implementation.

```bash
java -XX:+UseZGC -jar application.jar
```

## Java 24, March 2025

Stream Gatherers and the Class-File API became final. Java 24 also removed virtual-thread pinning for normal synchronized operations, introduced ahead-of-time class loading and linking, and permanently disabled the Security Manager. ([OpenJDK][15])

### Stream Gatherers, final

```java
import java.util.List;
import java.util.stream.Gatherers;

List<Integer> runningTotals =
        List.of(1, 2, 3, 4)
                .stream()
                .gather(Gatherers.scan(
                        () -> 0,
                        Integer::sum
                ))
                .toList();

System.out.println(runningTotals);
// [1, 3, 6, 10]
```

Gatherers support operations that are difficult to represent with `map`, `filter` and `reduce`, such as:

* Fixed and sliding windows
* Running accumulations
* Stateful transformations
* Custom short-circuiting operations

### Class-File API, final

A standard API can now parse, generate and transform `.class` files.

```java
import java.lang.classfile.ClassFile;
import java.lang.classfile.ClassModel;
import java.nio.file.Path;

ClassModel model =
        ClassFile.of().parse(Path.of("Example.class"));

model.methods().forEach(method ->
        System.out.println(
                method.methodName().stringValue()
        )
);
```

This is useful for bytecode tools, frameworks, agents and instrumentation libraries. ([Oracle Docs][16])

### Virtual threads and `synchronized`

Before Java 24, entering certain synchronized sections could pin a virtual thread to its carrier platform thread. Java 24 changed normal monitor synchronization so code like this scales better:

```java
synchronized (lock) {
    response = blockingNetworkCall();
}
```

Existing applications can benefit without replacing every `synchronized` block with `ReentrantLock`.

## Java 25, September 2025, LTS

Java 25 finalized compact source files and instance main methods, module import declarations, flexible constructor bodies and scoped values. It also added compact object headers, AOT improvements, the Key Derivation Function API and Generational Shenandoah. ([OpenJDK][17])

### Compact source files and instance main methods

Small programs no longer require a class declaration or a static main method.

```java
void main() {
    IO.println("Hello, Java 25");
}
```

Run it directly:

```bash
java Hello.java
```

Traditional entry points remain fully supported:

```java
public static void main(String[] args) {
}
```

### Module imports, final

```java
import module java.base;

void main() {
    List<String> names =
            List.of("Alice", "Bob", "Carol");

    IO.println(names);
}
```

### Flexible constructor bodies, final

Statements may execute before `super(...)`, provided they do not access the instance being constructed.

```java
class Point {
    Point(int x, int y) {
    }
}

class PositivePoint extends Point {
    PositivePoint(int x, int y) {
        if (x < 0 || y < 0) {
            throw new IllegalArgumentException(
                    "Coordinates must be positive"
            );
        }

        super(x, y);
    }
}
```

Previously, `super(...)` had to be the first statement.

### Scoped values, final

Scoped values provide bounded, immutable context propagation.

```java
static final ScopedValue<String> CURRENT_USER =
        ScopedValue.newInstance();

void handleRequest() {
    ScopedValue.where(CURRENT_USER, "alice")
            .run(() -> authorizeAndProcess());
}

void authorizeAndProcess() {
    System.out.println(
            "User: " + CURRENT_USER.get()
    );
}
```

Compared with `ThreadLocal`, scoped values are easier to reason about with virtual threads and structured concurrency.

### Compact object headers

Compact headers reduce the per-object memory overhead in the HotSpot JVM.

```bash
java -XX:+UseCompactObjectHeaders \
     -jar application.jar
```

This can reduce heap usage for applications containing large numbers of small objects.

## Java 26, March 2026

Java 26 added HTTP/3 support to the standard HTTP Client, AOT object caching with any garbage collector and G1 throughput improvements. It removed the Applet API and introduced warnings for reflective mutation of final fields. Lazy constants and structured concurrency remain preview APIs. ([OpenJDK][18])

### HTTP/3 support

The standard HTTP Client can prefer HTTP/3 with a small configuration change.

```java
import java.net.URI;
import java.net.http.HttpClient;
import java.net.http.HttpRequest;
import java.net.http.HttpResponse;

var client = HttpClient.newBuilder()
        .version(HttpClient.Version.HTTP_3)
        .build();

var request = HttpRequest.newBuilder(
            URI.create("https://openjdk.org/")
        )
        .GET()
        .build();

var response = client.send(
        request,
        HttpResponse.BodyHandlers.ofString()
);

System.out.println(response.version());
```

HTTP/3 is opt-in. By default, the client may fall back to HTTP/2 or HTTP/1.1 when HTTP/3 is unavailable. ([Oracle Docs][19])

### Lazy constants, second preview

`LazyConstant` provides thread-safe, at-most-once, lazy initialization while allowing the JVM to treat the initialized value as a constant.

```java
import java.lang.LazyConstant;
import java.util.logging.Logger;

class OrderService {
    private final LazyConstant<Logger> logger =
            LazyConstant.of(() ->
                    Logger.getLogger(
                            OrderService.class.getName()
                    )
            );

    void submitOrder() {
        logger.get().info("Submitting order");
    }
}
```

The logger is created only when `get()` is called for the first time. Subsequent calls return the same value. Preview features must be enabled. ([Oracle Docs][20])

```bash
javac --enable-preview --release 26 Main.java
java --enable-preview Main
```

### Final-field mutation warnings

Java 26 warns when deep reflection is used to mutate `final` fields.

```java
Field field = Config.class.getDeclaredField("value");
field.setAccessible(true);
field.set(config, "modified"); // Warning in Java 26
```

This prepares applications for a future release where such mutation may be rejected by default. Frameworks that depend on deep reflection should review serialization, dependency-injection and proxy-generation behavior. ([OpenJDK][21])

### Applet API removal

The obsolete Applet API was removed after being deprecated for removal since Java 17. Applications still referencing `java.applet` must remove or replace that code. ([OpenJDK][18])

## Most important progression for interviews

For a Java 17 to Java 21 interview, concentrate on:

1. **Records**, final since Java 16.
2. **Pattern matching for `instanceof`**, final since Java 16.
3. **Sealed classes**, final in Java 17.
4. **Pattern matching for `switch`**, final in Java 21.
5. **Record patterns**, final in Java 21.
6. **Virtual threads**, final in Java 21.
7. **Sequenced collections**, added in Java 21.
8. **Generational ZGC**, added in Java 21.
9. **Strong encapsulation of JDK internals**, important when migrating to Java 17.
10. **Preview-feature awareness**, especially knowing that preview syntax can change or disappear.
