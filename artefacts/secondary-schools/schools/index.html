.37695],[103.86033,1.37691],[103.86022,1.37687],[103.85997,1.37677],[103.85986,1.37673],[103.85983,1.37672],[103.85977,1.37671],[103.85969,1.37668],[103.85958,1.37665],[103.85949,1.3766],[103.8594,1.37653],[103.85937,1.3765],[103.85934,1.37653],[103.85931,1.37651],[103.85927,1.37647],[103.85924,1.37649],[103.85922,1.37651],[103.85918,1.37651],[103.85907,1.37649],[103.85906,1.37649],[103.85899,1.37647],[103.85895,1.37646],[103.85881,1.37641],[103.85854,1.3763],[103.8584,1.37627],[103.85825,1.37626],[103.85821,1.37624],[103.85815,1.37622],[103.85807,1.3762],[103.85805,1.37617],[103.858,1.37615],[103.85797,1.37614],[103.85795,1.3761],[103.85792,1.37606],[103.85791,1.37607],[103.85785,1.37608],[103.85779,1.3761],[103.85771,1.37611],[103.85765,1.37611],[103.85756,1.37609],[103.85732,1.37604],[103.85697,1.37594],[103.85627,1.37572],[103.85607,1.37568],[103.85599,1.37567],[103.85589,1.37566],[103.85522,1.37567],[103.85485,1.37567],[103.85473,1.37568],[103.85466,1.37568],[103.8546,1.37568],[103.85398,1.37574],[103.85327,1.37583],[103.85263,1.3759],[103.85257,1.37591],[103.85253,1.37591],[103.851,1.37607],[103.85097,1.37574],[103.85095,1.37525],[103.85094,1.37498],[103.85092,1.37478],[103.85102,1.37477],[103.85098,1.37408],[103.85099,1.37406],[103.85178,1.37398],[103.85179,1.37398],[103.8518,1.37401],[103.85182,1.37433]],"chip":"","cop":{"2024":{"PG3":"4 - 10","PG2":"21 - 22","PG1":"25 - 28","note":null},"2025":{"PG3":"5 - 10","PG2":"21 - 23","PG1":"25 - 26","note":null},"2026":{"PG3":"7 - 11","PG2":"21 - 23","PG1":"25 - 28","note":null}}}]};
const HOME = [1.405685, 103.899221];
const YEARS = DATA.years.map(String);
let sortKey = 'pt', pg = 'PG3', current = null;

const band = m => m <= 15 ? 't1' : m <= 30 ? 't2' : m <= 45 ? 't3' : 't4';
const title = s => s.replace(/\w\S*/g, w => w[0] + w.slice(1).toLowerCase()).replace(/\bChij\b/, 'CHIJ').replace(/\(Secondary\)/, '(Sec)');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cop = (s, y, g) => s.cop?.[y]?.[g]?.replace(/ - /g, '–') ?? '–';

function copTable(s, groups) {
  const notes = YEARS.map(y => s.cop?.[y]?.note && `${y}: ${s.cop[y].note}`).filter(Boolean);
  return `<table><thead><tr><th scope="col"></th>${YEARS.map(y => `<th scope="col">${y}</th>`).join('')}</tr></thead><tbody>${
    groups.map(g => `<tr><th scope="row">${g}</th>${YEARS.map(y => `<td>${esc(cop(s, y, g))}</td>`).join('')}</tr>`).join('')
  }</tbody></table>${notes.length ? `<div class="note">${esc(notes.join(' · ').replace(/ - /g, '–'))}</div>` : ''}`;
}

// map
const map = L.map('map', { zoomControl: true }).setView(HOME, 13);
const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light';
L.tileLayer(`https://www.onemap.gov.sg/maps/tiles/${dark ? 'Night' : 'Grey'}/{z}/{x}/{y}.png`, {
  attribution: '<a href="https://www.onemap.gov.sg/">OneMap</a> &copy; Singapore Land Authority', minZoom: 11, maxZoom: 19,
}).addTo(map);
L.marker(HOME, { icon: L.divIcon({ className: '', html: '<div class="home" aria-label="Home">⌂</div>', iconSize: [34, 34], iconAnchor: [17, 17] }), zIndexOffset: 1000, keyboard: false })
  .addTo(map).bindTooltip('Home · 64 Punggol Walk');
// solid line with a casing: OneMap already draws future MRT lines dashed
const css = getComputedStyle(document.documentElement);
const casing = L.polyline([], { color: css.getPropertyValue('--panel').trim(), weight: 8, opacity: 0.9 }).addTo(map);
const route = L.polyline([], { color: css.getPropertyValue('--ink').trim(), weight: 4, opacity: 0.9, lineCap: 'round' }).addTo(map);

const markers = new Map();
for (const s of DATA.schools) {
  const m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '', iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map);
  m.bindPopup(() => `<b>${esc(title(s.name))}</b>
    <div class="meta">${s.pt} min ${esc(s.via)} · ${s.walk} min walk (${s.walkKm} km)</div>
    <div style="margin-top:8px">${copTable(s, ['PG3', 'PG2', 'PG1'])}</div>`);
  m.on('click', () => select(s.name, false));
  markers.set(s.name, m);
}
map.fitBounds(L.latLngBounds([HOME, ...DATA.schools.filter(s => s.pt <= 45).map(s => [s.lat, s.lng])]), { padding: [30, 30] });

function select(name, fly = true) {
  current = name;
  const s = DATA.schools.find(x => x.name === name);
  const path = s.walkGeo.map(([lng, lat]) => [lat, lng]);
  casing.setLatLngs(path); route.setLatLngs(path);
  if (fly) { map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), { duration: 0.5 }); markers.get(name).openPopup(); }
  render();
}

function render() {
  const list = [...DATA.schools].sort((a, b) => a[sortKey] - b[sortKey] || a.walk - b.walk);
  document.getElementById('list').innerHTML = list.map((s, i) => {
    const t = s[sortKey];
    markers.get(s.name).setIcon(L.divIcon({ className: '', html: `<div class="pin${s.name === current ? ' on' : ''}" style="--c:var(--${band(t)})">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }));
    return `<li ${s.name === current ? 'aria-current="true"' : ''}><button type="button" data-name="${esc(s.name)}">
      <span class="rank" style="--c:var(--${band(t)})">${i + 1}</span>
      <span><span class="name">${esc(title(s.name))}</span>${s.chip ? `<span class="chip">${esc(s.chip)}</span>` : ''}
        <span class="meta" style="display:block">${sortKey === 'pt' ? `${esc(s.via)} · ${s.walk} min walk` : `${s.walkKm} km · ${s.pt} min by transit`}</span></span>
      <span class="time">${t}<small>min</small></span>
      <span class="cop">${copTable(s, [pg])}</span>
    </button></li>`;
  }).join('');
}

document.getElementById('list').addEventListener('click', e => { const b = e.target.closest('button[data-name]'); if (b) select(b.dataset.name); });
for (const b of document.querySelectorAll('[data-sort],[data-pg]')) b.addEventListener('click', () => {
  const k = b.dataset.sort ? 'sort' : 'pg';
  document.querySelectorAll(`[data-${k}]`).forEach(x => x.setAttribute('aria-pressed', x === b));
  if (b.dataset.sort) sortKey = b.dataset.sort; else pg = b.dataset.pg;
  render();
});
document.getElementById('foot').innerHTML = `Transit: Google Maps, departing Tue 6 Oct 2026 06:45 (best of offered routes; walking used when faster). Walking: OSRM foot routing on OpenStreetMap. COP: ${esc(DATA.copSource)}. Data collected ${esc(DATA.collected)}; check MOE SchoolFinder before deciding.`;
render();
</script>
