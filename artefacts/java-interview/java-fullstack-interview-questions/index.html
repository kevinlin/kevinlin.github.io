# Technical Interview: Consolidated Questions and Sample Answers

## Priority Areas

Based on the interview notes, I would prioritize these topics:

1. AI-assisted engineering quality and repeatability
2. Java 17 to 21, especially virtual threads and records
3. Spring IoC, lifecycle, and transaction propagation
4. JPA/Hibernate versus JDBC
5. React and Redux fundamentals
6. Kubernetes service communication, scaling, and troubleshooting
7. Kafka messaging and backward compatibility
8. REST versus gRPC
9. High-volume and batch-processing architecture

---

# 1. AI Skills and Engineering Quality

## Q1. We have a Skill that updates repositories. How do you make sure it works across different repos?

**Sample answer:**

I would treat the Skill like a software product rather than only a prompt.

Different repositories have different:

- Languages and framework versions
- Build systems
- Directory structures
- Coding conventions
- Test frameworks
- Dependency-management tools
- CI pipelines

So I would separate the Skill into roughly three stages:

```text
Discover → Change → Verify
```

First, **Discover** the repository deterministically:

- Detect language and framework versions
- Identify Maven, Gradle, npm, pnpm, etc.
- Read repository-specific instructions
- Identify build, test and lint commands
- Detect dependency constraints

Second, **Change** using the appropriate strategy for that repository.

Third, **Verify** using the repository's own engineering controls:

```text
compile
→ lint
→ static analysis
→ unit tests
→ integration tests
→ dependency/security scan
→ inspect diff
```

I would also maintain a set of representative test repositories, effectively an evaluation suite for the Skill.

Every Skill change should run against those repositories before release.

The key principle is:

> Don't test whether the LLM produced a convincing answer. Test whether the resulting repository still builds and satisfies its engineering contracts.

---

## Q2. Our vulnerability Skill gives different results every time we run it. How would you fix that?

**Sample answer:**

I would first identify where the nondeterminism comes from.

Possible sources include:

- Different model versions
- Temperature or sampling
- Different files entering the context
- Files discovered in different order
- Search results changing
- Tool versions changing
- Dependencies being resolved differently
- Prompt ambiguity
- The LLM itself being used for deterministic analysis

I would reduce the amount of work delegated to the LLM.

For vulnerability discovery, established deterministic tools should do as much as possible:

```text
Repository
    ↓
SAST / SCA / secret scanner / dependency scanner
    ↓
Structured findings
    ↓
LLM reasoning and triage
    ↓
Validated findings
```

For example, the Skill could orchestrate Semgrep, CodeQL, dependency scanners and repository inspection. The LLM can then correlate and explain findings.

I would also pin:

- Skill version
- Model version where possible
- Tool versions
- Dependency versions
- Prompt/instructions
- Repository commit SHA

And make file discovery deterministic by sorting paths and explicitly defining inclusion and exclusion rules.

Finally, I would create a **golden evaluation set**:

```text
Repo A → expected vulnerabilities
Repo B → expected vulnerabilities
Repo C → expected no-findings
```

Then measure precision, recall and run-to-run variance.

For a security Skill, reproducibility should be a measurable quality attribute.

---

## Q3. How do you prevent “vibe-coded AI slop”?

**Sample answer:**

I would not rely on code review alone, and I would not rely only on linters.

The solution is to constrain AI-generated code with the same engineering controls we apply to human-written code.

My quality pipeline would include:

```text
Requirements / acceptance criteria
        ↓
AI implementation
        ↓
Compiler / type checker
        ↓
Formatter + linter
        ↓
Static analysis
        ↓
Unit tests
        ↓
Integration / contract tests
        ↓
Security scanning
        ↓
Human diff review
        ↓
CI quality gates
```

I would also give the agent repository-specific instructions about:

- Architecture boundaries
- Preferred libraries
- Error-handling conventions
- Security requirements
- Testing requirements
- Naming conventions
- Patterns to avoid

And I prefer small, reviewable changes.

For example, instead of:

> Refactor the payment subsystem.

I would give it a scoped task with explicit acceptance criteria and require it to run the existing tests.

The principle is:

> AI can generate code quickly, but correctness must come from deterministic engineering feedback loops.

---

## Q4. Engineers use an LLM to fix bugs they could easily solve themselves. Is that a problem?

**Sample answer:**

Not necessarily.

I don't measure AI adoption by how frequently developers use an LLM. I measure whether it improves engineering outcomes.

For a simple bug, asking an LLM may actually take longer than fixing it directly.

I encourage engineers to decide based on the task.

AI is particularly useful for:

- Exploring an unfamiliar codebase
- Finding dependencies
- Generating repetitive changes
- Generating tests
- Large-scale refactoring
- Comparing implementation options
- Documentation
- Root-cause hypothesis generation

But engineers still need to understand the code.

One risk is becoming dependent on AI without developing engineering judgment. I want AI to amplify engineering capability, not replace understanding.

---

## Q5. You use an AI Skill to upgrade old libraries, but results differ across repos. How would you improve it?

**Sample answer:**

I would make the Skill repository-aware rather than assuming every upgrade is the same.

For each repository I would first build a profile:

```text
Java version
Spring Boot version
Build tool
Dependency tree
Test framework
Plugins
Current library version
Target library version
Known breaking changes
```

Then generate a migration plan before modifying code.

For example:

```text
Analyze
  ↓
Determine required upgrade path
  ↓
Update dependency
  ↓
Compile
  ↓
Fix compile errors
  ↓
Run tests
  ↓
Run static analysis
  ↓
Inspect API migrations
  ↓
Generate change report
```

For major upgrades, I would use official migration tools and codemods where available before asking the LLM to modify code manually.

And I would create regression fixtures covering different repository archetypes.

---

## Q6. How would you use AI to migrate MongoDB to Oracle?

**Sample answer:**

I would use AI to accelerate analysis and implementation, but not let an LLM independently move production data.

First I would profile the MongoDB data:

- Collections
- Document shapes
- Optional fields
- Nested objects
- Arrays
- Relationships
- Data volumes
- Indexes
- Query patterns

Then define the target relational model explicitly.

For example:

```text
Mongo document
    ↓
Schema inference
    ↓
Relational model
    ↓
Mapping specification
    ↓
Transformation code
    ↓
Migration
    ↓
Reconciliation
```

AI can help with:

- Analysing document structures
- Proposing normalized schemas
- Generating Oracle DDL
- Generating transformation code
- Generating migration scripts
- Generating data-quality tests
- Analysing incompatible query patterns
- Producing reconciliation reports

But I would use deterministic validation for the actual migration:

```text
source count == target count
financial totals match
mandatory fields match
referential integrity passes
sample records match
checksums where appropriate
```

For a live migration I would consider:

1. Initial bulk migration
2. CDC or incremental synchronization
3. Reconciliation
4. Controlled cutover
5. Rollback plan
6. Post-cutover validation

AI assists the engineers. It should not be the source of truth for data correctness.

# 2. React and Redux

## Q7. Explain React.

**Sample answer:**

React is a library for building user interfaces from reusable components.

A component receives data through props, maintains local state where necessary, and declares what the UI should look like.

When state changes, React re-renders the relevant component tree and reconciles the result with the DOM.

Important concepts include:

- Components
- Props
- State
- Hooks
- One-way data flow
- Component composition
- Effects
- Context
- Reconciliation

For example:

```tsx
function Counter() {
  const [count, setCount] = useState(0);

  return (
    <button onClick={() => setCount(c => c + 1)}>
      {count}
    </button>
  );
}
```

I normally keep state as close as possible to where it is used and only move it into shared state when multiple components genuinely require it.

---

## Q8. What is a controlled versus uncontrolled component in React?

This is almost certainly what the interview notes mean by “bound and unbound control”.

**Sample answer:**

A **controlled component** has its state controlled by React.

For example:

```tsx
function NameInput() {
  const [name, setName] = useState("");

  return (
    <input
      value={name}
      onChange={e => setName(e.target.value)}
    />
  );
}
```

React state is the source of truth.

An **uncontrolled component** stores the current value in the DOM:

```tsx
function NameInput() {
  const inputRef = useRef<HTMLInputElement>(null);

  return <input ref={inputRef} />;
}
```

Then I can access it using:

```tsx
inputRef.current?.value
```

### Controlled

Useful when I need:

- Validation
- Dynamic UI behaviour
- Immediate state synchronization
- Form logic depending on the value

### Uncontrolled

Useful when:

- The input is simple
- I only need the value on submission
- Integrating with DOM-oriented libraries
- Managing file inputs

For most business forms, I generally prefer controlled inputs or a form library that efficiently manages the same concerns.

---

## Q9. What is ReactJS versus React Native?

If this was what Eko meant by the unclear “ReactEx” question:

**Sample answer:**

ReactJS and React Native share the React programming model:

- Components
- Props
- State
- Hooks
- Context

But the rendering targets are different.

ReactJS normally renders to the browser DOM:

```tsx
<div>
<button>
<input>
```

React Native renders native platform components:

```tsx
<View>
<Text>
<Pressable>
```

React Native does not simply render HTML inside a mobile application. React coordinates native UI components on iOS and Android.

Business logic and some hooks can often be shared, but UI components and platform APIs frequently differ.

---

## Q10. What is React versus JSX?

If this is what the interviewer meant:

**Sample answer:**

React is the UI library.

JSX is syntax commonly used to describe React elements:

```tsx
const element = <button>Save</button>;
```

Conceptually, JSX is transformed into JavaScript that creates React elements.

You can technically use React without JSX, but JSX makes component trees much easier to read and maintain.

---

## Q11. Explain Redux.

**Sample answer:**

Redux manages shared application state using predictable one-way data flow.

The main concepts are:

- Store
- State
- Action
- Reducer
- Dispatch
- Selector
- Middleware

The flow is:

```text
UI
 ↓
dispatch(action)
 ↓
reducer
 ↓
new state
 ↓
UI re-renders
```

With modern Redux, I would use Redux Toolkit rather than manually creating large numbers of action constants and reducers.

For example:

```tsx
const counterSlice = createSlice({
  name: "counter",
  initialState: { value: 0 },
  reducers: {
    increment: state => {
      state.value++;
    }
  }
});
```

I would use Redux for genuinely shared application state, rather than putting every local UI state into the store.

# 3. Java 17 to 21

## Q12. What are virtual threads?

**Sample answer:**

Virtual threads were introduced as a production feature in Java 21.

Traditional Java platform threads are relatively expensive because they are closely associated with OS threads.

Virtual threads are lightweight JVM-managed threads.

Instead of:

```text
1 request
   ↓
1 heavyweight OS-backed thread
```

we can have very large numbers of lightweight virtual threads multiplexed over a smaller set of carrier threads.

They are particularly useful for I/O-bound applications that spend time waiting on:

- Database calls
- HTTP APIs
- Files
- Messaging
- Other network I/O

They allow us to continue writing straightforward blocking code rather than necessarily moving to a reactive programming model.

---

## Q13. How are virtual threads different from regular threads?

**Sample answer:**

The programming interface looks very similar because both are Java `Thread`s.

The major difference is implementation and cost.

### Platform thread

```text
Java Thread
     ↓
OS Thread
```

Relatively expensive and therefore commonly pooled.

### Virtual thread

```text
Many Virtual Threads
        ↓
JVM scheduler
        ↓
Few carrier/platform threads
        ↓
OS threads
```

A virtual thread can be parked when it performs supported blocking I/O, allowing the carrier thread to run something else.

But virtual threads do not provide additional CPU capacity.

If I have eight CPU cores and CPU-intensive work, creating 100,000 virtual threads will not make the computation faster.

They primarily improve scalability for blocking I/O workloads.

---

## Q14. How are virtual threads similar to Go goroutines?

**Sample answer:**

The mental model is similar.

Both allow large numbers of lightweight concurrent tasks and let the runtime schedule them onto a smaller number of operating-system threads.

That makes the concept familiar to someone who has worked with Go.

However, they are not identical.

Go encourages goroutines together with channels and `select`.

Java virtual threads deliberately preserve Java's normal thread and blocking programming model.

So existing Java developers can use constructs such as:

```java
Thread.startVirtualThread(() -> processRequest());
```

without rewriting the entire application around asynchronous callbacks.

---

## Q15. Would virtual threads solve a service receiving thousands of concurrent requests?

**Sample answer:**

They may help if the application is primarily I/O-bound, but they are only one part of the solution.

For example:

```text
4,000 virtual threads
        ↓
Database pool: 50 connections
```

The database still only handles roughly 50 concurrent database operations.

So I would also examine:

- Database connection pool
- HTTP connection pool
- Downstream service limits
- Rate limiting
- Backpressure
- CPU
- Memory
- Database query performance

Virtual threads can remove the application thread pool as a bottleneck. They cannot remove bottlenecks downstream.

---

## Q16. What is a Java record?

**Sample answer:**

A record is a concise way to represent an immutable data carrier.

Instead of writing:

```java
public class CustomerDto {
    private final String id;
    private final String name;

    // constructor
    // getters
    // equals
    // hashCode
    // toString
}
```

I can write:

```java
public record CustomerDto(
    String id,
    String name
) {}
```

Java automatically provides:

- Constructor
- Accessors
- `equals`
- `hashCode`
- `toString`

Records are particularly good for:

- DTOs
- API models
- Events
- Query results
- Value objects

I would generally not use records directly as traditional mutable JPA entities because the persistence model has different requirements.

# 4. JPA, Hibernate and JDBC

## Q17. What is the difference between JPA, Hibernate and JDBC?

**Sample answer:**

They operate at different abstraction levels.

### JDBC

Low-level Java API for interacting directly with relational databases.

I control:

```text
SQL
parameters
ResultSet mapping
connections
statements
```

### JPA

A Java persistence specification defining concepts such as:

- Entity
- EntityManager
- Persistence context
- Relationships
- Transactions

### Hibernate

A popular implementation of JPA that also provides additional features.

So:

```text
Application
    ↓
JPA API
    ↓
Hibernate
    ↓
JDBC
    ↓
Database
```

---

## Q18. When would you use JPA/Hibernate versus JDBC?

**Sample answer:**

I would use **JPA/Hibernate** when:

- The application has a rich relational domain model
- CRUD is a large part of the workload
- Entity relationships are useful
- Developer productivity matters
- Dirty checking and persistence context help
- Queries are relatively conventional

I would consider **JDBC or JdbcTemplate** when:

- I need very precise SQL control
- I have complex analytical queries
- I am processing large volumes
- I need high-performance bulk inserts or updates
- Object graph mapping adds little value
- Predictable database behaviour is more important than ORM convenience

I don't see this as an either/or decision.

A Spring Boot service can use JPA for normal domain persistence and JDBC for a performance-sensitive batch operation.

---

## Q19. Why can Hibernate become problematic at high data volumes?

**Sample answer:**

Hibernate manages entities inside a persistence context.

If I load hundreds of thousands of records into one transaction, Hibernate may keep many managed objects in memory.

That can lead to:

- High heap usage
- Dirty-checking overhead
- Long transactions
- Large flush operations
- GC pressure

For bulk processing I might instead use:

- Pagination
- Streaming
- JDBC batching
- `flush()` and `clear()`
- Stateless Hibernate sessions
- Native SQL
- Spring Batch

The choice depends on workload.

---

## Q20. How would you design a one-to-many relationship?

Consider:

```text
Customer 1 → N Orders
```

**Sample answer:**

At the database level, I would normally place the foreign key on the many side:

```text
orders.customer_id
```

In JPA:

```java
@Entity
class Order {

    @ManyToOne(fetch = FetchType.LAZY)
    @JoinColumn(name = "customer_id")
    private Customer customer;
}
```

And if I genuinely need bidirectional navigation:

```java
@Entity
class Customer {

    @OneToMany(mappedBy = "customer")
    private List<Order> orders;
}
```

The `Order` side owns the relationship because it contains the foreign key.

I would normally prefer lazy loading and query based on the use case rather than automatically retrieving the entire object graph.

---

## Q21. How would you fetch one-to-many data without creating an N+1 problem?

**Sample answer:**

Suppose I fetch 100 customers and then access their orders.

A naive implementation could generate:

```text
1 query for customers
+
100 queries for orders
=
101 queries
```

I would first identify what the API actually needs.

Options include:

- Fetch join
- EntityGraph
- DTO projection
- Batch fetching
- Explicit query
- Separate batched queries

For an API response, I often prefer a DTO projection tailored to the endpoint rather than returning persistence entities directly.

I also need to be careful with pagination. Fetch-joining large collections can produce huge Cartesian result sets and make pagination difficult.

# 5. Spring Transactions

## Q22. What is a transaction?

**Sample answer:**

A database transaction groups operations into one logical unit of work.

The classic properties are ACID:

- Atomicity
- Consistency
- Isolation
- Durability

For example, transferring money might require:

```text
debit Account A
credit Account B
write transaction record
```

Either all operations commit or the transaction should roll back.

---

## Q23. How does `@Transactional` work in Spring?

**Sample answer:**

Spring normally implements declarative transactions through an AOP proxy.

For example:

```java
@Service
public class PaymentService {

    @Transactional
    public void processPayment() {
        ...
    }
}
```

Conceptually:

```text
Caller
  ↓
Spring transaction proxy
  ↓
Begin transaction
  ↓
processPayment()
  ↓
Commit / rollback
```

By default, `@Transactional` uses `Propagation.REQUIRED`.

One important detail is that Spring's normal proxy-based transaction handling intercepts **external calls through the proxy**. Self-invocation within the same object does not trigger another transactional interceptor.

---

## Q24. What is transaction propagation?

**Sample answer:**

Propagation determines what happens when a transactional method calls another method while a transaction already exists.

The important modes are:

| Propagation | Behaviour |
|---|---|
| `REQUIRED` | Join existing transaction, otherwise create one |
| `REQUIRES_NEW` | Suspend existing transaction and create another |
| `NESTED` | Use a nested transaction/savepoint where supported |
| `SUPPORTS` | Join if one exists, otherwise run without one |
| `MANDATORY` | Require an existing transaction |
| `NOT_SUPPORTED` | Suspend transaction and run without one |
| `NEVER` | Fail if a transaction exists |

`REQUIRED` is the default. `REQUIRES_NEW` creates an independent transaction and suspends the outer one.

---

## Q25. Is putting `@Transactional` on the top-level method sufficient?

**Sample answer:**

Often, yes, if all called database operations are supposed to participate in the same transaction.

For example:

```java
@Transactional
public void placeOrder() {
    reserveInventory();
    saveOrder();
    createPayment();
}
```

All database work on the same transaction manager can participate in that transaction.

But there are important exceptions.

If an inner method requires:

- `REQUIRES_NEW`
- Different isolation
- Different transaction manager
- A separate rollback boundary

then the inner transaction configuration needs to be applied correctly.

There is also the Spring proxy issue.

For example:

```java
public void outer() {
    inner();
}

@Transactional(propagation = REQUIRES_NEW)
public void inner() {
}
```

If `outer()` and `inner()` are methods of the same object, `inner()` is called directly rather than through the Spring proxy. Therefore the `REQUIRES_NEW` behaviour may not be applied.

A common solution is to move the inner operation into a separate Spring service.

---

## Q26. What happens with `REQUIRED`?

**Sample answer:**

Consider:

```java
@Transactional
public void createOrder() {
    paymentService.reservePayment();
}
```

and:

```java
@Transactional
public void reservePayment() {
}
```

Since `REQUIRED` is the default:

```text
createOrder transaction
        ↓
reservePayment joins same transaction
```

If an unchecked exception causes the transaction to roll back:

```text
Order changes      rollback
Payment changes    rollback
```

They are part of the same physical transaction.

---

## Q27. What happens with `REQUIRES_NEW`?

**Sample answer:**

Consider:

```java
@Transactional
public void createOrder() {
    auditService.writeAudit();
    throw new RuntimeException();
}
```

and:

```java
@Transactional(propagation = Propagation.REQUIRES_NEW)
public void writeAudit() {
    ...
}
```

Assuming `auditService` is another proxied Spring bean:

```text
Outer transaction starts
        ↓
Outer transaction suspended
        ↓
New audit transaction starts
        ↓
Audit transaction commits
        ↓
Outer transaction resumes
        ↓
Outer transaction fails
        ↓
Outer transaction rolls back
```

The audit record remains committed because it used an independent transaction.

This can be useful for:

- Audit records
- Independent status updates
- Failure logging

But I use it carefully because it changes atomicity.

---

## Q28. If `REQUIRES_NEW` fails, does the outer transaction also roll back?

**Sample answer:**

Not automatically because they are separate transactions.

The inner transaction rolls back independently.

But if its exception propagates back into the outer transactional method, Spring will normally mark the outer transaction for rollback as well.

For example:

```text
Inner REQUIRES_NEW
    ↓
exception
    ↓
inner rollback
    ↓
exception propagates
    ↓
outer rollback
```

If the outer method intentionally catches and handles the exception:

```java
try {
    auditService.writeAudit();
} catch (Exception e) {
    // handle it
}
```

then the outer transaction can potentially continue and commit.

The exact desired behaviour should be intentional.

---

## Q29. Is there any resource issue with `REQUIRES_NEW`?

**Sample answer:**

Yes.

The outer transaction may continue holding a database connection while the inner `REQUIRES_NEW` transaction needs another one.

Under heavy concurrency this can exhaust the connection pool.

For example:

```text
100 concurrent outer transactions
100 DB connections already held

Each calls REQUIRES_NEW
        ↓
Needs another 100 connections
```

So transaction propagation has performance and capacity implications, not just code-level semantics.

# 6. Spring Lifecycle

## Q30. Explain the lifecycle of a Spring bean.

**Sample answer:**

At a simplified level:

```text
Instantiate bean
    ↓
Inject dependencies
    ↓
Aware callbacks
    ↓
BeanPostProcessor before initialization
    ↓
@PostConstruct
    ↓
Initialization callbacks
    ↓
BeanPostProcessor after initialization
    ↓
Bean ready
    ↓
Application runs
    ↓
@PreDestroy
```

Bean post-processors are important because many Spring capabilities are implemented around this lifecycle, including proxy creation.

---

## Q31. Explain the Spring Boot application lifecycle.

**Sample answer:**

At a higher application level:

```text
SpringApplication.run()
       ↓
Prepare environment
       ↓
Create ApplicationContext
       ↓
Load bean definitions
       ↓
Instantiate singleton beans
       ↓
Dependency injection
       ↓
Bean initialization
       ↓
Start embedded server
       ↓
ApplicationRunner /
CommandLineRunner
       ↓
ApplicationReadyEvent
```

During shutdown:

```text
ApplicationContext closes
       ↓
@PreDestroy / destroy callbacks
       ↓
Resources released
```

I distinguish this application lifecycle from the lifecycle of an individual Spring bean.

# 7. High-Concurrency Service Design

## Q32. A service needs to handle 2,000 to 3,000 requests in parallel. How would you design it?

**Sample answer:**

The first thing I would clarify is whether that means:

- 2,000 to 3,000 requests per hour
- Per second
- Or genuinely 2,000 to 3,000 concurrent requests

Those are completely different workloads.

If the requirement is **thousands of concurrent requests**, I would first determine where time is spent.

```text
Client
 ↓
Ingress / gateway
 ↓
Service
 ↓
Database / downstream APIs
```

Then address each layer.

### Application

If the application is stateless:

- Run multiple replicas
- Use Kubernetes HPA
- Use appropriate concurrency
- Consider Java virtual threads for blocking I/O workloads
- Configure connection pools
- Set timeouts
- Add backpressure

### Database

Analyse:

- Query plans
- Indexes
- Connection-pool size
- Lock contention
- Read replicas where appropriate
- Caching

### Downstream systems

Protect them with:

- Circuit breakers
- Rate limiting
- Bulkheads
- Timeouts

### Asynchronous work

If the caller doesn't require an immediate result:

```text
API
 ↓
Kafka / queue
 ↓
workers
```

This absorbs traffic spikes.

And I would load test the complete system.

Scaling a single bottleneck does not automatically scale the system.

---

## Q33. The service currently has only one Kubernetes pod. What would you do?

**Sample answer:**

If the application is stateless, horizontal scaling is the obvious starting point:

```text
             ┌ Pod 1
Service ─────┼ Pod 2
             ├ Pod 3
             └ Pod 4
```

I would use:

- Deployment with multiple replicas
- ClusterIP Service
- HPA
- Appropriate requests and limits

If the application requires sticky sessions, I would first ask why.

Ideally I would externalize session state into something such as:

- Redis
- Database
- Signed client token

Then any pod can handle any request.

Stateless services are much easier to scale and recover.

---

## Q34. The interviewer says the endpoint is called 2,000 times per hour. Is that high traffic?

**Sample answer:**

Not by itself.

2,000 requests per hour is only around:

```text
0.56 requests/second
```

on average.

So I would clarify whether they mean average requests, peak requests, concurrency, or transactions performed per request.

For example:

```text
2,000 requests/hour
```

is very different from:

```text
2,000 concurrent requests
```

or:

```text
2,000 requests/second
```

I would avoid proposing Kubernetes scaling before understanding the workload.

---

## Q35. I have an endpoint that executes 4,000 database transactions. How would you build it in Java?

**Sample answer:**

I would first challenge whether the HTTP request really needs to execute all 4,000 transactions synchronously.

If not, I would consider:

```text
POST /jobs
    ↓
Create job
    ↓
Kafka / queue
    ↓
Workers
    ↓
Process batches
    ↓
GET /jobs/{id}
```

This gives:

- Retry
- Backpressure
- Progress tracking
- Horizontal scaling
- Failure isolation

If all 4,000 operations must be processed, I would also look for opportunities to batch them rather than perform 4,000 individual database round trips.

For example:

```text
4000 individual INSERTs
```

versus JDBC batching:

```text
batch 100
batch 100
...
```

I would use bounded concurrency.

I would **not** simply create 4,000 virtual threads and fire them at the database because the database connection pool and database itself are bounded resources.

# 8. Weekly Processing Within 90 Minutes

## Q36. We have a large data volume that must be processed weekly within 90 minutes, and the data changes daily. How would you design it?

**Sample answer:**

The first question I would ask is:

> Why reprocess everything weekly if only part of the data changed?

I would try to move from full processing to incremental processing.

For example:

```text
Daily changes
    ↓
CDC / watermark / modified timestamp
    ↓
Incremental staging
    ↓
Weekly processing only handles delta
```

Then I would:

- Partition the data
- Process partitions in parallel
- Batch database operations
- Make processing idempotent
- Introduce checkpoints
- Allow failed partitions to retry
- Avoid one huge transaction
- Measure throughput

Suppose I know:

```text
records = N
deadline = 90 minutes
```

I can calculate the required sustained throughput:

```text
required throughput =
N / 5400 seconds
```

Then load test against that target with headroom.

For example, I might target completion within 60 to 70 minutes operationally rather than designing exactly to the 90-minute deadline.

If the data changes daily, preprocessing the delta daily may also substantially reduce the weekly peak.

# 9. REST versus gRPC

## Q37. What is the difference between REST and gRPC?

**Sample answer:**

REST typically exposes resources over HTTP using formats such as JSON.

For example:

```http
GET /customers/123
```

gRPC defines services and messages using Protocol Buffers:

```proto
service CustomerService {
  rpc GetCustomer(GetCustomerRequest)
      returns (CustomerResponse);
}
```

The main differences are:

| | REST | gRPC |
|---|---|---|
| Typical format | JSON | Protocol Buffers |
| Contract | OpenAPI optional/common | `.proto` required |
| Transport | HTTP | Usually HTTP/2 |
| Payload | Human-readable | Binary |
| Streaming | Less natural | Built in |
| Browser use | Very easy | More constraints |
| Internal services | Good | Very good |
| Public APIs | Very common | Less common |

---

## Q38. When would you choose gRPC?

**Sample answer:**

I would consider gRPC for:

- Internal service-to-service communication
- Low-latency APIs
- High call volumes
- Strong typed contracts
- Polyglot microservices
- Streaming
- Efficient binary payloads

For example:

```text
Java Service
      ↓ gRPC
Go Service
      ↓
Python Service
```

All clients can be generated from the same `.proto` definition.

---

## Q39. When would you choose REST?

**Sample answer:**

I would prefer REST when:

- Exposing APIs to external consumers
- Browser compatibility matters
- Human-readable payloads help
- Existing integrations use HTTP/JSON
- HTTP caching semantics are useful
- Organizational tooling is strongly REST-oriented

I don't see gRPC as a universal replacement for REST.

A common architecture is:

```text
External clients
      ↓
REST API
      ↓
Internal microservices
      ↓
REST and/or gRPC
```

depending on requirements.

# 10. Kafka and Backward Compatibility

## Q40. What is a Kafka topic versus a queue?

**Sample answer:**

Kafka has topics rather than a separate queue primitive.

Queue-like behaviour comes from consumers sharing the same consumer group.

```text
Topic
 ├ Partition 0 → Worker A
 ├ Partition 1 → Worker B
 └ Partition 2 → Worker C
```

Each partition is handled by one consumer within that group.

Publish-subscribe behaviour comes from multiple consumer groups:

```text
OrderCreated
   ├ Inventory group
   ├ Notification group
   └ Analytics group
```

Each group independently receives the events.

---

## Q41. I need to rename a Kafka topic used by multiple teams. How do I prevent consumer applications from breaking?

**Sample answer:**

I would treat a topic rename as a contract migration, not a simple rename.

Kafka does not provide me with a transparent alias that makes this safe automatically.

I would create a new topic and use a staged migration.

For example:

```text
             ┌ old-topic → old consumers
Producer ────┤
             └ new-topic → migrated consumers
```

### Phase 1: Prepare

- Create the new topic
- Match partitioning where appropriate
- Configure ACLs
- Ensure schemas are compatible
- Inform consumer teams

### Phase 2: Dual publish or bridge

Temporarily publish events to both old and new topics, or introduce a controlled replication/bridge process.

### Phase 3: Consumer migration

Teams migrate independently:

```text
Consumer A → new topic
Consumer B → new topic
Consumer C → old topic
```

### Phase 4: Observe

Monitor:

- Consumer lag
- Message counts
- Errors
- Remaining consumption from old topic

### Phase 5: Deprecate

Only after no consumers depend on the old topic:

- Stop dual publishing
- Retain old topic for agreed period
- Remove ACLs
- Delete later

The key is backward compatibility and an explicit deprecation window.

# 11. Kubernetes

## Q42. How do microservices communicate inside the same Kubernetes cluster and namespace?

**Sample answer:**

For normal internal communication, I would expose each workload through a `ClusterIP` Service.

For example:

```text
order-service
```

Within the same namespace another service can call:

```text
http://order-service:8080
```

Kubernetes DNS resolves the service name.

I would not call pod IP addresses directly because pods can be recreated and receive new IP addresses.

Across namespaces I can use:

```text
order-service.orders
```

or the fully qualified service name.

---

## Q43. What is a ConfigMap?

**Sample answer:**

A ConfigMap stores non-sensitive application configuration separately from the container image.

For example:

```yaml
data:
  LOG_LEVEL: INFO
  FEATURE_X_ENABLED: "true"
```

It can be injected as:

- Environment variables
- Mounted files

This allows the same container image to run with different configuration in different environments.

---

## Q44. Should passwords and API keys go into ConfigMaps?

**Sample answer:**

No.

A ConfigMap is intended for non-sensitive configuration.

Sensitive values should use Kubernetes Secrets or, preferably in an enterprise environment, integrate Kubernetes with an external secrets-management system such as:

- HashiCorp Vault
- AWS Secrets Manager
- Azure Key Vault
- Cloud provider secret stores

I would also use:

- RBAC
- Encryption at rest
- Workload identities where possible
- Secret rotation
- Avoid logging secret values

And Kubernetes `Secret` values being base64-encoded should not be confused with encryption.

# 12. Pod Restart and OOM

## Q45. A pod restarts every few hours. What do you do?

**Sample answer:**

I first confirm the reason rather than immediately assuming an OOM.

```bash
kubectl describe pod <pod>
kubectl logs <pod> --previous
kubectl get events
```

I inspect:

```text
Last State
Reason
Exit Code
Restart Count
Events
```

If I see:

```text
Reason: OOMKilled
Exit Code: 137
```

then memory is the likely cause.

Because it takes several hours before failure, I would investigate gradual resource growth:

- Heap
- Metaspace
- Native memory
- Threads
- Caches
- Connection pools
- Queues
- File descriptors

---

## Q46. After confirming `OOMKilled`, what do you do?

**Sample answer:**

I would use three stages.

### Stabilize

Temporarily increase the **memory limit** so the service remains alive long enough to collect diagnostics.

I would adjust the memory **request** separately if scheduling assumptions are also wrong.

Request and limit have different purposes:

```text
request → scheduler capacity planning
limit   → maximum container memory
```

### Diagnose

For Java I might enable:

```text
-XX:+HeapDumpOnOutOfMemoryError
```

Then collect:

- Heap dump
- GC logs
- Java Flight Recorder
- APM metrics
- Native-memory metrics

Analyse for:

- Unbounded cache
- Static collections
- ThreadLocal leaks
- Huge persistence contexts
- Unreleased buffers
- Queue growth
- Unexpected object retention

### Fix and verify

After fixing:

- Load test
- Run beyond the original failure period
- Verify memory reaches a stable plateau
- Measure GC
- Right-size memory request and limit

I would not automatically revert to the old memory setting. I would configure the container based on measured behaviour.

# 13. Helm

## Q47. A Helm chart takes 30 minutes to deploy. What could cause it?

**Sample answer:**

I would first determine whether Helm itself is slow or whether Helm is waiting for Kubernetes.

If it consistently takes around 30 minutes, I would specifically check:

```text
--wait
--atomic
--timeout 30m
```

Common causes include:

- Pods stuck in `Pending`
- Slow image pulls
- Init containers
- Readiness probes
- Startup probes
- Pre-install/pre-upgrade hooks
- Database migration Jobs
- PVC provisioning
- Insufficient cluster capacity
- Missing ConfigMaps or Secrets
- Network problems
- Broken application startup

I would inspect:

```bash
helm status <release>

kubectl get pods,jobs

kubectl get events \
  --sort-by=.metadata.creationTimestamp

kubectl describe pod <pod>

kubectl rollout status deployment/<deployment>
```

I can also separate template rendering from deployment:

```bash
time helm template <release> <chart> > rendered.yaml
```

If that takes seconds but deployment takes 30 minutes, Helm templating is not the bottleneck.

# 14. Engineering Judgment Around Java

## Q48. Java is being used for everything, but performance is a concern. How would you approach that discussion?

**Sample answer:**

I would avoid starting from the language choice.

I would first measure where the bottleneck actually is.

For many enterprise systems, performance is dominated by:

- Database queries
- Network I/O
- Serialization
- External APIs
- Messaging
- Poor concurrency design
- Excessive data movement

rather than Java itself.

Modern Java has strong runtime performance, JIT optimization, mature GC implementations and now virtual threads.

But that doesn't mean Java is always the correct choice.

For example:

- A lightweight infrastructure service might be a good fit for Go.
- Heavy numerical workloads may fit another ecosystem.
- Data engineering may be better handled with dedicated data-processing platforms.
- Existing team expertise also matters.

I would make the decision using:

```text
requirements
+ measured workload
+ operational constraints
+ ecosystem
+ team capability
+ maintainability
```

rather than “Java versus Go” as an ideological choice.

# 15. AI Engineering Across Distributed Teams

## Q49. How do you maintain engineering quality when teams use AI heavily?

**Sample answer:**

I would make engineering quality independent of where the engineering team is located.

The controls should be consistent across every team:

```text
Architecture standards
       +
Repository instructions
       +
Automated tests
       +
Static analysis
       +
Security scans
       +
CI quality gates
       +
Code review
       +
Production observability
```

With AI, I would add:

- Approved AI tooling
- Repository-specific agent instructions
- Evaluation suites for reusable Skills
- Small reviewable diffs
- Traceability to requirements
- Mandatory verification commands
- Metrics for escaped defects and rework

The important question is not:

> Did a human or LLM write this code?

It is:

> What evidence do we have that this change is correct, secure, maintainable and production-ready?

That is the engineering standard I would apply to every team.
