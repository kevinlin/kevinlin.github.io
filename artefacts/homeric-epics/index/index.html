<style>
/* ===================== TOKENS =====================
   Greek black-figure: terracotta, black, bone, with the source map's teal and
   dark red. Palette values live here only; components reference semantic names. */
:root {
  /* raw palette */
  --ink:        #14100d;
  --ink-2:      #1c1410;
  --parch:      #e8dcc0;
  --bone:       #f4ecd8;
  --terra:      #b4451f;
  --terra-lit:  #f2a468;
  --teal:       #1d6f7e;
  --wine:       #7d2230;

  /* semantic */
  --bg:            var(--ink);
  --fg:            var(--bone);
  --fg-muted:      #cfc3ab;
  --fg-subtle:     #a99c85;
  --accent:        var(--terra);
  --accent-fg:     #fff8ec;
  --link:          var(--terra-lit);
  --panel:         rgba(20, 15, 12, 0.94);
  --panel-edge:    rgba(244, 236, 216, 0.14);
  --ring:          var(--terra-lit);

  /* type */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Palatino LT STD", Georgia, serif;
  --font-body:    "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-mono:    ui-monospace, "SF Mono", Menlo, monospace;

  /* space — 4px scale */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

  /* radius, concentric: outer = inner + padding */
  --r-sm: 3px; --r-md: 6px;

  /* motion */
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  /* layers */
  --z-stage: 0; --z-rail: 20; --z-panel: 30; --z-nav: 40; --z-selftest: 99;

  /* the rail owns the bottom strip; the panel and the credit sit above it */
  --rail-h: 4.25rem;
}

* { box-sizing: border-box; }

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 var(--font-body);
}

h1, h2, h3 { text-wrap: balance; }
p, li { text-wrap: pretty; }

/* the 3D stage fills the viewport; UI floats over it */
#stage { position: fixed; inset: 0; z-index: var(--z-stage); }
#stage canvas { display: block; }

/* a low vignette so the UI edges read against bright sea */
#stage::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 45%, rgba(8,6,5,.55) 100%);
}

/* focus is never removed, only restyled */
:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: var(--r-sm); }

/* skip link: first focusable, hidden until focused */
.skip {
  position: fixed; top: var(--s-2); left: var(--s-2); z-index: 200;
  padding: var(--s-2) var(--s-4);
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--panel-edge); border-radius: var(--r-md);
  transform: translateY(-200%);
}
.skip:focus { transform: none; }

/* no-WebGL / no-JS fallback */
#fallback { display: none; }
.no-webgl #stage, .no-webgl #journal, .no-webgl #rail,
.no-webgl #nav, .no-webgl #credit { display: none; }
.no-webgl #fallback { display: block; }

#fallback {
  max-width: 68ch;
  margin: 0 auto;
  padding: var(--s-7) var(--s-5) var(--s-8);
}
#fallback h1 {
  font-family: var(--font-display);
  font-variant: small-caps; letter-spacing: .04em;
  font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15;
  margin: 0 0 var(--s-5);
}
#fallback .note, #fallback .credit {
  color: var(--fg-subtle); font-size: .9rem;
  border-left: 2px solid var(--wine); padding-left: var(--s-4);
}
#fallback .fallback-list { list-style: none; margin: var(--s-7) 0; padding: 0; }
#fallback .fallback-list > li { margin: 0 0 var(--s-7); }

noscript .nojs {
  display: block; max-width: 68ch; margin: 0 auto; padding: var(--s-7) var(--s-5);
  color: var(--fg-muted);
}

/* ===================== JOURNAL PANEL ===================== */
#journal {
  position: fixed; top: 0; left: 0; z-index: var(--z-panel);
  width: min(30rem, 34vw); height: calc(100% - var(--rail-h));
  overflow-y: auto; overscroll-behavior: contain;
  padding: var(--s-7) var(--s-6) var(--s-7);
  background:
    linear-gradient(100deg, rgba(20,15,12,.97) 0%, rgba(20,15,12,.90) 70%, rgba(20,15,12,.80) 100%);
  /* layered shadow, not a border: reads as depth over the moving map */
  box-shadow:
    1px 0 1px rgba(0,0,0,.20),
    3px 0 8px rgba(0,0,0,.18),
    12px 0 40px rgba(0,0,0,.30);
}

/* hairline highlight along the panel edge, the way gilt edges catch light */
#journal::after {
  content: ""; position: fixed; top: 0; bottom: var(--rail-h);
  left: min(30rem, 34vw); width: 1px;
  background: linear-gradient(180deg, transparent, rgba(242,164,104,.30) 35%, transparent);
  pointer-events: none;
}

.entry { max-width: 62ch; }

.entry .eyebrow {
  display: flex; gap: var(--s-4); align-items: baseline;
  margin: 0 0 var(--s-2);
}
.entry .numeral {
  font-family: var(--font-display);
  font-size: 2rem; line-height: 1;
  color: var(--terra-lit);
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}
.entry .year {
  font-size: .8125rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--fg-subtle);
}

.entry h2 {
  margin: 0 0 var(--s-3);
  font-family: var(--font-display);
  font-size: clamp(2rem, 3.4vw, 2.75rem); line-height: 1.08;
  font-variant: small-caps; letter-spacing: .035em;
  color: var(--fg);
}

.entry .event {
  margin: 0 0 var(--s-5); padding-bottom: var(--s-5);
  font-size: 1.0625rem; font-style: italic; color: var(--fg-muted);
  border-bottom: 1px solid rgba(244,236,216,.12);
}

.entry .prose { margin: 0 0 var(--s-5); color: #efe6d2; }

.entry .prov {
  margin: 0 0 var(--s-5); padding-left: var(--s-4);
  border-left: 2px solid var(--wine);
  font-size: .875rem; color: var(--fg-muted);
}

.entry .links {
  display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5);
  margin: var(--s-6) 0 0;
  font-size: .875rem; letter-spacing: .06em; font-variant: small-caps;
}

#journal a, #fallback a {
  color: var(--link);
  text-decoration-thickness: 1px; text-underline-offset: .22em;
  text-decoration-color: rgba(242,164,104,.45);
  transition: text-decoration-color 120ms var(--ease-out), color 120ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  #journal a:hover, #fallback a:hover, #credit a:hover {
    color: #ffc59a; text-decoration-color: currentColor;
  }
}

/* stop switching happens tens of times a session, so the entry gets one short
   fade-and-rise and nothing more */
.entry { animation: entryIn 180ms var(--ease-out) both; }
.entry h2       { animation: entryIn 220ms var(--ease-out) 40ms both; }
.entry .prose   { animation: entryIn 240ms var(--ease-out) 70ms both; }
@keyframes entryIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

@media (max-width: 768px) {
  #journal {
    width: 100%; height: 52vh; top: auto; bottom: var(--rail-h);
    padding: var(--s-5) var(--s-5) var(--s-6);
    box-shadow: 0 -1px 1px rgba(0,0,0,.2), 0 -8px 32px rgba(0,0,0,.35);
    /* the desktop panel is translucent because it sits over dark sea; the bottom
       sheet sits over bright parchment, where translucency wrecks the prose */
    background: #16110e;
  }
  #rail button { padding-top: var(--s-3); }
  #journal::after {
    left: 0; right: 0; top: auto; bottom: calc(52vh + var(--rail-h)); width: auto; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(242,164,104,.30) 40%, transparent);
  }
  .entry h2 { font-size: 2rem; }
}

@media (prefers-reduced-motion: reduce) {
  .entry, .entry h2, .entry .prose { animation: none; }
}

/* ===================== YEAR RAIL + NAV ===================== */
#rail {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-rail);
  display: flex; height: var(--rail-h);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(244,236,216,.22) transparent;
  background: linear-gradient(180deg, rgba(12,9,7,.86), rgba(12,9,7,.96));
  box-shadow: 0 -1px 0 rgba(244,236,216,.16), 0 -6px 22px rgba(0,0,0,.35);
}

/* the rail's own label, so the proportions are readable as data and not just
   as a control strip */
#rail::before {
  content: "Years elapsed (approximate)";
  position: fixed; left: var(--s-4); bottom: calc(var(--rail-h) + var(--s-2));
  padding: 3px var(--s-2);
  border-radius: var(--r-sm);
  background: rgba(10,7,6,.88);          /* the panel behind is translucent, so the
                                            caption carries its own contrast */
  font-size: .6875rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--fg-muted);
}

#rail button {
  position: relative;
  /* min-width keeps every stop a 24px target; flex-shrink lets Ogygia and Aeaea
     give up the room, so the proportions survive without overflowing */
  flex: 0 1 auto; min-width: 24px;
  border: 0; border-right: 1px solid rgba(244,236,216,.14);
  background: transparent; color: var(--fg-muted);
  cursor: pointer; padding: var(--s-4) var(--s-1) var(--s-2);
  font: inherit; font-size: .75rem;
  font-variant: small-caps; letter-spacing: .06em;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  transition: background 140ms var(--ease-out), color 140ms var(--ease-out);
}
#rail button:last-child { border-right: 0; }

/* the tick that turns the strip into a timeline */
#rail button::before {
  content: ""; position: absolute; left: 0; bottom: 0; width: 1px; height: .55rem;
  background: rgba(244,236,216,.28);
}
/* a bead per stop, so the narrow segments are still something to aim at */
#rail button::after {
  content: ""; position: absolute; left: 50%; bottom: 1.05rem;
  width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
  background: rgba(242,164,104,.55);
}
#rail button[aria-current="true"]::after { background: var(--accent-fg); }

@media (hover: hover) and (pointer: fine) {
  #rail button:hover { background: rgba(180,69,31,.30); color: var(--fg); }
}
#rail button[aria-current="true"] {
  background: var(--accent); color: var(--accent-fg);
  box-shadow: inset 0 2px 0 var(--terra-lit);
}

#nav {
  position: fixed; right: var(--s-4); bottom: calc(var(--rail-h) + var(--s-3));
  z-index: var(--z-nav); display: flex; gap: var(--s-2);
}
#nav button {
  font: inherit; font-size: .8125rem;
  font-variant: small-caps; letter-spacing: .10em;
  min-height: 44px; padding: var(--s-3) var(--s-5);
  color: var(--fg); cursor: pointer;
  background: rgba(20,15,12,.92);
  border: 1px solid rgba(244,236,216,.28);
  border-radius: var(--r-md);
  box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.25);
  transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out),
              transform 90ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  #nav button:not(:disabled):hover {
    background: rgba(38,26,20,.95); border-color: rgba(242,164,104,.55);
  }
}
#nav button:not(:disabled):active { transform: scale(.97); }
#nav button:disabled { opacity: .35; cursor: default; }

@media (max-width: 768px) {
  #nav { bottom: calc(52vh + var(--rail-h) + var(--s-3)); right: var(--s-3); }
  /* no room for the rail's caption once the sheet sits directly above it */
  #rail::before { content: ""; }
  /* 17 x 24px does not fit in 390px, so the rail scrolls instead of collapsing */
  #rail button { flex-shrink: 0; }
}

@media (prefers-reduced-motion: reduce) {
  #rail button, #nav button { transition: none; }
  #nav button:not(:disabled):active { transform: none; }
}

/* ===================== SELFTEST BANNER ===================== */
#selftest {
  position: fixed; inset: 0 0 auto 0; z-index: var(--z-selftest);
  padding: var(--s-3) var(--s-5);
  font: 13px/1.6 var(--font-mono); white-space: pre;
  overflow: auto; max-height: 60vh;
  box-shadow: 0 4px 20px rgba(0,0,0,.45);
}

/* ===================== COLOPHON ===================== */
/* Sticks to the foot of the panel so the byline and the honesty note are on
   screen at every width, without duplicating them over the map. */
#colophon {
  position: sticky; bottom: 0;
  margin: var(--s-7) calc(var(--s-6) * -1) calc(var(--s-7) * -1);
  padding: var(--s-3) var(--s-6) var(--s-4);
  background: linear-gradient(180deg, rgba(20,15,12,0), rgba(18,13,11,.97) 28%);
  border-top: 1px solid rgba(244,236,216,.10);
}
#about summary {
  cursor: pointer; list-style: none;
  font-size: .75rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--fg-subtle);
  padding: var(--s-2) 0;
  transition: color 120ms var(--ease-out);
}
#about summary::-webkit-details-marker { display: none; }
#about summary::before { content: "\25B8"; color: var(--terra-lit); padding-right: .5em;
  display: inline-block; transition: transform 140ms var(--ease-out); }
#about[open] summary::before { transform: rotate(90deg); }
@media (hover: hover) and (pointer: fine) {
  #about summary:hover { color: var(--fg); }
}
#route-note {
  margin: 0 0 var(--s-3); padding-left: var(--s-4);
  border-left: 2px solid var(--wine);
  font-size: .8125rem; line-height: 1.5; color: var(--fg-muted);
}
#credit {
  margin: 0; font-size: .6875rem; line-height: 1.45; color: var(--fg-subtle);
}
</style>
</head>

<script type="module" id="core">
/* ===================== PROJECTION ===================== */
/* Plate carree with a longitude correction. The source map is UNCORRECTED
   plate carree; we correct so landmasses hold their real proportions under a
   moving camera. Set LON_SCALE = 1.0 to match the source map exactly. */
export const LON_SCALE = Math.cos(38 * Math.PI / 180);
export const UNITS_PER_DEG = 10;

export function lonLatToWorld(lon, lat) {
  return { x: lon * LON_SCALE * UNITS_PER_DEG, y: 0, z: -lat * UNITS_PER_DEG };
}

export function worldToLonLat({ x, z }) {
  return { lon: x / (LON_SCALE * UNITS_PER_DEG), lat: -z / UNITS_PER_DEG };
}

/* ===================== STOPS ===================== */
/* Coordinates transcribed from the design table. Three map-derived stops there
   fell inside coastline geometry, and the design requires map-derived placements
   to sit in open water; each is nudged by the smallest offset that clears land,
   keeping its longitude:
     Lamos      36.51 -> 36.86 lat (offshore Algeria)
     Cimmerians 41.94 -> 41.74 lat (off the Catalan coast)
     Sirens     39.25 -> 38.85 lat (south of Sardinia, not inside it)
   Real-world coordinates are untouched, including the ones that are properly on
   land: Troy at inland Hisarlik, Lotophagi on Djerba, Scylla on the Calabrian
   shore. Those are landfalls, not errors. */
const W = 'https://en.wikipedia.org/wiki/';
const H = 'https://www.worldhistory.org/';

export const STOPS = [
  { n: 1, numeral: 'I', name: 'Troy', lon: 26.239, lat: 39.957, prov: 'real',
    yearFrom: 1, yearTo: 1, setpiece: 'troy',
    event: 'Odysseus leaves with 12 ships',
    prose: `After ten years of siege Troy falls to the stratagem of the wooden horse, and Odysseus, king of Ithaca and architect of that deception, sails for home with twelve ships. The Odyssey opens long after this departure and recovers the voyage in retrospect, largely through Odysseus' own telling at the Phaeacian court. Homer grants the returning fleet no easy passage: the Greeks have offended Athena by their conduct in the sack, and the sea will take ten further years before Ithaca is reached.`,
    links: { wikipedia: W + 'Troy', whe: H + 'Troy/' } },

  { n: 2, numeral: 'II', name: 'Ismarus', lon: 25.520, lat: 40.870, prov: 'real',
    yearFrom: 1, yearTo: 1, setpiece: null,
    event: "The crew pillages the Cicones' town; the Cicones kill 76",
    prose: `The fleet's first landfall is Ismarus, a town of the Cicones on the Thracian coast. Odysseus' men sack it, killing the men and carrying off the women and goods, which is conventional conduct for a returning raiding fleet and the first sign that the crew's appetites will govern this voyage. The Cicones summon inland allies and counterattack from the plain. Homer's tally is six men lost from each of the twelve ships, seventy-two in all; the source map gives the figure as 76. The survivors put to sea.`,
    links: { wikipedia: W + 'Ismara', whe: H + 'Odysseus/' } },

  { n: 3, numeral: 'III', name: 'Cape Malea', lon: 23.199, lat: 36.439, prov: 'real',
    yearFrom: 1, yearTo: 1, setpiece: null,
    event: 'Odysseus is blown off course',
    prose: `Rounding Cape Malea at the southeastern tip of the Peloponnese, the fleet meets the north wind and is driven off course. The cape was notorious in antiquity as a hazard, and a Greek proverb advised sailors rounding it to forget their homeland. This is the hinge of the poem's geography. Everything before it is ordinary coastal sailing between places a Greek audience knew; everything after belongs to myth, which is why the remaining identifications on this route are proposals rather than locations.`,
    links: { wikipedia: W + 'Cape_Maleas', whe: H + 'Odyssey/' } },

  { n: 4, numeral: 'IV', name: 'Cythera', lon: 23.000, lat: 36.150, prov: 'real',
    yearFrom: 1, yearTo: 1, setpiece: null,
    event: 'Storms for ten days',
    prose: `Blown past Cythera, the island south of Cape Malea sacred to Aphrodite, the fleet is carried across open water by storms. Homer counts nine days and gives no direction at all; the source map records ten. With that the ships leave charted water. Every landfall from here until the Phaeacians ferry Odysseus home belongs to a world that resists being placed on any map, and the scholarly attempts to place it have never converged.`,
    links: { wikipedia: W + 'Kythira', whe: H + 'Odyssey/' } },

  { n: 5, numeral: 'V', name: 'Lotophagi', lon: 10.900, lat: 33.800, prov: 'real',
    yearFrom: 1, yearTo: 1, setpiece: null,
    event: 'The crew eats addictive flowers and wants to stay',
    prose: `The land of the Lotus-eaters, whose people live on a flowering plant that erases the wish to go home. Three scouts sent ashore eat it and lose all desire to leave. Odysseus has them dragged back to the ship and bound beneath the benches. Nobody dies here. It is the mildest-looking danger in the poem and among the most serious: the voyage very nearly ends. Herodotus placed the Lotus-eaters on the North African coast, an identification that later fixed them at Djerba.`,
    links: { wikipedia: W + 'Lotus-eaters', whe: H + 'Odyssey/' } },

  { n: 6, numeral: 'VI', name: 'Cyclopes', lon: 15.160, lat: 37.560, prov: 'real',
    yearFrom: 1, yearTo: 1, setpiece: 'cyclops',
    event: "Odysseus blinds Polyphemus, Poseidon's son",
    prose: `Odysseus and twelve men enter the cave of Polyphemus, a one-eyed giant and a son of Poseidon, who seals them in and eats six. Odysseus gives his name as Outis, Nobody, gets the giant drunk and blinds him with a sharpened stake; the survivors escape clinging beneath the bellies of his sheep. Once clear of the shore Odysseus shouts his real name back at the cliff. Polyphemus prays to his father, and Poseidon's answering enmity is what keeps the fleet from home.`,
    links: { wikipedia: W + 'Polyphemus', whe: H + 'Polyphemus/' } },

  { n: 7, numeral: 'VII', name: 'Aeolia', lon: 12.430, lat: 36.850, prov: 'map',
    yearFrom: 1, yearTo: 1, setpiece: 'aeolia',
    event: 'The crew opens the bag of winds and is blown off course',
    prose: `Aeolus, keeper of the winds, receives Odysseus hospitably and gives him a leather bag holding every wind but the west, which is left free to carry the ships home. Ithaca is in sight on the tenth day when Odysseus sleeps and his crew, suspecting hidden treasure, open the bag. The released winds drive the fleet all the way back to Aeolia, where Aeolus turns them away, reading their misfortune as proof of divine disfavour. The source map places Aeolia in the Strait of Sicily; tradition puts it at the Aeolian Islands.`,
    links: { wikipedia: W + 'Aeolus_(Odyssey)', whe: H + 'Odyssey/' } },

  { n: 8, numeral: 'VIII', name: 'Lamos', lon: 6.000, lat: 36.860, prov: 'map',
    yearFrom: 1, yearTo: 1, setpiece: 'lamos',
    event: 'Laestrygonians kill and eat most of the crew',
    prose: `Lamos, city of the Laestrygonians, a race of giants. Its harbour is a near-enclosed basin with a narrow mouth, and eleven of the twelve ships moor inside; Odysseus alone keeps his ship at the entrance. The Laestrygonians attack from the cliffs with boulders, crushing the trapped vessels and spearing the crews in the water. Only Odysseus' ship escapes. One episode reduces the expedition from twelve ships to one, and the poem stops being the story of a fleet.`,
    links: { wikipedia: W + 'Laestrygonians', whe: H + 'Odyssey/' } },

  { n: 9, numeral: 'IX', name: 'Aeaea', lon: 3.890, lat: 39.760, prov: 'map',
    yearFrom: 1, yearTo: 2, setpiece: 'aeaea',
    event: 'Circe turns the crew to swine',
    prose: `The island of Circe, an enchantress and a daughter of Helios. A scouting party of twenty-two men drinks from her cup and is turned into swine. Warned by Hermes and protected by the herb moly, Odysseus resists the drug and compels her to restore them. Then he stays. The crew remains a full year; Homer says plainly that a year was gone before the men urged departure. Her parting instruction sends them further from home, to the edge of the world, to consult the dead.`,
    links: { wikipedia: W + 'Circe', whe: H + 'Circe/' } },

  { n: 10, numeral: 'X', name: 'Cimmerians', lon: 2.960, lat: 41.740, prov: 'map',
    yearFrom: 2, yearTo: 2, setpiece: 'underworld',
    event: 'Odysseus enters the Underworld',
    prose: `At the world's edge, in the land of the Cimmerians where the sun never shines, Odysseus performs the rites that summon the dead. He speaks with the seer Teiresias, who gives him his route home and warns him to leave the cattle of Helios alone; with his mother Anticleia, dead of grief in his absence; and with Achilles, who says he would rather be a living man's slave than king among the dead. The episode is the poem's turning point, supplying both the way home and the terms of survival.`,
    links: { wikipedia: W + 'Nekyia', whe: H + 'Underworld/' } },

  { n: 11, numeral: 'XI', name: 'Sirens', lon: 9.240, lat: 38.850, prov: 'map',
    yearFrom: 2, yearTo: 2, setpiece: 'sirens',
    event: 'The crew blocks their ears with wax to avoid the song',
    prose: `The Sirens sing from their island to passing sailors, and those who listen steer onto the rocks; Homer describes a meadow heaped with the bones of men. Following Circe's instructions, Odysseus plugs his crew's ears with beeswax and has himself lashed upright to the mast so that he can hear the song and survive it, ordering the crew to tighten the ropes if he begs to be freed. They do. It is the one danger in the poem Odysseus arranges to experience on purpose.`,
    links: { wikipedia: W + 'Siren_(mythology)', whe: H + 'Sirens/' } },

  { n: 12, numeral: 'XII', name: 'Scylla', lon: 15.720, lat: 38.250, prov: 'real',
    yearFrom: 2, yearTo: 2, setpiece: 'strait',
    event: 'The monster eats six of the crew',
    prose: `Scylla, a cliff-dwelling monster with six heads on long necks, guards one side of a narrow strait. Circe's advice is blunt: pass close to Scylla and lose a few men, because the alternative is losing the whole ship to Charybdis opposite. Odysseus does not tell his crew what is coming. Scylla takes six men off the deck as the ship runs through, and Homer's simile compares their cries to fish hauled up on a line. Antiquity placed the strait at Messina, between Italy and Sicily.`,
    links: { wikipedia: W + 'Scylla', whe: H + 'Scylla/' } },

  { n: 13, numeral: 'XIII', name: 'Charybdis', lon: 15.650, lat: 38.090, prov: 'real',
    yearFrom: 2, yearTo: 2, setpiece: null,
    event: 'The monstrous whirlpool',
    prose: `Charybdis lies opposite Scylla, a whirlpool that swallows the sea three times a day and vomits it back. Odysseus passes safely on the first crossing by hugging Scylla's cliff. He meets it a second time alone, after the loss of his ship, clinging to a fig tree above the vortex until the mast and keel he had been riding are spat back up, then dropping onto them and paddling clear. The pair have named a proverb ever since, for a choice between two unavoidable dangers.`,
    links: { wikipedia: W + 'Charybdis', whe: H + 'Charybdis/' } },

  { n: 14, numeral: 'XIV', name: 'Thrinacia', lon: 14.600, lat: 36.720, prov: 'real',
    yearFrom: 2, yearTo: 2, setpiece: 'thrinacia',
    event: 'The crew eats the Oxen of the Sun and is punished by Zeus',
    prose: `Thrinacia, the island pasturing the cattle of Helios, which both Teiresias and Circe warned Odysseus to leave untouched. Contrary winds hold the ship there for a month until the provisions run out, and while Odysseus sleeps his men slaughter and eat the cattle. Helios demands redress, and Zeus destroys the ship with a thunderbolt once it puts to sea. Every remaining crewman drowns and Odysseus survives alone, reducing the poem's cast to one man in the water. Thrinacia is traditionally identified with Sicily.`,
    links: { wikipedia: W + 'Thrinacia', whe: H + 'Helios/' } },

  { n: 15, numeral: 'XV', name: 'Ogygia', lon: 2.430, lat: 39.130, prov: 'map',
    yearFrom: 3, yearTo: 9, setpiece: 'ogygia',
    event: 'Odysseus has a seven-year stay with the nymph Calypso',
    prose: `The island of Calypso, a nymph who takes in the shipwrecked Odysseus and keeps him seven years, offering immortality if he will stay. Homer's account is ambivalent: Odysseus weeps on the shore by day and shares her bed at night. Only when Athena raises the matter in council does Zeus send Hermes to order his release. Seven of the journey's ten years pass here, in one place, with nothing happening, which makes this the longest and stillest stretch of the poem.`,
    links: { wikipedia: W + 'Ogygia', whe: H + 'Ogygia/' } },

  { n: 16, numeral: 'XVI', name: 'Scheria', lon: 9.360, lat: 41.620, prov: 'map',
    yearFrom: 10, yearTo: 10, setpiece: null,
    event: 'The Phaeacians ferry Odysseus home',
    prose: `The land of the Phaeacians, expert seafarers ruled by Alcinous and Arete. Odysseus washes ashore naked and exhausted, is found by their daughter Nausicaa, and is received at court without being asked his name. Over two nights he tells the story of his wanderings. Books 9 to 12 of the Odyssey are that telling. The Phaeacians then load him with gifts and carry him to Ithaca in a single night's sailing, asleep on deck, and Poseidon punishes them for it. The source map places Scheria at Corsica; other readings favour Corfu.`,
    links: { wikipedia: W + 'Scheria', whe: H + 'Odyssey/' } },

  { n: 17, numeral: 'XVII', name: 'Ithaca', lon: 20.650, lat: 38.400, prov: 'real',
    yearFrom: 10, yearTo: 10, setpiece: 'ithaca',
    event: 'Odysseus returns home and kills the suitors besetting Penelope',
    prose: `Odysseus lands after twenty years away, ten at Troy and ten returning, set ashore asleep and alone. Athena disguises him as a beggar. He is recognised first by his old dog Argos and then by his nurse Eurycleia, who knows the scar on his thigh; he tests the loyalty of his household and reveals himself by stringing the bow that none of Penelope's hundred and eight suitors can bend. He kills them in the hall. Penelope tests him in turn, with a question about their marriage bed only her husband could answer.`,
    links: { wikipedia: W + 'Homer%27s_Ithaca', whe: H + 'Ithaca/' } },
];

/* Presentation-only marker offsets, in degrees. The data coordinates above stay
   authoritative — the route, the ship and the projection tests all use them. This
   moves only the clickable bead.

   Scylla and Charybdis are ~18km apart, which renders 5px apart: the beads are
   wider than the gap, so no camera distance separates them (zooming scales both).
   Design section 3 asks for them to be separated enough to be individually
   clickable, so each is pushed onto the shore it actually belongs to — Scylla to
   the Calabrian side, Charybdis to the Sicilian side off Punta del Faro. */
export const MARKER_NUDGE = {
  12: [ 0.20,  0.20],   // Scylla, northeast onto Calabria
  13: [-0.20, -0.20],   // Charybdis, southwest towards the Sicilian shore
};

export const markerLonLat = (s) => {
  const d = MARKER_NUDGE[s.n];
  return d ? [s.lon + d[0], s.lat + d[1]] : [s.lon, s.lat];
};

/* ===================== ROUTE ===================== */
/* Ray-casting point-in-polygon over the atlas rings. Used by the tests to prove
   no leg of the route crosses land, and by nothing at runtime. */
export function pointInLand([lon, lat]) {
  for (const ring of ATLAS) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > lat) !== (yj > lat) &&
          lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}

/* Hand-tuned waypoints that keep a leg in open water. Keyed "from-to" by stop
   number. The source map arcs these legs the same way. Add points here when the
   "no route leg cuts across land" test reports an offender. */

export function routeLonLats() {
  const out = [];
  STOPS.forEach((s, i) => {
    out.push([s.lon, s.lat]);
    const next = STOPS[i + 1];
    if (next) for (const p of VIA[`${s.n}-${next.n}`] ?? []) out.push(p);
  });
  return out;
}

export const ATTRIBUTION = {

const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const yearLabel = (s) =>

const link = (href, label) =>
  `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;

export function renderEntry(s) {

/* ===================== YEAR RAIL ===================== */
/* Segment width is proportional to time spent, so the seven years on Ogygia take
   roughly 70% of the rail. Stops that occupy no measurable time still need to be
   clickable, so each gets a MIN_SHARE floor before normalisation.
   MIN_SHARE = 0.09 puts Ogygia at 71.9%. 0.06 puts it at 75.9% and fails the
   test; 0.12 passes at 68.2% and makes the single-year stops easier to hit. */
const MIN_SHARE = 0.09;   // in years

export function railSegments() {
  const raw = STOPS.map(s => Math.max(s.yearTo - s.yearFrom + 1 - 1, 0) || MIN_SHARE);
  const total = raw.reduce((a, b) => a + b, 0);
  return STOPS.map((s, i) => ({
    n: s.n, numeral: s.numeral, name: s.name,
    yearFrom: s.yearFrom, yearTo: s.yearTo,
    widthPct: (raw[i] / total) * 100,
  }));
}


/* ===================== SELFTEST ===================== */
const NUMERALS = ['I','II','III','IV','V','VI','VII','VIII','IX','X',
                  'XI','XII','XIII','XIV','XV','XVI','XVII'];

export function selftest(setpieceKeys = null) {
  const results = [];
  const check = (name, fn) => {
    try { const detail = fn(); results.push({ name, ok: detail === true, detail:
      detail === true ? 'ok' : String(detail) }); }
    catch (e) { results.push({ name, ok: false, detail: e.message }); }
  };

  check('stop count', () => STOPS.length === 17 || `got ${STOPS.length}`);
  check('numerals ordered', () => {
    const bad = STOPS.filter((s, i) => s.n !== i + 1 || s.numeral !== NUMERALS[i]);
    return bad.length === 0 || bad.map(s => s.name).join(', ');
  });
  check('links well-formed', () => {
    const bad = [];
    for (const s of STOPS) {
      for (const [k, host] of [['wikipedia', 'en.wikipedia.org'],
                               ['whe', 'www.worldhistory.org']]) {
        const u = new URL(s.links[k]);
        if (u.protocol !== 'https:' || u.host !== host) bad.push(`${s.name}.${k}`);
      }
    }
    return bad.length === 0 || bad.join(', ');
  });
  check('projection round-trip', () => {
    const bad = STOPS.filter(s => {
      const b = worldToLonLat(lonLatToWorld(s.lon, s.lat));
      return Math.abs(b.lon - s.lon) > 1e-9 || Math.abs(b.lat - s.lat) > 1e-9;
    });
    return bad.length === 0 || bad.map(s => s.name).join(', ');
  });
  check('rail widths', () => {
    const total = railSegments().reduce((a, s) => a + s.widthPct, 0);
    return Math.abs(total - 100) < 1e-6 || `sum ${total}`;
  });
  check('stops in bounds', () => {
    const bad = STOPS.filter(s => s.lon < -7 || s.lon > 42 || s.lat < 29 || s.lat > 48);
    return bad.length === 0 || bad.map(s => s.name).join(', ');
  });
  check('setpiece keys resolvable', () => {
    if (!setpieceKeys) return true;                       // Node run: nothing to resolve
    const bad = STOPS.filter(s => s.setpiece && !setpieceKeys.includes(s.setpiece));
    return bad.length === 0 || bad.map(s => s.setpiece).join(', ');
  });
  check('atlas present', () => ATLAS.length > 0 || 'atlas is empty');
  check('map-derived stops in open water', () => {
    const dry = STOPS.filter(s => s.prov === 'map' && pointInLand([s.lon, s.lat]));
    return dry.length === 0 || dry.map(s => s.name).join(', ');
  });

  return { pass: results.every(r => r.ok), results };
}

if (!webglAvailable()) {
  document.documentElement.classList.add('no-webgl');
  document.querySelector('.skip').href = '#fallback';   // the journal is hidden here
  document.querySelector('.skip').textContent = 'Skip to the seventeen entries';
  document.getElementById('fallback').innerHTML = core.renderFallback();
  window.__nostos = { ready: true, fallback: true, core };
} else {
  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1b20);
  scene.fog = new THREE.Fog(0x0d1b20, 520, 1700);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 4000);
  const mid = core.lonLatToWorld(17, 39);
  camera.position.set(mid.x, 340, mid.z + 300);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(mid.x, 0, mid.z);
  controls.enableDamping = !reducedMotion;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 40;
  controls.maxDistance = 900;

  scene.add(new THREE.HemisphereLight(0xbfd8e0, 0x3a2a18, 0.85));
  const sun = new THREE.DirectionalLight(0xffe8c4, 1.25);
  sun.position.set(-300, 400, 160);
  scene.add(sun);

  /* ---- sea: one plane, one procedurally drawn texture, no shader ----
     Sized to outrun the atlas in every direction so no plane edge is ever
     visible on the horizon. Two triangles; the size costs nothing. */
  const LON_SCALE = core.LON_SCALE;
  const SEA_W = 1200, SEA_H = 900;
  function seaTexture() {
    const S = 512, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = '#1d6f7e'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 9000; i++) {           // faint grain
      g.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`;
      g.fillRect(Math.random() * S, Math.random() * S, 1, 1);
    }
    /* one line per tile edge: the repeat below then sets the spacing to 5 degrees.
       Subdividing inside the tile makes the grid read as noise, not as a graticule. */
    g.strokeStyle = 'rgba(240,236,216,0.13)';
    g.lineWidth = 2;
    g.strokeRect(0, 0, S, S);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(SEA_W / (5 * LON_SCALE * core.UNITS_PER_DEG),
                 SEA_H / (5 * core.UNITS_PER_DEG));   // a 5-degree graticule
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  const seaMap = seaTexture();
  const sea = new THREE.Mesh(
    new THREE.PlaneGeometry(SEA_W, SEA_H),
    new THREE.MeshStandardMaterial({ map: seaMap, roughness: 0.72, metalness: 0.05 }));
  sea.name = 'sea';
  sea.rotation.x = -Math.PI / 2;
  sea.position.set(core.lonLatToWorld(17, 0).x, -0.35, core.lonLatToWorld(0, 39).z);
  scene.add(sea);

  const RAIL_PX = 68;                       // --rail-h, 4.25rem
  function frameVisibleArea() {
    const narrow = innerWidth <= 768;
    const panelW = narrow ? 0 : Math.min(30 * 16, innerWidth * 0.34);
    const covered = narrow ? innerHeight * 0.52 + RAIL_PX : RAIL_PX;
    camera.setViewOffset(innerWidth, innerHeight,
                         -panelW / 2, covered / 2, innerWidth, innerHeight);
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    frameVisibleArea();                     // calls updateProjectionMatrix
    renderer.setSize(innerWidth, innerHeight);
  }
  addEventListener('resize', onResize);
  frameVisibleArea();

  window.__nostos = { scene, camera, renderer, controls, core, reducedMotion, ready: true };


  /* ---- terrain: a relief map painted onto the land ----
     Real elevation data stays out of scope, so the height field is synthetic:
     how far inland a pixel sits (the coastline filled once through a blur)
     times fractal noise. It drives a hypsometric colour ramp and a bump map,
     which is what turns flat parchment into something that reads as land under
     a moving light. Seeded, so the same coast grows the same mountains every
     load. No custom shader, same as the sea. */
  const surface = (w, h) =>
    Object.assign(document.createElement('canvas'), { width: w, height: h })
          .getContext('2d', { willReadFrequently: true });

  function terrainMaps(bb) {
    const W = bb.x1 - bb.x0, H = bb.y1 - bb.y0;
    const PX = 1024, PY = Math.round(PX * H / W);
    let seed = 0x6d795365;
    const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

    /* fractal noise: small random grids drawn large, so the browser's bilinear
       upscale does the interpolation and we write no lerp of our own. */
    const noise = surface(PX, PY);
    noise.fillStyle = '#000'; noise.fillRect(0, 0, PX, PY);
    noise.globalCompositeOperation = 'lighter';
    for (const [cells, amp] of [[5, 0.5], [12, 0.26], [30, 0.16], [72, 0.11], [170, 0.06]]) {
      const g = surface(cells, Math.max(1, Math.round(cells * PY / PX)));
      const d = g.createImageData(g.canvas.width, g.canvas.height);
      for (let i = 0; i < d.data.length; i += 4) {
        d.data[i] = d.data[i + 1] = d.data[i + 2] = rnd() * 255;
        d.data[i + 3] = 255;
      }
      g.putImageData(d, 0, 0);
      noise.globalAlpha = amp;
      noise.drawImage(g.canvas, 0, 0, PX, PY);
    }

    /* inland-ness: the shore lands near mid-grey, the deep interior at white. */
    const relief = surface(PX, PY);
    relief.fillStyle = '#000'; relief.fillRect(0, 0, PX, PY);
    relief.filter = `blur(${PX / 48}px)`;
    relief.fillStyle = '#fff';
    relief.beginPath();
    for (const ring of core.ATLAS) {
      ring.forEach(([lon, lat], i) => {
        const p = core.lonLatToWorld(lon, lat);
        const x = (p.x - bb.x0) / W * PX, y = (bb.y1 - -p.z) / H * PY;
        i === 0 ? relief.moveTo(x, y) : relief.lineTo(x, y);
      });
      relief.closePath();
    }
    relief.fill();
    relief.filter = 'none';

    const ramp = surface(256, 1), grad = ramp.createLinearGradient(0, 0, 256, 0);
    for (const [at, hex] of [[0, '#ded0af'], [0.07, '#cbc293'], [0.22, '#9aa771'],
                             [0.44, '#a89660'], [0.67, '#957748'], [0.86, '#8a7b6c'],
                             [1, '#e7e3d9']]) grad.addColorStop(at, hex);
    ramp.fillStyle = grad; ramp.fillRect(0, 0, 256, 1);
    const LUT = ramp.getImageData(0, 0, 256, 1).data;

    const height = relief.getImageData(0, 0, PX, PY);
    const grain = noise.getImageData(0, 0, PX, PY);
    const tint = relief.createImageData(PX, PY);
    for (let i = 0; i < height.data.length; i += 4) {
      const inland = Math.max(0, (height.data[i] / 255 - 0.5) * 2);   // 0 at the shore
      const h = Math.min(1, Math.pow(inland, 0.8) * (0.4 + 1.15 * grain.data[i] / 255));
      /* south of ~36N the ramp skips its green band: the Libyan and Egyptian
         coast is desert, and a green Sahara is the one thing that would read
         as obviously wrong. */
      const lat = (bb.y1 - (i / 4 / PX | 0) / PY * H) / core.UNITS_PER_DEG;
      const arid = Math.min(1, Math.max(0, (36 - lat) / 5));
      const c = (255 * (h * (1 - arid) + (0.34 + 0.46 * h) * arid)) | 0;
      tint.data[i]     = LUT[c * 4];
      tint.data[i + 1] = LUT[c * 4 + 1];
      tint.data[i + 2] = LUT[c * 4 + 2];
      tint.data[i + 3] = 255;
      height.data[i] = height.data[i + 1] = height.data[i + 2] = h * 255;
    }
    relief.putImageData(height, 0, 0);        // the blurred mask becomes the bump map
    const colour = surface(PX, PY);
    colour.putImageData(tint, 0, 0);

    /* ExtrudeGeometry's top UVs are the shape's own world units, so one
       repeat/offset pair maps the whole atlas window onto one texture. */
    const texture = (canvas, srgb) => {
      const t = new THREE.CanvasTexture(canvas);
      t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
      t.repeat.set(1 / W, 1 / H);
      t.offset.set(-bb.x0 / W, -bb.y0 / H);
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      return t;
    };
    return { colour: texture(colour.canvas, true), relief: texture(relief.canvas, false) };
  }


  /* ---- land: one extruded shape per coastline ring, merged ---- */
  const LAND_DEPTH = 1.6;
  {
    const geoms = [];
    const bb = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    for (const ring of core.ATLAS) {
      const shape = new THREE.Shape();
      ring.forEach(([lon, lat], i) => {
        const p = core.lonLatToWorld(lon, lat);
        // Shape is 2D in XY; we rotate into XZ after extruding.
        i === 0 ? shape.moveTo(p.x, -p.z) : shape.lineTo(p.x, -p.z);
        bb.x0 = Math.min(bb.x0, p.x); bb.x1 = Math.max(bb.x1, p.x);
        bb.y0 = Math.min(bb.y0, -p.z); bb.y1 = Math.max(bb.y1, -p.z);
      });
      shape.closePath();
      try {
        geoms.push(new THREE.ExtrudeGeometry(shape, {
          depth: LAND_DEPTH, bevelEnabled: true, bevelSize: 0.35,
          bevelThickness: 0.35, bevelSegments: 1, curveSegments: 1,
        }));
      } catch { /* a degenerate ring cannot be triangulated; skip it */ }
    }

    const terrain = terrainMaps(bb);
    const land = new THREE.Mesh(
      mergeGeometries(geoms, false),
      new THREE.MeshStandardMaterial({ map: terrain.colour, bumpMap: terrain.relief,
                                       bumpScale: 2.4, roughness: 0.92, metalness: 0.0,
                                       flatShading: true }));
    window.__nostos.terrain = terrain;
    land.name = 'land';
    land.rotation.x = -Math.PI / 2;   // XY shape plane -> XZ ground plane
    scene.add(land);
    geoms.forEach(g => g.dispose());

    window.__nostos.triangles = land.geometry.index
      ? land.geometry.index.count / 3
      : land.geometry.attributes.position.count / 3;
  }


  /* ---- route: a Catmull-Rom curve drawn as travelling dots ---- */
  const curve = new THREE.CatmullRomCurve3(
    core.routeLonLats().map(([lon, lat]) => {
      const p = core.lonLatToWorld(lon, lat);
      return new THREE.Vector3(p.x, 2.2, p.z);
    }), false, 'catmullrom', 0.35);

  const DOTS = 900;
  {
    const dotPos = new Float32Array(DOTS * 3);
    curve.getSpacedPoints(DOTS - 1).forEach((p, i) => {
      dotPos[i * 3] = p.x; dotPos[i * 3 + 1] = p.y; dotPos[i * 3 + 2] = p.z;
    });
    const dotGeom = new THREE.BufferGeometry();
    dotGeom.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
    /* PointsMaterial has no per-point opacity, but it does multiply by a per-point
       colour. Under additive blending a brightness wave reads as the opacity wave
       the design asks for, and needs no custom shader. */
    dotGeom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(DOTS * 3), 3));

    function dotSprite() {
      const S = 64, c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      grad.addColorStop(0, 'rgba(255,236,200,1)');
      grad.addColorStop(1, 'rgba(255,236,200,0)');
      g.fillStyle = grad; g.fillRect(0, 0, S, S);
      return new THREE.CanvasTexture(c);
    }

    const route = new THREE.Points(dotGeom, new THREE.PointsMaterial({
      size: 4.2, map: dotSprite(), transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: 0xffb066, vertexColors: true,
    }));
    route.name = 'route';
    scene.add(route);

    /* travelling brightness wave, driven from the frame loop */
    const tint = dotGeom.attributes.color;
    const setWave = (t) => {
      for (let i = 0; i < DOTS; i++) {
        const phase = (i / DOTS) * 8 - t * 0.35;
        const w = 0.25 + 0.75 * Math.pow((Math.sin(phase * Math.PI * 2) + 1) / 2, 3);
        tint.array[i * 3] = tint.array[i * 3 + 1] = tint.array[i * 3 + 2] = w;
      }
      tint.needsUpdate = true;
    };
    setWave(0);                                  // static dots under reduced motion
    window.__nostos.animateRoute = setWave;
  }


  /* ---- markers ---- */
  const markerGeom = new THREE.SphereGeometry(2.6, 12, 8);

  /* a single halo, parked on the current marker. Seventeen copies of it cost
     8k triangles and only one is ever visible. */
  const halo = new THREE.Mesh(
    new THREE.TorusGeometry(4.4, 0.45, 8, 32),
    new THREE.MeshStandardMaterial({ color: 0xf4ecd8, emissive: 0x3a2a18, roughness: 0.6 }));
  halo.name = 'halo';
  halo.rotation.x = -Math.PI / 2;
  halo.visible = false;
  scene.add(halo);

  const markers = core.STOPS.map((s) => {
    const g = new THREE.Group();
    const p = core.lonLatToWorld(...core.markerLonLat(s));
    g.position.set(p.x, 3.2, p.z);
    g.name = `marker-${s.n}`;
    g.userData.stop = s.n;

    const bead = new THREE.Mesh(markerGeom, new THREE.MeshStandardMaterial({
      color: 0xb4451f, emissive: 0x5a1a06, roughness: 0.4, metalness: 0.15 }));
    bead.userData.stop = s.n;
    g.add(bead);

    scene.add(g);
    return g;
  });
  window.__nostos.markers = markers;
  window.__nostos.halo = halo;

  /* highlight — goToStop calls this */
  window.__nostos.highlightMarker = (n) => {
    markers.forEach((m) => {
      const on = m.userData.stop === n;
      m.children[0].material.emissiveIntensity = on ? 2.4 : 1.0;
      m.scale.setScalar(on ? 1.45 : 1.0);
      if (on) { halo.position.copy(m.position); halo.visible = true; }
    });
  };

  /* picking */
  window.__nostos.onMarkerPick = () => {};   // goToStop replaces this
  {
    const ray = new THREE.Raycaster();
    ray.params.Points.threshold = 3;
    renderer.domElement.addEventListener('pointerdown', (e) => {
      const r = renderer.domElement.getBoundingClientRect();
      ray.setFromCamera(new THREE.Vector2(
        ((e.clientX - r.left) / r.width) * 2 - 1,
        -((e.clientY - r.top) / r.height) * 2 + 1), camera);
      const hit = ray.intersectObjects(markers, true)[0];
      if (hit) {
        let o = hit.object;
        while (o && o.userData.stop === undefined) o = o.parent;
        if (o) window.__nostos.onMarkerPick(o.userData.stop);
      }
    });
  }


  /* ---- navigation: one entry point ---- */
  const journalEl = document.getElementById('entry');
  const railEl = document.getElementById('rail');
  const prevEl = document.getElementById('prev');
  const nextEl = document.getElementById('next');

  railEl.innerHTML = core.railSegments().map(seg => {
    const years = seg.yearFrom === seg.yearTo
      ? `year ${seg.yearFrom}` : `years ${seg.yearFrom}–${seg.yearTo}`;
    const label = `${seg.numeral}. ${seg.name} — ${years}`;
    return `<button type="button" data-stop="${seg.n}" style="width:${seg.widthPct}%"
      title="${label}" aria-label="${label}">${seg.widthPct > 8 ? seg.name : ''}</button>`;
  }).join('');

  let flight = null;
  const FLIGHT_MS = 1400;
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function goToStop(n) {
    const s = core.STOPS.find(x => x.n === n);
    if (!s) return;

    const fromStop = window.__nostos.current;      // read before overwriting
    window.__nostos.moveShipTo?.(n, fromStop !== undefined);
    window.__nostos.current = n;

    journalEl.innerHTML = core.renderEntry(s);
    document.getElementById('journal').scrollTop = 0;

    railEl.querySelectorAll('button').forEach(b => {
      const on = Number(b.dataset.stop) === n;
      b.setAttribute('aria-current', String(on));
      if (on && railEl.scrollWidth - railEl.clientWidth > 8) {
        b.scrollIntoView({ inline: 'center', block: 'nearest',
                           behavior: reducedMotion ? 'auto' : 'smooth' });
      }
    });
    prevEl.disabled = n === 1;
    nextEl.disabled = n === core.STOPS.length;

    window.__nostos.highlightMarker(n);

    const p = core.lonLatToWorld(...core.markerLonLat(s));
    const target = new THREE.Vector3(p.x, 0, p.z);
    const k = Math.min(Math.max(1.5 / camera.aspect, 1), 1.7);  // pull back when narrow

    /* Crowded stops need a closer camera or they collide on screen: Scylla and
       Charybdis are ~18km apart, which is 5px at the standard distance. Only the
       genuinely tight pairs tighten; everything else keeps the basin framing. */
    const nearest = Math.min(...core.STOPS.filter(x => x.n !== n).map(o => {
      const q = core.lonLatToWorld(...core.markerLonLat(o));
      return Math.hypot(q.x - p.x, q.z - p.z);
    }));
    const zoom = Math.min(Math.max(nearest / 10, 0.28), 1);

    const eye = new THREE.Vector3(p.x - 58 * k * zoom, 196 * k * zoom, p.z + 168 * k * zoom);
    if (reducedMotion) {
      controls.target.copy(target); camera.position.copy(eye); controls.update();
      flight = null;
    } else {
      flight = { t0: performance.now(),
                 fromT: controls.target.clone(), toT: target,
                 fromP: camera.position.clone(), toP: eye };
    }
  }

  window.__nostos.goToStop = goToStop;
  window.__nostos.onMarkerPick = goToStop;

  prevEl.addEventListener('click', () => goToStop(window.__nostos.current - 1));
  nextEl.addEventListener('click', () => goToStop(window.__nostos.current + 1));
  railEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-stop]');
    if (b) goToStop(Number(b.dataset.stop));
  });
  addEventListener('keydown', (e) => {
    /* e.target is not always an Element — a key pressed with focus on the document
       or the window has no matches(), and calling it there throws */
    if (e.target instanceof Element && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goToStop(window.__nostos.current + 1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goToStop(window.__nostos.current - 1); }
  });


  /* ---- ship: a small procedural galley ---- */
  function buildShip() {
    const g = new THREE.Group();
    const hullMat = new THREE.MeshStandardMaterial({ color: 0x3d2415, roughness: 0.8 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0xb4451f, roughness: 0.6 });
    const sailMat = new THREE.MeshStandardMaterial({ color: 0xf4ecd8, roughness: 0.9,
      side: THREE.DoubleSide });

    const hull = new THREE.Mesh(new THREE.CapsuleGeometry(1.5, 7.5, 4, 12), hullMat);
    hull.rotation.z = Math.PI / 2;
    hull.scale.set(1, 1, 0.55);
    g.add(hull);

    const prow = new THREE.Mesh(new THREE.ConeGeometry(1.2, 3.2, 8), trimMat);
    prow.position.set(5.6, 0.7, 0);
    prow.rotation.z = -Math.PI / 2.3;
    g.add(prow);

    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 9, 6), hullMat);
    mast.position.y = 4.4;
    g.add(mast);

    const sailMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 5.4), sailMat);
    sailMesh.position.set(0, 5.2, 0);
    g.add(sailMesh);

    for (let i = 0; i < 5; i++) {                 // oars, both sides
      for (const side of [-1, 1]) {
        const oar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4.2, 4), hullMat);
        oar.position.set(-3 + i * 1.6, -0.3, side * 1.3);
        oar.rotation.set(side * 0.5, 0, Math.PI / 2.6);
        g.add(oar);
      }
    }
    g.scale.setScalar(1.5);
    return g;
  }

  const ship = buildShip();
  ship.name = 'ship';
  scene.add(ship);
  window.__nostos.ship = ship;

  /* stop n maps to a fraction along the route curve */
  const stopU = new Map();
  {
    const pts = curve.getSpacedPoints(1200);
    for (const st of core.STOPS) {
      const p = core.lonLatToWorld(st.lon, st.lat);
      let best = 0, bestD = Infinity;
      pts.forEach((q, i) => {
        const d = (q.x - p.x) ** 2 + (q.z - p.z) ** 2;
        if (d < bestD) { bestD = d; best = i / (pts.length - 1); }
      });
      stopU.set(st.n, best);
    }
  }

  /* shipSail, not sail: the sail mesh above is a different thing */
  let shipSail = null;
  const SAIL_MS = 1400;

  function moveShipTo(n, animate) {
    const to = stopU.get(n);
    if (to === undefined) return;
    const place = (u) => {
      const uu = Math.min(Math.max(u, 0), 1);
      const p = curve.getPointAt(uu);
      const t = curve.getTangentAt(uu);
      ship.position.set(p.x, 3.4, p.z);
      ship.rotation.y = Math.atan2(t.x, t.z) - Math.PI / 2;
    };
    if (!animate || reducedMotion) { place(to); shipSail = null; return; }
    shipSail = { t0: performance.now(), from: stopU.get(window.__nostos.current) ?? to, to, place };
  }
  window.__nostos.moveShipTo = moveShipTo;


  /* ---- set pieces: original geometry, no traced source art ---- */
  const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
  const ROCK = 0x554233, STONE = 0xd8cbb0, EMBER = 0xff7a2f, PALE = 0xf4ecd8;

  const SETPIECES = {
    troy: () => {                                   // burning citadel and the fleet
      const g = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const w = new THREE.Mesh(new THREE.BoxGeometry(3.4, 4 + i % 2 * 2, 3.4), M(STONE));
        w.position.set((i - 2) * 4, 2 + (i % 2), (i % 2) * 3 - 1.5);
        g.add(w);
      }
      for (let i = 0; i < 7; i++) {                 // smoke column
        const q = new THREE.Mesh(new THREE.SphereGeometry(2.6 - i * 0.22, 7, 5),
          M(0x2a2320, { transparent: true, opacity: 0.34 - i * 0.035 }));
        q.position.set(Math.sin(i) * 2, 7 + i * 3.4, Math.cos(i) * 2);
        g.add(q);
      }
      return g;
    },
    cyclops: () => {                                // cave mouth, boulder, one eye
      const g = new THREE.Group();
      const cliff = new THREE.Mesh(new THREE.BoxGeometry(15, 13, 9), M(ROCK));
      cliff.position.y = 6.5; g.add(cliff);
      const mouth = new THREE.Mesh(new THREE.SphereGeometry(3.6, 12, 8,
        0, Math.PI * 2, 0, Math.PI / 2), M(0x11090a));
      mouth.position.set(0, 3.4, 4.6); mouth.rotation.x = Math.PI / 2; g.add(mouth);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.85, 10, 8),
        M(EMBER, { emissive: 0xff5a10, emissiveIntensity: 3 }));
      eye.position.set(0, 4.2, 5.4); g.add(eye);
      const boulder = new THREE.Mesh(new THREE.DodecahedronGeometry(3.4, 0), M(ROCK));
      boulder.position.set(8, 2.6, 5); g.add(boulder);
      return g;
    },
    aeolia: () => {                                 // wind vortex
      const g = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const r = new THREE.Mesh(new THREE.TorusGeometry(3 + i * 1.5, 0.3, 5, 18),
          M(0xbfd8e0, { transparent: true, opacity: 0.5 - i * 0.07,
                        emissive: 0x2a4a55, emissiveIntensity: 1.2 }));
        r.rotation.x = Math.PI / 2 + i * 0.16;
        r.position.y = 3 + i * 2.6;
        g.add(r);
      }
      return g;
    },
    lamos: () => {                                  // jagged cliffs around a narrow mouth
      const g = new THREE.Group();
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 1.6 + 0.7;
        const c = new THREE.Mesh(new THREE.ConeGeometry(2.6, 9 + (i % 3) * 3, 5), M(ROCK));
        c.position.set(Math.cos(a) * 13, 4.5, Math.sin(a) * 13);
        g.add(c);
      }
      return g;
    },
    aeaea: () => {                                  // Circe's colonnade
      const g = new THREE.Group();
      for (let i = 0; i < 8; i++) {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.85, 9, 10), M(STONE));
        c.position.set((i % 4) * 4 - 6, 4.5, i < 4 ? -3 : 3);
        g.add(c);
      }
      const roof = new THREE.Mesh(new THREE.BoxGeometry(18, 0.9, 9), M(PALE));
      roof.position.y = 9.4; g.add(roof);
      return g;
    },
    underworld: () => {                             // a rift and cold light
      const g = new THREE.Group();
      const rift = new THREE.Mesh(new THREE.CircleGeometry(7.5, 28), M(0x07080d));
      rift.rotation.x = -Math.PI / 2; rift.position.y = 0.6; g.add(rift);
      for (let i = 0; i < 4; i++) {
        const halo = new THREE.Mesh(new THREE.TorusGeometry(7.5 - i * 1.5, 0.22, 5, 20),
          M(0x7fa6c8, { emissive: 0x3f6a8f, emissiveIntensity: 2.2,
                        transparent: true, opacity: 0.6 - i * 0.1 }));
        halo.rotation.x = Math.PI / 2; halo.position.y = 0.9 + i * 1.6; g.add(halo);
      }
      return g;
    },
    sirens: () => {                                 // rock, two figures, sound rings
      const g = new THREE.Group();
      const rock = new THREE.Mesh(new THREE.ConeGeometry(6, 8, 7), M(ROCK));
      rock.position.y = 4; g.add(rock);
      for (const dx of [-1.6, 1.6]) {
        const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.6, 2.4, 3, 8), M(PALE));
        f.position.set(dx, 9.4, 0); g.add(f);
      }
      for (let i = 0; i < 3; i++) {
        const r = new THREE.Mesh(new THREE.TorusGeometry(7 + i * 3, 0.16, 4, 20),
          M(0xf0d9a0, { emissive: 0x8a6a26, emissiveIntensity: 1.6,
                        transparent: true, opacity: 0.45 - i * 0.11 }));
        r.rotation.x = Math.PI / 2; r.position.y = 8; g.add(r);
      }
      return g;
    },
    strait: () => {                                 // Scylla's cliff and Charybdis' funnel
      const g = new THREE.Group();
      /* the group is anchored on Scylla's marker; Charybdis' bead sits about
         (-3.2, +4.0) from it in world units after the nudges above */
      const cliff = new THREE.Mesh(new THREE.BoxGeometry(6, 13, 6), M(ROCK));
      cliff.position.set(0, 6.5, 0); g.add(cliff);
      for (let i = 0; i < 6; i++) {                 // six necks
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 6, 6), M(0x5d2b2b));
        neck.position.set(Math.sin(i) * 2, 13 + i * 0.4, Math.cos(i) * 2);
        neck.rotation.z = Math.sin(i) * 0.6; g.add(neck);
      }
      const funnel = new THREE.Mesh(new THREE.ConeGeometry(4.6, 9, 22, 1, true),
        M(0x11454f, { side: THREE.DoubleSide, transparent: true, opacity: 0.72 }));
      funnel.position.set(-3.2, -4, 4.0); g.add(funnel);
      funnel.name = 'vortex';
      return g;
    },
    thrinacia: () => {                              // cattle and a sun disc
      const g = new THREE.Group();
      for (let i = 0; i < 6; i++) {
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(1.1, 2.6, 3, 8), M(0xe0d2b4));
        body.rotation.z = Math.PI / 2;
        body.position.set((i % 3) * 5 - 5, 1.8, i < 3 ? -3.5 : 3.5);
        g.add(body);
      }
      const sun = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 8),
        M(0xf7c473, { emissive: 0xffa733, emissiveIntensity: 1.1 }));
      sun.position.set(0, 14, -6); g.add(sun);
      const corona = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.14, 4, 22),
        M(0xffcf6a, { emissive: 0xffa733, emissiveIntensity: 1.4,
                      transparent: true, opacity: 0.5 }));
      corona.position.copy(sun.position);
      corona.rotation.x = -Math.PI / 2.6; g.add(corona);
      return g;
    },
    ogygia: () => {                                 // one island, one cypress
      const g = new THREE.Group();
      const isle = new THREE.Mesh(new THREE.SphereGeometry(7, 16, 8,
        0, Math.PI * 2, 0, Math.PI / 2), M(0xd9c9a4));
      isle.scale.y = 0.42; g.add(isle);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 5, 7), M(0x4a3520));
      trunk.position.y = 4.5; g.add(trunk);
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.9, 9, 9), M(0x2f4a2c));
      crown.position.y = 10.5; g.add(crown);
      return g;
    },
    ithaca: () => {                                 // a lit palace and an olive tree
      const g = new THREE.Group();
      const hall = new THREE.Mesh(new THREE.BoxGeometry(13, 6.5, 9), M(STONE));
      hall.position.y = 3.4; g.add(hall);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(9.5, 4.4, 4), M(0x8f4a2a));
      roof.position.y = 8.6; roof.rotation.y = Math.PI / 4; g.add(roof);
      for (const dx of [-3.2, 0, 3.2]) {
        const win = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.2),
          M(0xffcf6a, { emissive: 0xffb04a, emissiveIntensity: 3 }));
        win.position.set(dx, 3.6, 4.55); g.add(win);
      }
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.85, 5, 8), M(0x4a3520));
      trunk.position.set(10, 2.5, 2); g.add(trunk);
      const crown = new THREE.Mesh(new THREE.SphereGeometry(3.4, 12, 8), M(0x5c6b3a));
      crown.position.set(10, 6.6, 2); crown.scale.y = 0.75; g.add(crown);
      return g;
    },
  };

  const setpieces = {};
  for (const st of core.STOPS) {
    if (!st.setpiece || setpieces[st.setpiece]) continue;
    const build = SETPIECES[st.setpiece];
    if (!build) { console.warn(`no builder for setpiece "${st.setpiece}"`); continue; }
    const obj = build();
    const p = core.lonLatToWorld(...core.markerLonLat(st));
    obj.position.set(p.x, 0, p.z);
    obj.name = `setpiece-${st.setpiece}`;
    scene.add(obj);
    setpieces[st.setpiece] = obj;
  }
  window.__nostos.setpieces = setpieces;

  /* recount triangles now that the set pieces are in */
  {
    let tris = 0;
    scene.traverse(o => {
      if (!o.isMesh) return;
      const gg = o.geometry;
      tris += gg.index ? gg.index.count / 3 : gg.attributes.position.count / 3;
    });
    window.__nostos.triangles = tris;
  }

/* SCENE-EXTRA */

  /* THREE.Clock is deprecated in 0.185.1; performance.now() needs no addon.
     dt is clamped so a long hidden-tab pause cannot jump the animations. */
  const T0 = performance.now();
  let tPrev = T0;
  function frame() {
    if (document.hidden) return;                 // paused; resumed below
    const tNow = performance.now();
    const dt = Math.min((tNow - tPrev) / 1000, 0.1);
    const time = (tNow - T0) / 1000;
    tPrev = tNow;
    if (!reducedMotion) { seaMap.offset.x += dt * 0.004; controls.update(); }
    if (!reducedMotion) window.__nostos.animateRoute?.(time);
    if (!reducedMotion) {
      const v = setpieces.strait?.getObjectByName('vortex');
      if (v) v.rotation.y = time * 1.6;
    }
    if (shipSail) {
      const k = easeInOut(Math.min((performance.now() - shipSail.t0) / SAIL_MS, 1));
      shipSail.place(shipSail.from + (shipSail.to - shipSail.from) * k);
      if (k === 1) shipSail = null;
    }
    if (flight) {
      const k = easeInOut(Math.min((performance.now() - flight.t0) / FLIGHT_MS, 1));
      controls.target.lerpVectors(flight.fromT, flight.toT, k);
      camera.position.lerpVectors(flight.fromP, flight.toP, k);
      if (k === 1) flight = null;
    }
/* FRAME-EXTRA */
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { tPrev = performance.now(); frame(); }
  });
  frame();

  document.getElementById('fallback').innerHTML = core.renderFallback();
  document.getElementById('route-note').textContent = core.ROUTE_NOTE;
  document.getElementById('credit').innerHTML =
    `${core.ATTRIBUTION.text} <a href="${core.ATTRIBUTION.href}" target="_blank" ` +
    `rel="noopener noreferrer">Source map</a> (${core.ATTRIBUTION.licence}). ` +
    `Coastlines from Natural Earth (public domain).`;

  moveShipTo(1, false);
  goToStop(1);

  /* ?selftest=1 — banner plus console table */
  if (new URLSearchParams(location.search).has('selftest')) {
    const r = core.selftest(Object.keys(setpieces));
    const el = document.createElement('div');
    el.id = 'selftest';
    el.style.background = r.pass ? '#123d1e' : '#4d1218';
    el.style.color = '#f4ecd8';
    el.textContent = `SELFTEST ${r.pass ? 'PASS' : 'FAIL'}\n` +
      r.results.map(x => `${x.ok ? '  ok  ' : ' FAIL '} ${x.name} — ${x.detail}`).join('\n');
    document.body.appendChild(el);
    console.table(r.results);
  }

/* SCENE-TAIL */
}

</script>

</body>
</html>
