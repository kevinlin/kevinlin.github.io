<meta name="description" content="A navigable 3D map of the seventeen stops of Odysseus' ten-year voyage home, with an encyclopedic entry per stop and a year rail showing that seven of the ten years pass on Ogygia alone.">
<title>Nostos — Odysseus' Ten-Year Journey Home</title>

<style>
/* ===================== TOKENS =====================
   Greek black-figure: terracotta, black, bone, with the source map's teal and
   dark red. Palette values live here only; components reference semantic names. */
:root {
  /* raw palette */
  --ink:        #14100d;
  --ink-2:      #1c1410;
  --parch:      #e8dcc0;
  --bone:       #f4ecd8;
  --terra:      #b4451f;
  --terra-lit:  #f2a468;
  --teal:       #1d6f7e;
  --wine:       #7d2230;

  /* semantic */
  --bg:            var(--ink);
  --fg:            var(--bone);
  --fg-muted:      #cfc3ab;
  --fg-subtle:     #a99c85;
  --accent:        var(--terra);
  --accent-fg:     #fff8ec;
  --link:          var(--terra-lit);
  --panel:         rgba(20, 15, 12, 0.94);
  --panel-edge:    rgba(244, 236, 216, 0.14);
  --ring:          var(--terra-lit);

  /* type */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Palatino LT STD", Georgia, serif;
  --font-body:    "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-mono:    ui-monospace, "SF Mono", Menlo, monospace;

  /* space — 4px scale */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

  /* radius, concentric: outer = inner + padding */
  --r-sm: 3px; --r-md: 6px;

  /* motion */
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  /* layers */
  --z-stage: 0; --z-labels: 10; --z-tucked: 15; --z-rail: 20; --z-panel: 30; --z-nav: 40; --z-selftest: 99;

  /* the rail owns the bottom strip; the panel and the credit sit above it */
  --rail-h: 4.25rem;
}

* { box-sizing: border-box; }

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 var(--font-body);
}

h1, h2, h3 { text-wrap: balance; }
p, li { text-wrap: pretty; }

/* the 3D stage fills the viewport; UI floats over it */
#stage { position: fixed; inset: 0; z-index: var(--z-stage); }
#stage canvas { display: block; }

/* a low vignette so the UI edges read against bright sea */
#stage::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 45%, rgba(8,6,5,.55) 100%);
}

/* focus is never removed, only restyled */
:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: var(--r-sm); }

/* skip link: first focusable, hidden until focused */
.skip {
  position: fixed; top: var(--s-2); left: var(--s-2); z-index: 200;
  padding: var(--s-2) var(--s-4);
  background: var(--panel); color: var(--fg);
  border: 1px solid var(--panel-edge); border-radius: var(--r-md);
  transform: translateY(-200%);
}
.skip:focus { transform: none; }

/* no-WebGL / no-JS fallback */
#fallback { display: none; }
.no-webgl #stage, .no-webgl #journal, .no-webgl #rail,
.no-webgl #nav, .no-webgl #credit, .no-webgl #flow-legend { display: none; }
.no-webgl #fallback { display: block; }

#fallback {
  max-width: 68ch;
  margin: 0 auto;
  padding: var(--s-7) var(--s-5) var(--s-8);
}
#fallback h1 {
  font-family: var(--font-display);
  font-variant: small-caps; letter-spacing: .04em;
  font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15;
  margin: 0 0 var(--s-5);
}
#fallback .note, #fallback .credit {
  color: var(--fg-subtle); font-size: .9rem;
  border-left: 2px solid var(--wine); padding-left: var(--s-4);
}
#fallback .fallback-list { list-style: none; margin: var(--s-7) 0; padding: 0; }
#fallback .fallback-list > li { margin: 0 0 var(--s-7); }

noscript .nojs {
  display: block; max-width: 68ch; margin: 0 auto; padding: var(--s-7) var(--s-5);
  color: var(--fg-muted);
}

/* ===================== JOURNAL PANEL ===================== */
#journal {
  position: fixed; top: 0; left: 0; z-index: var(--z-panel);
  width: min(30rem, 34vw); height: calc(100% - var(--rail-h));
  overflow-y: auto; overscroll-behavior: contain;
  padding: var(--s-7) var(--s-6) var(--s-7);
  background:
    linear-gradient(100deg, rgba(20,15,12,.97) 0%, rgba(20,15,12,.90) 70%, rgba(20,15,12,.80) 100%);
  /* layered shadow, not a border: reads as depth over the moving map */
  box-shadow:
    1px 0 1px rgba(0,0,0,.20),
    3px 0 8px rgba(0,0,0,.18),
    12px 0 40px rgba(0,0,0,.30);
  transition: transform 420ms var(--ease-in-out);
}

/* Tucked away after a spell of inactivity: the panel is the only thing covering
   the map. A strip stays behind to grab, and the gilt edge rides with it, so
   there is always something visible to bring the journal back. */
body.journal-away #journal {
  transform: translateX(calc(-100% + 14px));
  /* the tucked sheet overhangs the rail on narrow screens, so it drops below it
     while away — the strip that stays visible sits above the rail either way */
  z-index: var(--z-tucked);
}

/* collapse by hand: the same tuck the idle timer performs, on demand. Fixed
   rather than in flow so a long entry cannot scroll it out of reach; it is
   hidden while tucked, which is also why its position needs no away-state
   variant. */
#collapse {
  position: fixed; top: var(--s-4); left: calc(min(30rem, 34vw) - 2.75rem);
  width: 2.25rem; height: 2.25rem; display: grid; place-items: center;
  font: inherit; font-size: 1.375rem; line-height: 1;
  color: var(--fg-subtle); cursor: pointer;
  background: rgba(20,15,12,.92);
  border: 1px solid rgba(244,236,216,.22);
  border-radius: var(--r-md);
  transition: opacity 200ms var(--ease-out), color 120ms var(--ease-out),
              border-color 120ms var(--ease-out);
}
#collapse span { display: block; }
@media (hover: hover) and (pointer: fine) {
  #collapse:hover { color: var(--fg); border-color: rgba(242,164,104,.55); }
}
body.journal-away #collapse { opacity: 0; pointer-events: none; }

/* hairline highlight along the panel edge, the way gilt edges catch light */
#journal::after {
  content: ""; position: fixed; top: 0; bottom: var(--rail-h);
  left: min(30rem, 34vw); width: 1px;
  background: linear-gradient(180deg, transparent, rgba(242,164,104,.30) 35%, transparent);
  pointer-events: none;
}

.entry { max-width: 62ch; }

.entry .eyebrow {
  display: flex; gap: var(--s-4); align-items: baseline;
  margin: 0 0 var(--s-2);
}
.entry .numeral {
  font-family: var(--font-display);
  font-size: 2rem; line-height: 1;
  color: var(--terra-lit);
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}
.entry .year {
  font-size: .8125rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--fg-subtle);
}

.entry h2 {
  margin: 0 0 var(--s-3);
  font-family: var(--font-display);
  font-size: clamp(2rem, 3.4vw, 2.75rem); line-height: 1.08;
  font-variant: small-caps; letter-spacing: .035em;
  color: var(--fg);
}

.entry .event {
  margin: 0 0 var(--s-5); padding-bottom: var(--s-5);
  font-size: 1.0625rem; font-style: italic; color: var(--fg-muted);
  border-bottom: 1px solid rgba(244,236,216,.12);
}

.entry .prose { margin: 0 0 var(--s-5); color: #efe6d2; }

.entry .prov {
  margin: 0 0 var(--s-5); padding-left: var(--s-4);
  border-left: 2px solid var(--wine);
  font-size: .875rem; color: var(--fg-muted);
}

.entry .links {
  display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5);
  margin: var(--s-6) 0 0;
  font-size: .875rem; letter-spacing: .06em; font-variant: small-caps;
}

#journal a, #fallback a {
  color: var(--link);
  text-decoration-thickness: 1px; text-underline-offset: .22em;
  text-decoration-color: rgba(242,164,104,.45);
  transition: text-decoration-color 120ms var(--ease-out), color 120ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  #journal a:hover, #fallback a:hover, #credit a:hover {
    color: #ffc59a; text-decoration-color: currentColor;
  }
}

/* stop switching happens tens of times a session, so the entry gets one short
   fade-and-rise and nothing more */
.entry { animation: entryIn 180ms var(--ease-out) both; }
.entry h2       { animation: entryIn 220ms var(--ease-out) 40ms both; }
.entry .prose   { animation: entryIn 240ms var(--ease-out) 70ms both; }
@keyframes entryIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

@media (max-width: 768px) {
  #journal {
    width: 100%; height: 52vh; top: auto; bottom: var(--rail-h);
    padding: var(--s-5) var(--s-5) var(--s-6);
    box-shadow: 0 -1px 1px rgba(0,0,0,.2), 0 -8px 32px rgba(0,0,0,.35);
    /* the desktop panel is translucent because it sits over dark sea; the bottom
       sheet sits over bright parchment, where translucency wrecks the prose */
    background: #16110e;
  }
  #rail button { padding-top: var(--s-3); }
  #journal::after {
    left: 0; right: 0; top: auto; bottom: calc(52vh + var(--rail-h)); width: auto; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(242,164,104,.30) 40%, transparent);
  }
  /* thumb-sized on touch, and the chevron turns to point the way the sheet goes */
  #collapse {
    top: auto; bottom: calc(52vh + var(--rail-h) - 3.25rem);
    left: auto; right: var(--s-4);
    width: 2.75rem; height: 2.75rem;
  }
  #collapse span { transform: rotate(-90deg); }

  /* the bottom sheet tucks downwards. It is taller than the gap above the rail,
     so the tucked remainder ends up behind the rail, whose background is
     translucent — the entry heading would show through it. Solid while away. */
  body.journal-away #journal { transform: translateY(calc(100% - 14px)); }
  body.journal-away #rail { background: linear-gradient(180deg, #100c0a, #0c0907); }
  .entry h2 { font-size: 2rem; }
}

@media (prefers-reduced-motion: reduce) {
  .entry, .entry h2, .entry .prose { animation: none; }
  #journal { transition: none; }
  #collapse { transition: none; }
}

/* ===================== MAP LABELS ===================== */
/* Names drawn over the canvas as DOM rather than baked into the relief, so they
   stay crisp at every zoom and cost one transform each per frame. Which names
   fit is decided in scene code; this only says how they look. */
#labels { position: fixed; inset: 0; z-index: var(--z-labels); pointer-events: none; }
#labels span {
  position: absolute; top: 0; left: 0; opacity: 0; white-space: nowrap;
  /* the cartographer's halo: the map underneath is teal in places and pale
     parchment in others, and this reads on both */
  text-shadow: 0 1px 2px rgba(10,7,6,.9), 0 0 8px rgba(10,7,6,.7);
  transition: opacity 160ms var(--ease-out), color 160ms var(--ease-out);
}
#labels .sea {
  font-size: .6875rem; letter-spacing: .24em; text-transform: uppercase;
  color: rgba(244,236,216,.72);
}
#labels .stop {
  font-size: .875rem; letter-spacing: .05em; font-variant: small-caps;
  color: var(--bone);
}
#labels .stop.on { color: var(--terra-lit); }
@media (prefers-reduced-motion: reduce) { #labels span { transition: none; } }

/* ===================== FLOW LEGEND ===================== */
/* Two swatches above the rail's caption. The full note lives in the panel; this
   only has to say which mark is which while the reader is looking at the map. */
#flow-legend {
  position: fixed; right: var(--s-4);
  /* clears one 44px row of #nav, which only wraps below the width this is hidden at */
  bottom: calc(var(--rail-h) + var(--s-3) + 44px + var(--s-2));
  z-index: var(--z-nav); pointer-events: none;
  padding: var(--s-2) var(--s-3);
  border-radius: var(--r-sm);
  background: rgba(10,7,6,.88);
  font-size: .6875rem; line-height: 1.5; color: var(--fg-muted);
}
#flow-legend[hidden] { display: none; }
#flow-legend p { margin: 0; display: flex; align-items: center; gap: var(--s-2); }
#flow-legend .sw { width: 22px; height: 4px; border-radius: 2px; flex: 0 0 auto; }
#flow-legend .sw-wind { background: #ffffff; }
#flow-legend .sw-cur  { background: #60c4f7; }

/* the bottom sheet covers this corner; the panel's own note carries it there */
@media (max-width: 768px) { #flow-legend { display: none; } }

/* ===================== YEAR RAIL + NAV ===================== */
#rail {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-rail);
  display: flex; height: var(--rail-h);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(244,236,216,.22) transparent;
  background: linear-gradient(180deg, rgba(12,9,7,.86), rgba(12,9,7,.96));
  box-shadow: 0 -1px 0 rgba(244,236,216,.16), 0 -6px 22px rgba(0,0,0,.35);
}

/* the rail's own label, so the proportions are readable as data and not just
   as a control strip */
#rail::before {
  content: "Years elapsed (approximate)";
  position: fixed; left: var(--s-4); bottom: calc(var(--rail-h) + var(--s-2));
  padding: 3px var(--s-2);
  border-radius: var(--r-sm);
  background: rgba(10,7,6,.88);          /* the panel behind is translucent, so the
                                            caption carries its own contrast */
  font-size: .6875rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--fg-muted);
}

#rail button {
  position: relative;
  /* min-width keeps every stop a 24px target; flex-shrink lets Ogygia and Aeaea
     give up the room, so the proportions survive without overflowing */
  flex: 0 1 auto; min-width: 24px;
  border: 0; border-right: 1px solid rgba(244,236,216,.14);
  background: transparent; color: var(--fg-muted);
  cursor: pointer; padding: var(--s-4) var(--s-1) var(--s-2);
  font: inherit; font-size: .75rem;
  font-variant: small-caps; letter-spacing: .06em;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  transition: background 140ms var(--ease-out), color 140ms var(--ease-out);
}
#rail button:last-child { border-right: 0; }

/* the tick that turns the strip into a timeline */
#rail button::before {
  content: ""; position: absolute; left: 0; bottom: 0; width: 1px; height: .55rem;
  background: rgba(244,236,216,.28);
}
/* a bead per stop, so the narrow segments are still something to aim at */
#rail button::after {
  content: ""; position: absolute; left: 50%; bottom: 1.05rem;
  width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
  background: rgba(242,164,104,.55);
}
#rail button[aria-current="true"]::after { background: var(--accent-fg); }

@media (hover: hover) and (pointer: fine) {
  #rail button:hover { background: rgba(180,69,31,.30); color: var(--fg); }
}
#rail button[aria-current="true"] {
  background: var(--accent); color: var(--accent-fg);
  box-shadow: inset 0 2px 0 var(--terra-lit);
}

#nav {
  position: fixed; right: var(--s-4); bottom: calc(var(--rail-h) + var(--s-3));
  z-index: var(--z-nav); display: flex; gap: var(--s-2);
  /* three buttons no longer fit on one row at 390px */
  flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - var(--s-6));
}
/* pressed state for the layer toggle: the map is showing what the button names */
#nav button[aria-pressed="true"] {
  background: rgba(29,111,126,.55); border-color: rgba(96,196,247,.60);
}
#nav button {
  font: inherit; font-size: .8125rem;
  font-variant: small-caps; letter-spacing: .10em;
  min-height: 44px; padding: var(--s-3) var(--s-5);
  color: var(--fg); cursor: pointer;
  background: rgba(20,15,12,.92);
  border: 1px solid rgba(244,236,216,.28);
  border-radius: var(--r-md);
  box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.25);
  transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out),
              transform 90ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  #nav button:not(:disabled):hover {
    background: rgba(38,26,20,.95); border-color: rgba(242,164,104,.55);
  }
}
#nav button:not(:disabled):active { transform: scale(.97); }
/* icon-only variant: a square target, so the toggle costs one button's width */
#nav button.icon { padding: 0; width: 44px; display: grid; place-items: center; }
#nav button:disabled { opacity: .35; cursor: default; }

@media (max-width: 768px) {
  #nav { bottom: calc(52vh + var(--rail-h) + var(--s-3)); right: var(--s-3); }
  /* no room for the rail's caption once the sheet sits directly above it */
  #rail::before { content: ""; }
  /* 17 x 24px does not fit in 390px, so the rail scrolls instead of collapsing */
  #rail button { flex-shrink: 0; }
}

@media (prefers-reduced-motion: reduce) {
  #rail button, #nav button { transition: none; }
  #nav button:not(:disabled):active { transform: none; }
}

/* ===================== SELFTEST BANNER ===================== */
#selftest {
  position: fixed; inset: 0 0 auto 0; z-index: var(--z-selftest);
  padding: var(--s-3) var(--s-5);
  font: 13px/1.6 var(--font-mono); white-space: pre;
  overflow: auto; max-height: 60vh;
  box-shadow: 0 4px 20px rgba(0,0,0,.45);
}

/* ===================== COLOPHON ===================== */
/* In flow at the foot of the entry, so the disclosures scroll with the prose
   rather than sitting over it. */
#colophon {
  margin: var(--s-7) calc(var(--s-6) * -1) calc(var(--s-7) * -1);
  padding: var(--s-5) var(--s-6) var(--s-4);
  border-top: 1px solid rgba(244,236,216,.10);
}
.disc summary {
  cursor: pointer; list-style: none;
  font-size: .75rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--fg-subtle);
  padding: var(--s-2) 0;
  transition: color 120ms var(--ease-out);
}
.disc summary::-webkit-details-marker { display: none; }
.disc summary::before { content: "\25B8"; color: var(--terra-lit); padding-right: .5em;
  display: inline-block; transition: transform 140ms var(--ease-out); }
.disc[open] summary::before { transform: rotate(90deg); }
@media (hover: hover) and (pointer: fine) {
  .disc summary:hover { color: var(--fg); }
}
.note {
  margin: 0 0 var(--s-3); padding-left: var(--s-4);
  border-left: 2px solid var(--wine);
  font-size: .8125rem; line-height: 1.5; color: var(--fg-muted);
}
#credit {
  margin: 0; font-size: .6875rem; line-height: 1.45; color: var(--fg-subtle);
}
</style>
</head>
<body>

<a class="skip" href="#journal">Skip to the journal entry</a>
<div id="stage" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>
<main id="fallback" tabindex="-1"></main>
<aside id="journal" tabindex="-1" aria-label="Journal">
  <button id="collapse" type="button" aria-controls="journal" aria-expanded="true"
          aria-label="Collapse the journal"><span>&lsaquo;</span></button>
  <div id="entry" aria-live="polite" aria-atomic="true"></div>
  <footer id="colophon">
    <details id="about" class="disc">
      <summary>About this route</summary>
      <p id="route-note" class="note"></p>
    </details>
    <details id="about-flow" class="disc">
      <summary>Winds and currents</summary>
      <p id="flow-note" class="note"></p>
    </details>
    <p id="credit"></p>
  </footer>
</aside>
<div id="flow-legend">
  <p><i class="sw sw-wind"></i>Summer winds — Etesians, Mistral, Sirocco</p>
  <p><i class="sw sw-cur"></i>Surface currents — the basin turns counter-clockwise</p>
</div>
<nav id="nav" aria-label="Voyage navigation">
  <button id="flow" type="button" aria-pressed="true" class="icon"
          aria-label="Winds &amp; currents" title="Winds &amp; currents">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M2 8h13a3 3 0 1 0-3-3"/>
      <path d="M2 16h9a3 3 0 1 1-3 3"/>
      <path d="M2 12h18"/>
    </svg>
  </button>
  <button id="reset" type="button" class="icon"
          aria-label="Reset the view" title="Reset zoom and angle">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
    </svg>
  </button>

/* ===================== PROJECTION ===================== */
/* Plate carree with a longitude correction. The source map is UNCORRECTED
   plate carree; we correct so landmasses hold their real proportions under a
   moving camera. Set LON_SCALE = 1.0 to match the source map exactly. */
export const LON_SCALE = Math.cos(38 * Math.PI / 180);
export const UNITS_PER_DEG = 10;

export function lonLatToWorld(lon, lat) {
  return { x: lon * LON_SCALE * UNITS_PER_DEG, y: 0, z: -lat * UNITS_PER_DEG };
}

export function worldToLonLat({ x, z }) {
  return { lon: x / (LON_SCALE * UNITS_PER_DEG), lat: -z / UNITS_PER_DEG };
}

/* Presentation-only marker offsets, in degrees. The data coordinates above stay
   authoritative — the route, the ship and the projection tests all use them. This
   moves only the clickable bead.

   Scylla and Charybdis are ~18km apart, which renders 5px apart: the beads are
   wider than the gap, so no camera distance separates them (zooming scales both).
   Design section 3 asks for them to be separated enough to be individually
   clickable, so each is pushed onto the shore it actually belongs to — Scylla to
   the Calabrian side, Charybdis to the Sicilian side off Punta del Faro. */
export const MARKER_NUDGE = {
  12: [ 0.20,  0.20],   // Scylla, northeast onto Calabria
  13: [-0.20, -0.20],   // Charybdis, southwest towards the Sicilian shore
};

export const markerLonLat = (s) => {
  const d = MARKER_NUDGE[s.n];
  return d ? [s.lon + d[0], s.lat + d[1]] : [s.lon, s.lat];
};

/* ===================== ROUTE ===================== */
/* Ray-casting point-in-polygon over the atlas rings. Used by the tests to prove
   no leg of the route crosses land, and by nothing at runtime. */
export function pointInLand([lon, lat]) {
  for (const ring of ATLAS) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > lat) !== (yj > lat) &&
          lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}

/* Densely interpolated points along a flow polyline, ~0.1 deg apart. The drawn
   ribbon is a Catmull-Rom through the same pairs and bows slightly off these
   chords, so the paths are placed with margin rather than to the pixel. */
export function flowSamples(path, step = 0.1) {
  const out = [];
  for (let i = 0; i < path.length - 1; i++) {
    const [x0, y0] = path[i], [x1, y1] = path[i + 1];
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
  }
  out.push(path[path.length - 1]);
  return out;
}

export function routeLonLats() {
  const out = [];
  STOPS.forEach((s, i) => {
    out.push([s.lon, s.lat]);
    const next = STOPS[i + 1];
    if (next) for (const p of VIA[`${s.n}-${next.n}`] ?? []) out.push(p);

  return out;
}


/* ===================== WINDS + CURRENTS ===================== */

   because the ancient sailing season was summer (mare clausum from roughly
   November) and because the Etesians only exist then.

   the Etesian system below — northerlies that blow mid-May to mid-September and
   whose strength is driven by the pressure gradient between the Azores/Balkan
   highs and the thermal low over southwest Asia, the same low that drives the
   South Asian summer monsoon. Stronger monsoon years give stronger Etesians.

   `path` is [lon, lat] west-to-east or upstream-to-downstream: the arrows point

/* ===================== YEAR RAIL ===================== */
/* Segment width is proportional to time spent, so the seven years on Ogygia take
   roughly 70% of the rail. Stops that occupy no measurable time still need to be
   clickable, so each gets a MIN_SHARE floor before normalisation.
   MIN_SHARE = 0.09 puts Ogygia at 71.9%. 0.06 puts it at 75.9% and fails the
   test; 0.12 passes at 68.2% and makes the single-year stops easier to hit. */
const MIN_SHARE = 0.09;   // in years

export function railSegments() {
  const raw = STOPS.map(s => Math.max(s.yearTo - s.yearFrom + 1 - 1, 0) || MIN_SHARE);
  const total = raw.reduce((a, b) => a + b, 0);
  return STOPS.map((s, i) => ({
    n: s.n, numeral: s.numeral, name: s.name,
    yearFrom: s.yearFrom, yearTo: s.yearTo,
    widthPct: (raw[i] / total) * 100,
  }));
}


/* ===================== SELFTEST ===================== */
const NUMERALS = ['I','II','III','IV','V','VI','VII','VIII','IX','X',
                  'XI','XII','XIII','XIV','XV','XVI','XVII'];

export function selftest(setpieceKeys = null) {
  const results = [];
  const check = (name, fn) => {
    try { const detail = fn(); results.push({ name, ok: detail === true, detail:
      detail === true ? 'ok' : String(detail) }); }
    catch (e) { results.push({ name, ok: false, detail: e.message }); }
  };

  check('stop count', () => STOPS.length === 17 || `got ${STOPS.length}`);
  check('numerals ordered', () => {
    const bad = STOPS.filter((s, i) => s.n !== i + 1 || s.numeral !== NUMERALS[i]);
    return bad.length === 0 || bad.map(s => s.name).join(', ');
  });
  check('links well-formed', () => {
    const bad = [];
    for (const s of STOPS) {
      for (const [k, host] of [['wikipedia', 'en.wikipedia.org'],
                               ['whe', 'www.worldhistory.org']]) {
        const u = new URL(s.links[k]);
        if (u.protocol !== 'https:' || u.host !== host) bad.push(`${s.name}.${k}`);
      }
    }
    return bad.length === 0 || bad.join(', ');
  });
  check('projection round-trip', () => {
    const bad = STOPS.filter(s => {
      const b = worldToLonLat(lonLatToWorld(s.lon, s.lat));
      return Math.abs(b.lon - s.lon) > 1e-9 || Math.abs(b.lat - s.lat) > 1e-9;
    });
    return bad.length === 0 || bad.map(s => s.name).join(', ');
  });
  check('rail widths', () => {
    const total = railSegments().reduce((a, s) => a + s.widthPct, 0);
    return Math.abs(total - 100) < 1e-6 || `sum ${total}`;
  });
  check('stops in bounds', () => {
    const bad = STOPS.filter(s => s.lon < -7 || s.lon > 42 || s.lat < 29 || s.lat > 48);
    return bad.length === 0 || bad.map(s => s.name).join(', ');
  });
  check('setpiece keys resolvable', () => {
    if (!setpieceKeys) return true;                       // Node run: nothing to resolve
    const bad = STOPS.filter(s => s.setpiece && !setpieceKeys.includes(s.setpiece));
    return bad.length === 0 || bad.map(s => s.setpiece).join(', ');
  });
  check('atlas present', () => ATLAS.length > 0 || 'atlas is empty');
  check('sea names in open water', () => {
    const dry = SEAS.filter(([, lon, lat]) => pointInLand([lon, lat]));
    return dry.length === 0 || dry.map(s => s[0]).join(', ');
  });
  check('current paths stay in open water', () => {
    const dry = CURRENTS.filter(c => flowSamples(c.path).some(pointInLand));
    return dry.length === 0 || dry.map(c => c.name).join(', ');
  });
  check('flow paths within map bounds', () => {
    const out = [...CURRENTS, ...WINDS].filter(f => f.path.some(
      ([lon, lat]) => lon < -7 || lon > 42 || lat < 29 || lat > 48));
    return out.length === 0 || out.map(f => f.name).join(', ');
  });
  check('flow speeds are positive', () => {
    const bad = [...CURRENTS, ...WINDS].filter(f => !(f.speed > 0));
    return bad.length === 0 || bad.map(f => f.name).join(', ');
  });
  check('map-derived stops in open water', () => {
    const dry = STOPS.filter(s => s.prov === 'map' && pointInLand([s.lon, s.lat]));
    return dry.length === 0 || dry.map(s => s.name).join(', ');
  });

  return { pass: results.every(r => r.ok), results };
}

/* ===================== STAGE =====================
   Renderer, camera, controls, light, and the viewport arithmetic that the
   camera framing and the label culler both depend on. */

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1b20);
scene.fog = new THREE.Fog(0x0d1b20, 520, 1700);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 4000);
const mid = core.lonLatToWorld(17, 39);
camera.position.set(mid.x, 340, mid.z + 300);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(mid.x, 0, mid.z);
controls.enableDamping = !reducedMotion;
controls.maxPolarAngle = Math.PI * 0.48;

onMotionTick(() => controls.update());          // damping only; the jump-cut path updates inline

scene.add(new THREE.HemisphereLight(0xbfd8e0, 0x3a2a18, 0.85));
const sun = new THREE.DirectionalLight(0xffe8c4, 1.25);
sun.position.set(-300, 400, 160);
scene.add(sun);

const RAIL_PX = 68;                       // --rail-h, 4.25rem
/* What the journal takes from the canvas: the left edge on wide screens, the
   bottom half on narrow ones. Centres the camera, and keeps labels out from
   under the panel. */
function uiInset() {
  const narrow = innerWidth <= 768;
  return { panelW: narrow ? 0 : Math.min(30 * 16, innerWidth * 0.34),
           covered: narrow ? innerHeight * 0.52 + RAIL_PX : RAIL_PX };
}
function frameVisibleArea() {
  const { panelW, covered } = uiInset();
  camera.setViewOffset(innerWidth, innerHeight,
                       -panelW / 2, covered / 2, innerWidth, innerHeight);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  frameVisibleArea();                     // calls updateProjectionMatrix
  renderer.setSize(innerWidth, innerHeight);
});
frameVisibleArea();

Object.assign(nostos, { scene, camera, renderer, controls });


/* ===================== LAYERS =====================
   One builder per layer, each returning the handles the layers after it need.
   They are called in dependency order at the bottom of this block, so the call
   list is the dependency graph; a builder used out of order fails loudly on the
   temporal dead zone rather than reading undefined. */

/* ---- sea: one plane, one procedurally drawn texture, no shader ----
   Sized to outrun the atlas in every direction so no plane edge is ever
   visible on the horizon. Two triangles; the size costs nothing. */
function buildSea() {
  const SEA_W = 1200, SEA_H = 900;
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#1d6f7e'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 9000; i++) {           // faint grain
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`;
    g.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  /* one line per tile edge: the repeat below then sets the spacing to 5 degrees.
     Subdividing inside the tile makes the grid read as noise, not as a graticule. */
  g.strokeStyle = 'rgba(240,236,216,0.13)';
  g.lineWidth = 2;
  g.strokeRect(0, 0, S, S);

  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(SEA_W / (5 * core.LON_SCALE * core.UNITS_PER_DEG),
                 SEA_H / (5 * core.UNITS_PER_DEG));   // a 5-degree graticule
  map.colorSpace = THREE.SRGBColorSpace;

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(SEA_W, SEA_H),
    new THREE.MeshStandardMaterial({ map, roughness: 0.72, metalness: 0.05 }));
  mesh.name = 'sea';
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(core.lonLatToWorld(17, 0).x, -0.35, core.lonLatToWorld(0, 39).z);
  scene.add(mesh);

  onMotionTick((dt) => { map.offset.x += dt * 0.004; });
  return { mesh, map };
}

/* ---- land: one extruded shape per coastline ring, merged, wearing the relief ---- */
function buildLand() {
  const LAND_DEPTH = 1.6;
  const geoms = [];
  for (const ring of core.ATLAS) {
    const shape = new THREE.Shape();
    ring.forEach(([lon, lat], i) => {
      const p = core.lonLatToWorld(lon, lat);
      // Shape is 2D in XY; we rotate into XZ after extruding.
      i === 0 ? shape.moveTo(p.x, -p.z) : shape.lineTo(p.x, -p.z);
    });
    shape.closePath();
    try {
      geoms.push(new THREE.ExtrudeGeometry(shape, {
        depth: LAND_DEPTH, bevelEnabled: true, bevelSize: 0.35,
        bevelThickness: 0.35, bevelSegments: 1, curveSegments: 1,
      }));
    } catch { /* a degenerate ring cannot be triangulated; skip it */ }
  }

  /* ExtrudeGeometry's top UVs are the shape's own world units, so one
     repeat/offset pair drops the relief onto the whole atlas at once. */
  const U = core.UNITS_PER_DEG, S = core.LON_SCALE;
  const x0 = RELIEF.lon0 * S * U, W = (RELIEF.lon1 - RELIEF.lon0) * S * U;
  const y0 = RELIEF.lat0 * U,     H = (RELIEF.lat1 - RELIEF.lat0) * U;
  const terrain = new THREE.TextureLoader().load(RELIEF.src);
  terrain.colorSpace = THREE.SRGBColorSpace;
  terrain.wrapS = terrain.wrapT = THREE.ClampToEdgeWrapping;
  terrain.anisotropy = renderer.capabilities.getMaxAnisotropy();
  terrain.repeat.set(1 / W, 1 / H);
  terrain.offset.set(-x0 / W, -y0 / H);

  const mesh = new THREE.Mesh(
    mergeGeometries(geoms, false),
    new THREE.MeshStandardMaterial({ map: terrain, color: 0xe0d3b4, roughness: 0.92,
                                     metalness: 0.0, flatShading: true }));
  mesh.name = 'land';
  mesh.rotation.x = -Math.PI / 2;   // XY shape plane -> XZ ground plane
  scene.add(mesh);
  geoms.forEach(g => g.dispose());

  nostos.terrain = terrain;
  return { mesh, terrain };
}

/* ---- route: a Catmull-Rom curve drawn as travelling dots ---- */
function buildRoute() {
  const curve = new THREE.CatmullRomCurve3(
    core.routeLonLats().map(([lon, lat]) => {
      const p = core.lonLatToWorld(lon, lat);
      return new THREE.Vector3(p.x, 2.2, p.z);
    }), false, 'catmullrom', 0.35);

  const DOTS = 900;
  const dotPos = new Float32Array(DOTS * 3);
  curve.getSpacedPoints(DOTS - 1).forEach((p, i) => {
    dotPos[i * 3] = p.x; dotPos[i * 3 + 1] = p.y; dotPos[i * 3 + 2] = p.z;
  });
  const dotGeom = new THREE.BufferGeometry();
  dotGeom.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
  /* PointsMaterial has no per-point opacity, but it does multiply by a per-point
     colour. Under additive blending a brightness wave reads as the opacity wave
     the design asks for, and needs no custom shader. */
  dotGeom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(DOTS * 3), 3));

  const S = 64, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grad.addColorStop(0, 'rgba(255,236,200,1)');
  grad.addColorStop(1, 'rgba(255,236,200,0)');
  g.fillStyle = grad; g.fillRect(0, 0, S, S);

  const points = new THREE.Points(dotGeom, new THREE.PointsMaterial({
    size: 4.2, map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, color: 0xffb066, vertexColors: true,
  }));
  points.name = 'route';
  scene.add(points);

  /* travelling brightness wave, driven from the frame loop */
  const tint = dotGeom.attributes.color;
  const animateRoute = (t) => {
    for (let i = 0; i < DOTS; i++) {
      const phase = (i / DOTS) * 8 - t * 0.35;
      const w = 0.25 + 0.75 * Math.pow((Math.sin(phase * Math.PI * 2) + 1) / 2, 3);
      tint.array[i * 3] = tint.array[i * 3 + 1] = tint.array[i * 3 + 2] = w;
    }
    tint.needsUpdate = true;
  };
  animateRoute(0);                            // static dots under reduced motion
  onMotionTick((dt, time) => animateRoute(time));

  nostos.animateRoute = animateRoute;
  return { curve, points };
}

/* ---- winds and currents: ribbons carrying a scrolling arrow texture ----
   One builder, two styles. Currents lie on the sea as blue bands; winds float
   above it as white darts, which is the honest arrangement (air over water)
   and also what keeps the two layers apart where they cross. Each ribbon is a
   triangle strip along a Catmull-Rom through the published path, textured with
   a repeating glyph whose offset advances at a rate set by that feature's real
   mean speed — so within a layer, relative pace is data.
   The two layers are NOT on a common scale: 22 cm/s of Algerian Current
   against 15 m/s of Mistral is 1:68, which would leave every current
   apparently frozen. Each layer gets its own base rate, and the panel note
   says so rather than letting the picture imply otherwise. */

/* World units per arrow glyph. The whole basin is only ~390 units wide, so
   these are small numbers: a 12-unit pitch puts about six chevrons along the
   Algerian Current. */
const TILE_CURRENT = 19, TILE_WIND = 6.5;

function arrowTexture(kind) {
  const W = 128, H = 32, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'current') {
    /* a continuous band, soft-edged across v so the ribbon has no hard rim,
       with a chevron riding it to carry direction */
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,   'rgba(38,120,175,0)');
    grad.addColorStop(0.5, 'rgba(96,196,247,0.52)');
    grad.addColorStop(1,   'rgba(38,120,175,0)');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(206,242,255,0.78)'; g.lineWidth = 3.5;
    g.beginPath();
    g.moveTo(W * .58, H * .18); g.lineTo(W * .76, H * .5); g.lineTo(W * .58, H * .82);
    g.stroke();
  } else {
    /* discrete darts: transparent between glyphs, so wind reads as arrows and
       not as a second band */
    g.strokeStyle = 'rgba(255,255,255,0.94)'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(W * .12, H * .5); g.lineTo(W * .60, H * .5); g.stroke();
    g.beginPath();
    g.moveTo(W * .48, H * .20); g.lineTo(W * .70, H * .5); g.lineTo(W * .48, H * .80);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* Colour lives in the canvas, not in the material, because additive blending
   would multiply a tint into an already-coloured glyph. */
function flowRibbon(path, y, width, tile, tex) {
  const spine = new THREE.CatmullRomCurve3(
    path.map(([lon, lat]) => {
      const p = core.lonLatToWorld(lon, lat);
      return new THREE.Vector3(p.x, y, p.z);
    }), false, 'catmullrom', 0.4);
  /* one segment per ~3.5 world units, floor 12 and cap 44: smooth for paths
     this gentle, and cheap enough to keep the whole layer inside the 50k
     triangle budget (the land alone is already 47k) */
  const N = Math.max(12, Math.min(44, Math.round(spine.getLength() / 3.5)));
  const pts = spine.getSpacedPoints(N - 1);

  const pos = new Float32Array(N * 6), uv = new Float32Array(N * 4);
  const col = new Float32Array(N * 6), idx = [];
  let run = 0;
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, N - 1)];
    const tx = b.x - a.x, tz = b.z - a.z, len = Math.hypot(tx, tz) || 1;
    const nx = (-tz / len) * width / 2, nz = (tx / len) * width / 2;
    if (i) run += p.distanceTo(pts[i - 1]);
    /* vertex-colour taper over the end eighth, so a ribbon fades out instead
       of being chopped off mid-band */
    const f = Math.min(1, Math.min(i, N - 1 - i) / (N * 0.08));
    for (const [k, s] of [[0, 1], [1, -1]]) {
      const v = i * 2 + k, o = v * 3;
      pos[o] = p.x + nx * s; pos[o + 1] = p.y; pos[o + 2] = p.z + nz * s;
      col[o] = col[o + 1] = col[o + 2] = f;
      uv[v * 2] = run / tile; uv[v * 2 + 1] = k;
    }
    if (i) idx.push((i - 1) * 2, (i - 1) * 2 + 1, i * 2,
                    (i - 1) * 2 + 1, i * 2 + 1, i * 2);
  }
  const gg = new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  gg.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  gg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  gg.setIndex(idx);
  return new THREE.Mesh(gg, new THREE.MeshBasicMaterial({
    map: tex, vertexColors: true, transparent: true, depthWrite: false,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  }));
}

function buildFlow() {
  const layer = new THREE.Group();
  layer.name = 'flow';
  const flows = [];              // { map, rate } — offsets advanced by the frame loop

  /* tiles per second per unit of published speed. Divisors chosen so the
     fastest feature in each layer drifts briskly rather than blurring: the
     Almeria-Oran Jet at 50 cm/s and the Mistral at 15 m/s both land near
     0.8 tiles/s. Texture.clone() shares the canvas and owns its own offset,
     which is what lets one glyph serve every ribbon at its own pace. */
  const CURRENT_DIV = 62, WIND_DIV = 18;
  const currentTex = arrowTexture('current'), windTex = arrowTexture('wind');
  for (const c of core.CURRENTS) {
    const m = flowRibbon(c.path, 0.7, 5.4, TILE_CURRENT, currentTex.clone());
    m.name = `current:${c.name}`;
    layer.add(m);
    flows.push({ map: m.material.map, rate: c.speed / CURRENT_DIV });
  }
  /* winds ride at y=10: clear of the 1.6-unit land extrusion and the route's
     dots at 2.2, low enough that the parallax against the ground plane stays
     small at basin zoom */
  for (const w of core.WINDS) {
    const m = flowRibbon(w.path, 10, 1.9, TILE_WIND, windTex.clone());
    m.name = `wind:${w.name}`;
    layer.add(m);
    flows.push({ map: m.material.map, rate: w.speed / WIND_DIV });
  }
  scene.add(layer);

  /* One button and one legend. The layer covers the whole basin, so it has to be
     dismissable; aria-pressed carries the state and the legend follows it. */
  const flowBtn = document.getElementById('flow');
  const flowLegend = document.getElementById('flow-legend');
  let flowOn = true;
  function setFlow(on) {
    flowOn = on;
    layer.visible = on;
    flowBtn.setAttribute('aria-pressed', String(on));
    flowLegend.hidden = !on;
  }
  flowBtn.addEventListener('click', () => setFlow(!flowOn));
  setFlow(true);

  onMotionTick((dt) => {          // still arrows under reduced motion
    if (!flowOn) return;
    for (const f of flows) f.map.offset.x -= dt * f.rate;
  });

  Object.assign(nostos, { flowLayer: layer, setFlow });
  return { layer, setFlow };
}

/* ---- markers and picking ----
   Map symbols lie ON the map rather than hovering over it. A bead floating at
   the model's midriff is what the standard stop framing puts you nose-to-nose
   with, so the symbol is a flat site ring at ground level instead: it reads as
   cartography, and the set piece it belongs to stays unobstructed. Rings draw
   with depth testing off, which is what keeps a stop findable and clickable
   even when its own set piece stands over the mark. */
function buildMarkers() {
  const RING_Y = 2.2;                       // clear of the extruded land top (1.95)
  const TERRA = 0xb4451f, PALE = 0xf4ecd8;
  const markerGeom = new THREE.RingGeometry(3.0, 3.4, 32);
  /* A hairline ring is a poor click target, so each marker carries a disc the
     size of the old bead that is never drawn. Raycaster ignores `visible`, so
     it costs a hit test and no draw call. */
  const pickGeom = new THREE.CircleGeometry(3.4, 12);
  /* Opacity below 1 is charged for: on this scene each transparent object costs
     a second draw call, so only the halo, which fades, pays it. */
  const flat = (geom, color, opacity = 1) => {
    const m = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({
      color, opacity, transparent: opacity < 1, side: THREE.DoubleSide,
      depthTest: false, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = 3;
    return m;
  };

  /* a single pulse ring, parked on the current marker. Seventeen copies of it
     cost 8k triangles and only one is ever visible. */
  const halo = flat(new THREE.RingGeometry(4.8, 5.1, 64), PALE, 0.85);
  halo.name = 'halo';
  halo.visible = false;
  scene.add(halo);

  /* The ping: the ring swells past the set piece and fades, so the current stop
     announces itself from underneath instead of covering anything. It rides
     userData.baseScale because keepApparentSize owns the scale outright. A
     motion tick, so under prefers-reduced-motion it stays one still ring. */
  onMotionTick((dt, time) => {
    const k = (time * 0.5) % 1;
    halo.userData.baseScale = 1 + k * 1.7;
    halo.material.opacity = 0.85 * (1 - k) ** 1.5;
  });

  const markers = core.STOPS.map((s) => {
    const g = new THREE.Group();
    const p = core.lonLatToWorld(...core.markerLonLat(s));
    g.position.set(p.x, RING_Y, p.z);
    g.name = `marker-${s.n}`;
    g.userData.stop = s.n;

    const ring = flat(markerGeom, TERRA);
    ring.userData.stop = s.n;
    g.add(ring);

    const pick = new THREE.Mesh(pickGeom, ring.material);
    pick.rotation.x = -Math.PI / 2;
    pick.visible = false;
    pick.userData.stop = s.n;
    g.add(pick);

    scene.add(g);
    return g;
  });

  /* goToStop calls this */
  const highlightMarker = (n) => {
    markers.forEach((m) => {
      const on = m.userData.stop === n;
      m.children[0].material.color.setHex(on ? PALE : TERRA);
      m.userData.baseScale = on ? 1.25 : 1.0;   // applied by keepApparentSize
      if (on) { halo.position.copy(m.position); halo.visible = true; }
    });
  };

  /* Picking is late-bound through the registry: the handler is goToStop, which
     is built after this layer because it needs the markers. */
  nostos.onMarkerPick = () => {};
  const ray = new THREE.Raycaster();
  ray.params.Points.threshold = 3;
  renderer.domElement.addEventListener('pointerdown', (e) => {
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2(
      ((e.clientX - r.left) / r.width) * 2 - 1,
      -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    const hit = ray.intersectObjects(markers, true)[0];
    if (hit) {
      let o = hit.object;
      while (o && o.userData.stop === undefined) o = o.parent;
      if (o) nostos.onMarkerPick(o.userData.stop);
    }
  });

  Object.assign(nostos, { markers, halo, highlightMarker });
  return { markers, halo, highlightMarker };
}

/* ---- ship: a small procedural galley sailing the route curve ---- */
function buildShip(curve) {
  const g = new THREE.Group();
  if (models.ship) g.add(models.ship);           // hull, prow, mast, yard, oars
  const sailMat = new THREE.MeshStandardMaterial({ color: 0xf4ecd8, roughness: 0.9,
    side: THREE.DoubleSide });
  const sailMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 5.4), sailMat);
  sailMesh.position.set(0, 5.2, 0);
  g.add(sailMesh);
  g.scale.setScalar(1.5);
  g.name = 'ship';
  scene.add(g);

  /* stop n maps to a fraction along the route curve */
  const stopU = new Map();
  {
    const pts = curve.getSpacedPoints(1200);
    for (const st of core.STOPS) {
      const p = core.lonLatToWorld(st.lon, st.lat);
      let best = 0, bestD = Infinity;
      pts.forEach((q, i) => {
        const d = (q.x - p.x) ** 2 + (q.z - p.z) ** 2;
        if (d < bestD) { bestD = d; best = i / (pts.length - 1); }
      });
      stopU.set(st.n, best);
    }
  }

  /* shipSail, not sail: the sail mesh above is a different thing */
  let shipSail = null;
  const SAIL_MS = 1400;

  /* The galley moored on the stop's own coordinate stood inside the set piece it
     had come to visit: two thirds of Scylla's cliff gone, the underworld's rift
     swallowed, a hull the length of Troy's citadel. It lies off the stop now,
     back along the course it has just sailed. Astern rather than abeam because
     the tangent is a direction the curve already carries; a fixed lateral offset
     would beach the ship on whichever side of the route the coast happens to be.
     Twenty units clears every set piece at the standard framing — measured, by
     hiding each one in turn and counting the pixels that change. */
  const STANDOFF = 20;

  function place(u) {
    const uu = Math.min(Math.max(u, 0), 1);
    const p = curve.getPointAt(uu);
    const t = curve.getTangentAt(uu);
    g.position.set(p.x - t.x * STANDOFF, 3.4, p.z - t.z * STANDOFF);
    g.rotation.y = Math.atan2(t.x, t.z) - Math.PI / 2;
  }

  function moveShipTo(n, animate) {
    const to = stopU.get(n);
    if (to === undefined) return;
    if (!animate || reducedMotion) { place(to); shipSail = null; return; }
    shipSail = { t0: performance.now(), from: stopU.get(nostos.current) ?? to, to };
  }

  onTick(() => {
    if (!shipSail) return;
    const k = easeInOut(Math.min((performance.now() - shipSail.t0) / SAIL_MS, 1));
    place(shipSail.from + (shipSail.to - shipSail.from) * k);
    if (k === 1) shipSail = null;
  });

  Object.assign(nostos, { ship: g, moveShipTo });
  return { ship: g, moveShipTo };
}

/* ---- set pieces: original geometry, no traced source art ----
   Each builder is (no args) => Object3D, positioned by the caller, so one can
   be written, swapped or deleted without touching anything else here. */
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
const ROCK = 0x554233, STONE = 0xd8cbb0, EMBER = 0xff7a2f, PALE = 0xf4ecd8;

const SETPIECES = {
  troy: () => {                                   // citadel from Blender, smoke in code
    const g = new THREE.Group();
    if (models.troy) g.add(models.troy);
    for (let i = 0; i < 7; i++) {                 // smoke column
      const q = new THREE.Mesh(new THREE.SphereGeometry(2.6 - i * 0.22, 7, 5),
        M(0x2a2320, { transparent: true, opacity: 0.34 - i * 0.035 }));
      q.position.set(Math.sin(i) * 2, 7 + i * 3.4, Math.cos(i) * 2);
      g.add(q);
    }
    return g;
  },
  cyclops: () => {                                // cave mouth, boulder, one eye
    const g = new THREE.Group();
    if (models.cyclops) g.add(models.cyclops);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.85, 10, 8),
      M(EMBER, { emissive: 0xff5a10, emissiveIntensity: 3 }));
    eye.position.set(0, 4.2, 5.4); g.add(eye);
    return g;
  },
  aeolia: () => {                                 // wind vortex
    const g = new THREE.Group();
    for (let i = 0; i < 5; i++) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(3 + i * 1.5, 0.3, 5, 18),
        M(0xbfd8e0, { transparent: true, opacity: 0.5 - i * 0.07,
                      emissive: 0x2a4a55, emissiveIntensity: 1.2 }));
      r.rotation.x = Math.PI / 2 + i * 0.16;
      r.position.y = 3 + i * 2.6;
      g.add(r);
    }
    return g;
  },
  lamos: () => models.lamos ?? new THREE.Group(), // cliffs from Blender
  aeaea: () => models.aeaea ?? new THREE.Group(), // Circe's colonnade from Blender
  underworld: () => {                             // a rift and cold light
    const g = new THREE.Group();
    if (models.underworld) g.add(models.underworld);
    for (let i = 0; i < 4; i++) {
      const halo = new THREE.Mesh(new THREE.TorusGeometry(7.5 - i * 1.5, 0.22, 5, 20),
        M(0x7fa6c8, { emissive: 0x3f6a8f, emissiveIntensity: 2.2,
                      transparent: true, opacity: 0.6 - i * 0.1 }));
      halo.rotation.x = Math.PI / 2; halo.position.y = 0.9 + i * 1.6; g.add(halo);
    }
    return g;
  },
  sirens: () => {                                 // rock, two figures, sound rings
    const g = new THREE.Group();
    if (models.sirens) g.add(models.sirens);
    for (let i = 0; i < 3; i++) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(7 + i * 3, 0.16, 4, 20),
        M(0xf0d9a0, { emissive: 0x8a6a26, emissiveIntensity: 1.6,
                      transparent: true, opacity: 0.45 - i * 0.11 }));
      r.rotation.x = Math.PI / 2; r.position.y = 8; g.add(r);
    }
    return g;
  },
  strait: () => models.strait ?? new THREE.Group(),  // Scylla's cliff and necks, from Blender
  /* Charybdis is its own set piece, not a child of Scylla's. Hanging it off the
     strait group put it at an offset that `keepApparentSize` scaled along with
     everything else, so the funnel slid towards Scylla as the camera came in and
     never sat over its own marker.

     The sea is an opaque plane at y=-0.35, so a funnel sunk into it is a funnel
     nobody sees; it stands on the water instead, mouth up and throat down, the way
     Aeolia's rings and the underworld's halos do. Foam colours, because the old
     0x11454f cone was near-invisible against the 0x1d6f7e sea. The tilted rings are
     what makes the spin read — a solid of revolution turning on its own axis does not. */
  charybdis: () => {                              // the whirlpool, procedural throughout
    const g = new THREE.Group();
    g.name = 'vortex';
    const throat = new THREE.Mesh(new THREE.ConeGeometry(5.4, 6, 24, 1, true),
      M(0xcfe6ea, { side: THREE.DoubleSide, emissive: 0x2a4a55, emissiveIntensity: 0.9,
                    transparent: true, opacity: 0.55 }));
    throat.rotation.x = Math.PI; throat.position.y = 3.2;
    g.add(throat);
    for (let i = 0; i < 3; i++) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(5.2 - i * 1.6, 0.26, 5, 20),
        M(0xeef6f7, { emissive: 0x6a9aa6, emissiveIntensity: 1.6,
                      transparent: true, opacity: 0.6 - i * 0.13 }));
      r.rotation.set(Math.PI / 2 + 0.18, 0, i * 2.1);
      r.position.y = 5.6 - i * 1.7;
      g.add(r);
    }
    return g;
  },
  thrinacia: () => {                              // oxen from Blender, sun disc in code
    const g = new THREE.Group();
    if (models.thrinacia) g.add(models.thrinacia);   // the six oxen, from Blender
    const disc = new THREE.Mesh(new THREE.SphereGeometry(2.6, 12, 8),
      M(0xf7c473, { emissive: 0xffa733, emissiveIntensity: 1.1 }));
    disc.position.set(0, 14, -6); g.add(disc);
    const corona = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.14, 4, 22),
      M(0xffcf6a, { emissive: 0xffa733, emissiveIntensity: 1.4,
                    transparent: true, opacity: 0.5 }));
    corona.position.copy(disc.position);
    corona.rotation.x = -Math.PI / 2.6; g.add(corona);
    return g;
  },
  ogygia: () => models.ogygia ?? new THREE.Group(), // island and cypress, from Blender
  ithaca: () => {                                 // palace from Blender, lit windows in code
    const g = new THREE.Group();
    if (models.ithaca) g.add(models.ithaca);
    for (const dx of [-3.2, 0, 3.2]) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.2),
        M(0xffcf6a, { emissive: 0xffb04a, emissiveIntensity: 3 }));
      win.position.set(dx, 3.6, 4.55); g.add(win);
    }
    return g;
  },
};

/* ---- models: one meshopt-compressed GLB, decoded once ----
   Root nodes are named for the setpiece key they serve, and are detached from
   the GLB scene so the builders below can add them to ours directly. Each key
   is used once, so nothing here clones.

   If this fails the page keeps working: land, sea, route, flow, markers, the
   journal, the rail and the no-WebGL fallback are all independent of it. */
async function buildModels() {
  const out = {};
  try {
    const [{ GLTFLoader }, { MeshoptDecoder }] = await Promise.all([
      import('three/addons/loaders/GLTFLoader.js'),
      import('three/addons/libs/meshopt_decoder.module.js'),
    ]);
    await MeshoptDecoder.ready;
    const bin = Uint8Array.from(atob(MODELS_B64), c => c.charCodeAt(0)).buffer;
    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    const gltf = await new Promise((res, rej) => loader.parse(bin, '', res, rej));
    for (const child of [...gltf.scene.children]) {
      gltf.scene.remove(child);
      out[child.name] = child;
    }
  } catch (e) {
    console.warn('models failed to decode; set pieces will be missing', e);
  }
  nostos.models = out;
  return out;
}

function buildSetpieces() {
  const setpieces = {};
  for (const st of core.STOPS) {
    if (!st.setpiece || setpieces[st.setpiece]) continue;
    const build = SETPIECES[st.setpiece];
    if (!build) { console.warn(`no builder for setpiece "${st.setpiece}"`); continue; }
    const obj = build();
    const p = core.lonLatToWorld(...core.markerLonLat(st));
    /* add, not set. Four builders hand the loaded GLB node straight back, and a
       node carries whatever translation Blender's join() left on it — the origin
       of the first part in the list. Overwriting that translation moves the
       whole asset off its own authored centre. Three of the four happen to be at
       the origin; aeaea is at (-6, 4.5, 3), so the colonnade stood six units off
       its marker with its steps 4.5 units under the sea plane. */
    obj.position.add(new THREE.Vector3(p.x, 0, p.z));
    obj.name = `setpiece-${st.setpiece}`;
    scene.add(obj);
    setpieces[st.setpiece] = obj;
  }

  // the one set piece that moves owns its own tick rather than the loop knowing about it
  const vortex = setpieces.charybdis;
  if (vortex) onMotionTick((dt, time) => { vortex.rotation.y = time * 1.6; });

  nostos.setpieces = setpieces;
  return setpieces;
}

/* ---- journal auto-dismiss ----
   The panel covers a third of the map, so it tucks itself away once the reader
   has stopped using it, and returns the moment they do: any navigation, the
   pointer on the panel, or focus moving into it. It never leaves mid-read —
   hover and focus-within both defer the tuck rather than cancelling it — and
   it leaves a strip behind, because content that disappears with no way back
   is a bug. Nothing is removed from the DOM or hidden from assistive tech;
   this is a transform. */
function buildJournal() {
  const IDLE_MS = 20000;           // hovering or focusing the panel defers this
  const panel = document.getElementById('journal');
  const collapseEl = document.getElementById('collapse');
  const railEl = document.getElementById('rail');
  let idleTimer = 0;

  function tuckJournal() {
    document.body.classList.add('journal-away');
    collapseEl.setAttribute('aria-expanded', 'false');
  }

  function wakeJournal() {
    document.body.classList.remove('journal-away');
    collapseEl.setAttribute('aria-expanded', 'true');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function tuck() {
      if (panel.matches(':hover, :focus-within')) {
        idleTimer = setTimeout(tuck, IDLE_MS);       // still being read
        return;
      }
      tuckJournal();
    }, IDLE_MS);
  }

  collapseEl.addEventListener('click', () => {
    clearTimeout(idleTimer);
    tuckJournal();
    /* the button leaves with the panel, so hand focus to the nearest control
       that stays on screen rather than stranding it off canvas */
    railEl.querySelector('button[aria-current="true"]')?.focus({ preventScroll: true });
  });

  panel.addEventListener('pointerenter', wakeJournal);
  panel.addEventListener('focusin', wakeJournal);
  panel.addEventListener('scroll', wakeJournal, { passive: true });

  Object.assign(nostos, { wakeJournal, tuckJournal });
  return { panel, wakeJournal, tuckJournal };
}

/* ---- navigation: one entry point ----
   goToStop(n) is the only thing that mutates current-stop state. Prev/next, the
   year rail, the keyboard and a marker pick all route through it; nothing else
   writes nostos.current. */
function buildNav({ panel, wakeJournal }, { highlightMarker }, { moveShipTo }) {
  const journalEl = document.getElementById('entry');
  const railEl = document.getElementById('rail');
  const prevEl = document.getElementById('prev');
  const nextEl = document.getElementById('next');
  const resetEl = document.getElementById('reset');

  railEl.innerHTML = core.railSegments().map(seg => {
    const years = seg.yearFrom === seg.yearTo
      ? `year ${seg.yearFrom}` : `years ${seg.yearFrom}–${seg.yearTo}`;
    const label = `${seg.numeral}. ${seg.name} — ${years}`;
    return `<button type="button" data-stop="${seg.n}" style="width:${seg.widthPct}%"
      title="${label}" aria-label="${label}">${seg.widthPct > 8 ? seg.name : ''}</button>`;
  }).join('');

  let flight = null;
  const FLIGHT_MS = 1400;

  /* Once the reader has orbited or zoomed, that framing is theirs: navigation
     moves the camera to the next stop but keeps their offset from the target.
     OrbitControls fires 'start' only on real input — a programmatic update()
     fires 'change', not 'start' — so this never trips on our own flights. */
  let adjusted = false;
  controls.addEventListener('start', () => { adjusted = true; });

  function goToStop(n) {
    const s = core.STOPS.find(x => x.n === n);
    if (!s) return;

    const fromStop = nostos.current;               // read before overwriting
    moveShipTo(n, fromStop !== undefined);
    nostos.current = n;

    if (n !== fromStop) {                          // a re-entry to the same stop
      journalEl.innerHTML = core.renderEntry(s);   // (reset view) must not scroll
      panel.scrollTop = 0;                         // the reader back to the top
    }
    wakeJournal();                                 // a new entry is a new read

    railEl.querySelectorAll('button').forEach(b => {
      const on = Number(b.dataset.stop) === n;
      b.setAttribute('aria-current', String(on));
      if (on && railEl.scrollWidth - railEl.clientWidth > 8) {
        b.scrollIntoView({ inline: 'center', block: 'nearest',
                           behavior: reducedMotion ? 'auto' : 'smooth' });
      }
    });
    prevEl.disabled = n === 1;
    nextEl.disabled = n === core.STOPS.length;

    highlightMarker(n);

    const p = core.lonLatToWorld(...core.markerLonLat(s));
    const target = new THREE.Vector3(p.x, 0, p.z);
    const k = Math.min(Math.max(1.5 / camera.aspect, 1), 1.7);  // pull back when narrow

    /* Crowded stops need a closer camera or they collide on screen: Scylla and
       Charybdis are ~18km apart, which is 5px at the standard distance. Only the
       genuinely tight pairs tighten; everything else keeps the basin framing. */
    const nearest = Math.min(...core.STOPS.filter(x => x.n !== n).map(o => {
      const q = core.lonLatToWorld(...core.markerLonLat(o));
      return Math.hypot(q.x - p.x, q.z - p.z);
    }));
    const zoom = Math.min(Math.max(nearest / 10, 0.28), 1);

    /* mid-flight the live camera is part-way between two framings, so the offset
       comes from where the flight was headed */
    const eye = adjusted
      ? target.clone().add((flight ? flight.toP.clone().sub(flight.toT)
                                   : camera.position.clone().sub(controls.target)))
      : new THREE.Vector3(p.x - 58 * k * zoom, 196 * k * zoom, p.z + 168 * k * zoom);
    if (reducedMotion) {
      controls.target.copy(target); camera.position.copy(eye); controls.update();
      flight = null;
    } else {
      flight = { t0: performance.now(),
                 fromT: controls.target.clone(), toT: target,
                 fromP: camera.position.clone(), toP: eye };
    }
  }

  /* the camera flight runs before the label and symbol-scale ticks registered
     after this builder, so both see this frame's camera, not the last one's */
  onTick(() => {
    if (!flight) return;
    const k = easeInOut(Math.min((performance.now() - flight.t0) / FLIGHT_MS, 1));
    controls.target.lerpVectors(flight.fromT, flight.toT, k);
    camera.position.lerpVectors(flight.fromP, flight.toP, k);
    if (k === 1) flight = null;
  });

  resetEl.addEventListener('click', () => { adjusted = false; goToStop(nostos.current); });
  prevEl.addEventListener('click', () => goToStop(nostos.current - 1));
  nextEl.addEventListener('click', () => goToStop(nostos.current + 1));
  railEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-stop]');
    if (b) goToStop(Number(b.dataset.stop));
  });
  addEventListener('keydown', (e) => {
    /* e.target is not always an Element — a key pressed with focus on the document
       or the window has no matches(), and calling it there throws */
    if (e.target instanceof Element && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goToStop(nostos.current + 1); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); goToStop(nostos.current - 1); }
  });

  nostos.goToStop = goToStop;
  nostos.onMarkerPick = goToStop;                  // late-bound in buildMarkers
  return { goToStop };
}

/* ---- symbol scale ----
   Markers, the ship and the set pieces are map symbols, not scenery: they hold
   their apparent size as the camera closes in instead of swelling to fill the
   view. World scale tracks camera distance up to REF_DIST — the standard stop
   framing — and stops there, so the pulled-back basin view is unchanged. The
   floor keeps a symbol from collapsing at controls.minDistance. */
function buildApparentSize({ markers, halo }, { ship }, setpieces) {
  const REF_DIST = 265;
  const MIN_SCALE = 0.15;   // controls.minDistance / REF_DIST — constant all the way in
  const apparent = [...markers, halo, ship, ...Object.values(setpieces)];
  for (const o of apparent) o.userData.baseScale ??= o.scale.x;

  function keepApparentSize() {
    for (const o of apparent) {
      const f = Math.min(camera.position.distanceTo(o.position) / REF_DIST, 1);
      o.scale.setScalar(o.userData.baseScale * Math.max(f, MIN_SCALE));
    }
  }
  onTick(keepApparentSize);

  nostos.keepApparentSize = keepApparentSize;
  return keepApparentSize;
}

/* ---- map labels: names projected onto the canvas ----
   The seventeen stop names and the classical sea names. Placement is greedy:
   the current stop first, then the route in order, then the seas. A name that
   would land on one already placed is dropped for that frame rather than
   stacked on top of it, which is what keeps Scylla and Charybdis legible at
   one zoom and the whole basin legible at another. */
function buildLabels() {
  const labelsEl = document.getElementById('labels');
  const labels = [
    ...core.STOPS.map(s => ({ kind: 'stop', n: s.n, text: s.name,
                              at: core.lonLatToWorld(...core.markerLonLat(s)) })),
    ...core.SEAS.map(([text, lon, lat]) => ({ kind: 'sea', text,
                                              at: core.lonLatToWorld(lon, lat) })),
  ];
  for (const l of labels) {
    l.el = document.createElement('span');
    l.el.className = l.kind;
    l.el.textContent = l.text;
    labelsEl.appendChild(l.el);
    l.v = new THREE.Vector3(l.at.x, l.kind === 'stop' ? 5 : 0, l.at.z);
  }

  const placed = [];
  const labelV = new THREE.Vector3();
  let labelCurrent = null, labelOrder = labels;

  function placeLabel(l, inset) {
    labelV.copy(l.v).project(camera);
    if (labelV.z > 1) { l.el.style.opacity = '0'; return; }   // behind the camera
    if (!l.w) { l.w = l.el.offsetWidth; l.h = l.el.offsetHeight; }
    // a stop name sits beside its marker; a sea name centres on its point
    const x = (labelV.x * 0.5 + 0.5) * innerWidth + (l.kind === 'stop' ? 11 : -l.w / 2);
    const y = (-labelV.y * 0.5 + 0.5) * innerHeight - l.h / 2;
    const r = [x, y, x + l.w, y + l.h];
    const clear = r[0] > inset.panelW + 8 && r[1] > 8 &&
                  r[2] < innerWidth - 8 && r[3] < innerHeight - inset.covered - 4 &&
                  !placed.some(q => r[0] < q[2] && r[2] > q[0] &&
                                    r[1] < q[3] && r[3] > q[1]);
    if (!clear) { l.el.style.opacity = '0'; return; }
    placed.push([r[0] - 6, r[1] - 4, r[2] + 6, r[3] + 4]);   // keep names off each other
    l.el.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
    l.el.style.opacity = '1';
  }

  function layoutLabels() {
    const inset = uiInset();
    // the tucked panel frees its side of the canvas for names
    if (document.body.classList.contains('journal-away')) {
      inset.panelW = 0; inset.covered = RAIL_PX;
    }
    const cur = labels.find(l => l.n === nostos.current);
    if (cur !== labelCurrent) {
      labels.forEach(l => l.el.classList.toggle('on', l === cur));
      labelCurrent = cur;
      /* first claim on the space goes to the stop being read, then to its
         neighbours in the voyage, then to the seas — so the legs either side
         of the current stop keep their names in a crowded cluster. */
      const rank = l => l.kind === 'sea' ? 99 : Math.abs(l.n - (cur ? cur.n : 1));
      labelOrder = labels.slice().sort((a, b) => rank(a) - rank(b));
    }
    placed.length = 0;
    for (const l of labelOrder) placeLabel(l, inset);
  }
  onTick(layoutLabels);

  nostos.labels = labels;
  return { labels, layoutLabels };
}


/* ===================== ASSEMBLY =====================
   The call order IS the dependency graph, and the tick registration order that
   falls out of it is the per-frame order. A new layer goes in here, at the
   point where the things it needs already exist. */

const models    = await buildModels(); // before buildShip and buildSetpieces, both may read it
buildSea();
buildLand();
const route     = buildRoute();
buildFlow();
const markerLot = buildMarkers();
const shipLot   = buildShip(route.curve);
const setpieces = buildSetpieces();
const journal   = buildJournal();
const nav       = buildNav(journal, markerLot, shipLot);
buildApparentSize(markerLot, shipLot, setpieces);
buildLabels();

/* the triangle budget is a whole-scene number, so it is counted once here,
   after every layer has added its geometry */
{
  let tris = 0;
  scene.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  });
  nostos.triangles = tris;
}

/* ---- page chrome fed from core ---- */
document.getElementById('fallback').innerHTML = core.renderFallback();
document.getElementById('route-note').textContent = core.ROUTE_NOTE;
document.getElementById('flow-note').textContent = core.FLOW_NOTE;
document.getElementById('credit').innerHTML =
  `${core.ATTRIBUTION.text} <a href="${core.ATTRIBUTION.href}" target="_blank" ` +
  `rel="noopener noreferrer">Source map</a> (${core.ATTRIBUTION.licence}). ` +
  `Coastlines from Natural Earth (public domain).`;


/* ===================== FRAME LOOP =====================
   Every registered tick, then one render. Nothing subsystem-specific lives
   here; a layer that wants a frame calls onTick or onMotionTick in its builder.
   THREE.Clock is deprecated in 0.185.1 and performance.now() needs no addon.
   dt is clamped so a long hidden-tab pause cannot jump the animations. */
const T0 = performance.now();
let tPrev = T0;
let captureDrawCalls = true;
function frame() {
  if (document.hidden) return;                 // paused; resumed below
  const tNow = performance.now();
  const dt = Math.min((tNow - tPrev) / 1000, 0.1);
  const time = (tNow - T0) / 1000;
  tPrev = tNow;
  for (const tick of ticks) tick(dt, time);
  if (captureDrawCalls) renderer.info.reset();
  renderer.render(scene, camera);
  if (captureDrawCalls) {
    nostos.drawCalls = renderer.info.render.calls;
    captureDrawCalls = false;
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { tPrev = performance.now(); frame(); }
});

shipLot.moveShipTo(1, false);
nav.goToStop(1);
frame();


/* ===================== SELFTEST ===================== */
/* Scene-side checks. They cannot live in core.selftest, which is pure and has no
   scene — so they produce the same {name, ok, detail} shape and are concatenated. */
function sceneChecks() {
  const out = [];
  const check = (name, fn) => {
    try { const d = fn(); out.push({ name, ok: d === true, detail: d === true ? 'ok' : String(d) }); }
    catch (e) { out.push({ name, ok: false, detail: e.message }); }
  };
  check('models decoded', () => Object.keys(models).length === 11 ||
    `got ${Object.keys(models).length}: ${Object.keys(models).join(', ')}`);
  check('every setpiece key has a node', () => {
    const need = [...new Set(core.STOPS.map(s => s.setpiece).filter(Boolean))];
    /* aeolia and charybdis are pure effects — wind rings and a foam funnel — and
       design_blender_models.md section 7 keeps both out of the GLB by design */
    const bad = need.filter(k => !['aeolia', 'charybdis'].includes(k) && !models[k]);
    return bad.length === 0 || bad.join(', ');
  });
  check('scene triangles under 150k', () =>
    nostos.triangles < 150000 || `${nostos.triangles}`);
  check('draw calls under 120', () => nostos.drawCalls < 120 || `${nostos.drawCalls}`);
  check('models payload under 256KB', () =>
    MODELS_B64.length < 256000 || `${MODELS_B64.length}`);
  return out;
}

/* ?selftest=1 — banner plus console table */
if (new URLSearchParams(location.search).has('selftest')) {
  const r = core.selftest(Object.keys(setpieces));
  r.results.push(...sceneChecks());
  r.pass = r.results.every(x => x.ok);
  const el = document.createElement('div');
  el.id = 'selftest';
  el.style.background = r.pass ? '#123d1e' : '#4d1218';
  el.style.color = '#f4ecd8';
  el.textContent = `SELFTEST ${r.pass ? 'PASS' : 'FAIL'}\n` +
    r.results.map(x => `${x.ok ? '  ok  ' : ' FAIL '} ${x.name} — ${x.detail}`).join('\n');
  document.body.appendChild(el);
  console.table(r.results);
}

}

</script>
