        // Applied before first paint so the page never flashes the wrong theme.
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var dark = stored ? stored === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.setAttribute('data-theme', 'dark');

# Browser verification procedure

Serve and open the page:

    python3 -m http.server 8137 &
    # then, via Chrome DevTools MCP:
    #   navigate_page  http://localhost:8137/index.html
    #   list_console_messages   -> expect zero errors
    #   evaluate_script         -> the assertion for the current task

## Task 4 assertion

    () => {
      const n = window.__nostos;
      return { ready: n?.ready === true,
               hasCanvas: !!document.querySelector('canvas'),
               dpr: n?.renderer.getPixelRatio(),
               sea: !!n?.scene.getObjectByName('sea') };
    }

Expect: ready true, hasCanvas true, dpr <= 2, sea true.

## Task 5 assertion

    () => {
      const n = window.__nostos;
      return { land: !!n.scene.getObjectByName('land'),
               triangles: n.triangles,
               underBudget: n.triangles < 50000 };
    }

Expect: land true, underBudget true.

## Task 6 assertion

    () => !!window.__nostos.scene.getObjectByName('route')

Expect: true, dots visible arcing over water in a screenshot.

## Task 7 assertion

    () => {
      const n = window.__nostos;
      return { count: n.markers?.length,
               allNamed: n.markers?.every((m, i) => m.name === `marker-${i + 1}`),
               aboveSea: n.markers?.every(m => m.position.y > 0) };
    }

Expect: count 17, allNamed true, aboveSea true.

## Task 10 assertions

    () => typeof window.__nostos.goToStop

Expect: "function".

    () => { window.__nostos.goToStop(9);
            return { current: window.__nostos.current,
                     journal: document.querySelector('#journal h2')?.textContent,
                     railCurrent: document.querySelector('#rail button[aria-current="true"]')
                                    ?.dataset.stop,
                     halo: window.__nostos.halo.visible,
                     haloOnStop: window.__nostos.halo.position.equals(window.__nostos.markers[8].position) }; }

Expect: current 9, journal "Aeaea", railCurrent "9", halo true, haloOnStop true.
(One shared halo mesh is parked on the current marker rather than one per marker.)

    () => { window.__nostos.goToStop(1);
            const prevDisabled = document.getElementById('prev').disabled;
            window.__nostos.goToStop(17);
            return { prevDisabledAtStart: prevDisabled,
                     nextDisabledAtEnd: document.getElementById('next').disabled }; }

Expect: both true.

Keyboard: focus the page, press ArrowRight twice from stop 1, expect current 3.

## Task 11 assertion

    () => { window.__nostos.goToStop(6);
            const s = window.__nostos.ship;
            const m = window.__nostos.markers[5].position;
            return { exists: !!s,
                     nearMarker: s && Math.hypot(s.position.x - m.x, s.position.z - m.z) < 60 }; }

Expect: exists true, nearMarker true (after the flight settles — re-run if needed).

## Task 12 assertion

    () => {
      const n = window.__nostos;
      const keys = [...new Set(n.core.STOPS.map(s => s.setpiece).filter(Boolean))];
      return { keys: keys.length,
               built: keys.every(k => !!n.setpieces[k]),
               triangles: n.triangles, underBudget: n.triangles < 50000 };
    }

Expect: keys 11, built true, underBudget true.

## Task 13: full verification pass

Recorded 2026-08-28 against the finished page.

    python3 -m http.server 8137 &

| Check | How | Result |
|---|---|---|
| Selftest | `?selftest=1` | PASS, 9/9 checks ok |
| Console | `list_console_messages` | zero errors (only the intentional `console.table` under `?selftest=1`) |
| Triangles | `__nostos.triangles` | 47,074, under the 50k budget |
| Desktop | 1440x900 screenshot | journal is a side panel, rail readable, all set pieces render |
| Mobile | 390x844 screenshot | journal is an opaque bottom sheet, rail scrolls, stop stays in the visible half |
| Reduced motion | `initScript` stubbing `matchMedia` | jump-cut, no dot wave, still sea, journal still updates |
| No WebGL | `documentElement.classList.add('no-webgl')` | 17 `<li>`, 35 links, stage and rail hidden |
| Lighthouse | desktop and mobile, navigation | Accessibility 100, Best Practices 100, SEO 100 |
| Nav: prev/next | `#prev` / `#next` click | steps and disables at the ends |
| Nav: rail | `#rail button[data-stop]` click | selects, `aria-current` follows |
| Nav: marker | synthetic `pointerdown` on a projected bead | selects that stop |
| Nav: keyboard | ArrowRight/ArrowLeft | steps; all 17 walked in order, journal/rail/halo in sync |
| Free browsing | OrbitControls | rotate and zoom enabled, 40..900 clamp |
| Stop 12/13 | projected bead separation | 32px apart against a 15px bead radius, individually clickable |

### Assertion for the whole walk

    async () => { const n = window.__nostos, out = [];
      n.goToStop(1);
      for (let i = 1; i <= 17; i++) {
        if (i > 1) dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
        out.push({ n: n.current,
                   name: document.querySelector('#entry h2').textContent,
                   rail: document.querySelector('#rail button[aria-current="true"]').dataset.stop,
                   haloOn: n.halo.visible && n.halo.position.equals(n.markers[i-1].position) });
      }
      return out.every((r, i) => r.n === i+1 && r.rail === String(i+1) && r.haloOn); }

Expect: `true`.

    <script src="../../../vendor/marked.min.js"></script>
    <script>
        // The source block carries the Markdown verbatim except for two escaped
        // sequences; the same substitution runs in reverse here. See
        // escape_markdown_block in scripts/artefacts.py.
        (function () {
            // textContent starts at the newline that follows the opening tag, which
            // the Python-side extract_markdown slice does not include. Drop it so
            // both sides see the same bytes.
            var raw = document.getElementById('markdown-source').textContent.replace(/^\n/, '');
            var text = raw.replace(/<(\\+)(\/script|!--)/gi, function (match, slashes, marker) {
                return '<' + slashes.slice(1) + marker;
            });
            var body = document.getElementById('markdown-body');
            body.innerHTML = marked.parse(text);
            // Most documents open with their own H1, and the proposal derives the
            // manifest title from exactly that heading, so the page would print the
            // title twice. Drop the article's copy when it repeats the header rather
            // than stripping it from the source, which has to stay byte-exact.
            // The H1 is not always the first element — several sources open with a
            // banner line — so match on the first H1 anywhere in the article. Equal
            // text is the whole test: a heading that differs really does say
            // something else, and both copies stay.
            var lead = body.querySelector('h1');
            var heading = document.querySelector('header h1');
            if (lead && heading &&
                lead.textContent.trim() === heading.textContent.trim()) {
                lead.remove();
            }
        })();
    </script>
