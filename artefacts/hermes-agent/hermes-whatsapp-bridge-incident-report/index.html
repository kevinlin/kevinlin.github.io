# Hermes WhatsApp Bridge Phantom Messages — Incident Report

**Date:** July 24, 2026  
**Severity:** Medium (cost impact, no data loss, no user-facing breach)  
**Status:** Resolved

---

## Summary

The Hermes WhatsApp bridge generated 113 phantom inbound messages ("Evening Mark" / "Morning CK") over ~26 hours due to a corrupted signal encryption session. The bridge misinterpreted WhatsApp protocol sync events as user messages, each triggering a full DeepSeek API response. Concurrently, a SQLite FTS index corruption prevented session transcript persistence, and stale routing entries caused session recovery loops.

---

## Timeline (SGT)

| Time | Event |
|------|-------|
| Jul 23, 09:31 | First phantom "Morning CK" message. Stale routing: `20260721_143741_dda32e8b` ended but live in sessions.json |
| Jul 23, 09:31–23:35 | ~30 phantom messages across daytime hours |
| Jul 24, 00:05–06:55 | ~25 messages through the night (sustained, not a burst) |
| Jul 24, 04:13 | Stale routing #2: `20260723_201041_7c5a5dec` ended but live; session `20260724_041316_aa7c688c` created |
| Jul 24, 08:00–10:58 | ~30 messages in morning cluster |
| Jul 24, 10:58 | Gateway restarted with access-control tightening (`WHATSAPP_ALLOWED_USERS=6591282795`, groups denied) |
| Jul 24, 11:05 | FTS corruption detected: disk=0, memory=128 — transcript persistence blocked |
| Jul 24, 11:07 | FTS warning: disk=2, memory=130 |
| Jul 24, 11:10 | Cross-process write: `message_count changed (5 → 9)` — desktop agent and gateway racing on state.db |
| Jul 24, 11:05–11:18 | Final 5 phantom messages |
| Jul 24, ~11:18 | User reported not sending messages |
| Jul 24, ~11:20 | Root cause identified: corrupted signal encryption session + FTS corruption + stale routing |
| Jul 24, ~11:22 | FTS index rebuilt, gateway restarted |
| Jul 24, ~11:25 | Bridge re-paired (fresh QR code scan) → clean signal session |
| Jul 24, ~11:27 | Gateway restarted, verified healthy. Zero phantom messages post-re-pair. |

---

## Root Causes

### Primary: Corrupted signal encryption session

The Baileys bridge's Signal Protocol session with WhatsApp servers was desynchronized. Evidence:
- 257× `MessageCounterError: Key used already or never filled`
- 240× `fromMe:true` with `failed to decrypt message`
- 11× `failed to sync regular_high from v0, giving up`
- `invalid wire type 6 at offset 1` protobuf decode failures

WhatsApp protocol sync events that should be silently consumed were instead misinterpreted as inbound user messages, producing stale conversation content ("Evening Mark" / "Morning CK") from the bridge's internal state.

### Secondary: FTS index corruption

SQLite FTS index in `state.db` was broken, preventing the WhatsApp session from persisting messages. The gateway held 128-130 messages in memory (0-2 on disk), causing "Persisted transcript lagged live cached history" warnings.

### Tertiary: Stale sessions.json routing

Ended sessions (`20260721_143741_dda32e8b`, `20260723_201041_7c5a5dec`) were not cleaned from `sessions.json` after completion. The gateway had to recover/recreate sessions on each new message, contributing to session state confusion.

### Contributing: Cross-process writes

The desktop agent process and gateway process both wrote to the same `state.db` session rows simultaneously (`message_count changed (5 → 9), possible cross-process write`).

---

## Impact

| Metric | Value |
|--------|-------|
| Phantom messages | 113 over ~26 hours |
| Agent responses generated | 113 (each consumed DeepSeek API tokens) |
| Session affected | `20260724_041316_aa7c688c` (WhatsApp DM) |
| Bridge decryption errors | 257 `failed to decrypt`, 240 `MessageCounterError` |
| Data loss | None (messages were phantom, not real user data) |
| User-visible impact | Session `20260724_041316_aa7c688c` appeared with fake conversation history |

---

## Resolution

1. **Access control hardened:** `WHATSAPP_ALLOWED_USERS=*` → `6591282795`, `group_policy: deny`, `unauthorized_dm_behavior: ignore`
2. **FTS index rebuilt:** `INSERT INTO messages_fts(messages_fts) VALUES('rebuild')`
3. **Bridge re-paired:** Fresh QR scan → clean signal session
4. **Gateway restarted** with clean routing state

---

## Detection Gaps (why this went unnoticed for 26 hours)

- No automated health check on bridge decryption error rate
- No alert on phantom message rate (spike in inbound messages from same chat)
- No monitoring of FTS write failures
- No detection of stale sessions.json entries
- Manual investigation required to correlate across gateway.log, bridge.log, and state.db
